<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OAB/PA Master — Gestão do Time</title>
<link rel="icon" type="image/png" href="escudo.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#B8272D">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root {
  --bg: #F6F4EF;
  --card: #FFFFFF;
  --ink: #23262E;
  --ink2: #5C616E;
  --p: #B8272D;
  --p-soft: #F7E5E2;
  --ok: #2E7D4F;
  --ok-soft: #E2F1E7;
  --bad: #B3372E;
  --bad-soft: #F9E7E5;
  --warn: #A86A12;
  --warn-soft: #F8EEDD;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body { background: var(--bg); color: var(--ink); font: 15px/1.55 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
h1, h2, h3 { font-family: Georgia, serif; margin: 0; }
h1 { font-size: 26px; }
h2 { font-size: 20px; margin-bottom: 12px; }
button { font: inherit; cursor: pointer; border: none; border-radius: 9px; padding: 8px 14px; background: var(--p); color: #fff; transition: filter 0.15s; }
button:hover { filter: brightness(1.08); }
button.sec { background: var(--card); color: var(--ink); border: 1px solid #ddd; }
button.mini { padding: 4px 10px; font-size: 13px; }
input, select, textarea { font: inherit; color: var(--ink); background: var(--card); border: 1px solid #ddd; border-radius: 9px; padding: 8px 10px; width: 100%; }
label { display: block; font-size: 12px; font-weight: 600; color: var(--ink2); margin: 10px 0 4px; text-transform: uppercase; }
.card { background: var(--card); border: 1px solid #ddd; border-radius: 14px; padding: 18px; }
.pill { display: inline-block; padding: 2px 10px; border-radius: 99px; font-size: 12px; font-weight: 600; }
.p-ok { background: var(--ok-soft); color: var(--ok); }
.p-warn { background: var(--warn-soft); color: var(--warn); }
.p-bad { background: var(--bad-soft); color: var(--bad); }
.grid { display: grid; gap: 14px; }
.g2 { grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.mut { color: var(--ink2); font-size: 13px; }
#shell { min-height: 100vh; display: flex; flex-direction: column; }
#nav { background: var(--card); border-bottom: 1px solid #ddd; padding: 10px; display: flex; gap: 8px; overflow-x: auto; }
.navb { background: transparent; border: none; padding: 8px 14px; cursor: pointer; border-radius: 8px; }
.navb.on { background: var(--p); color: white; }
#main { flex: 1; padding: 20px; max-width: 1200px; margin: 0 auto; width: 100%; }
.toast { position: fixed; bottom: 20px; right: 20px; background: var(--p); color: white; padding: 12px 16px; border-radius: 8px; display: none; z-index: 9999; }
.toast.show { display: block; }
</style>
</head>
<body>
<div id="shell">
  <div id="nav"></div>
  <div id="main"></div>
</div>
<div id="toast" class="toast"></div>

<script>
'use strict';

const SB_URL = 'https://pzodgfsekqpumvgigeii.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB6b2RnZnNla3FwdW12Z2lnZWlpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQyNjEyNzYsImV4cCI6MjA5OTgzNzI3Nn0.-tQn-ECR6t-waBBuihIesi6LhxJ3s22xORzR3OwMoeQ';
const sb = window.supabase.createClient(SB_URL, SB_KEY);

let db = null;
let me = null;
let tab = 'dashboard';
let subTab = 'cobracas';

const $ = id => document.getElementById(id);
const esc = s => String(s || '').replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const brl = v => (Number(v) || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
const toast = msg => { $('toast').textContent = msg; $('toast').classList.add('show'); setTimeout(() => $('toast').classList.remove('show'), 3000); };

async function carregaTudo() {
  const { data: { user } } = await sb.auth.getUser();
  if (!user) { renderLogin(); return; }

  const { data: perfil } = await sb.from('perfis').select('*').eq('id', user.id).single();
  me = perfil;

  const { data: config } = await sb.from('config').select('*').single();
  const { data: atletas } = await sb.from('perfis').select('*');
  const { data: cobrancas } = await sb.from('cobrancas').select('*');
  const { data: despesas } = await sb.from('despesas').select('*');
  const { data: uniformes } = await sb.from('uniformes').select('*');
  const { data: eventos } = await sb.from('eventos').select('*');

  db = { config, atletas, cobrancas, despesas, uniformes, eventos };
  renderShell();
}

function renderLogin() {
  $('shell').innerHTML = `
    <div style="flex:1;display:flex;align-items:center;justify-content:center;padding:20px">
      <div class="card" style="max-width:400px;width:100%">
        <h1 style="text-align:center;margin-bottom:24px">⚽ OAB/PA Master</h1>
        <label>Email</label>
        <input id="email" type="email" placeholder="seu@email.com">
        <label style="margin-top:12px">Senha</label>
        <input id="senha" type="password" placeholder="••••••••">
        <button style="width:100%;margin-top:20px" onclick="fazerLogin()">Entrar</button>
      </div>
    </div>
  `;
}

async function fazerLogin() {
  const email = $('email').value;
  const senha = $('senha').value;
  if (!email || !senha) { toast('Preencha email e senha'); return; }

  const { error } = await sb.auth.signInWithPassword({ email, senha });
  if (error) { toast('Erro: ' + error.message); return; }

  carregaTudo();
}

function renderShell() {
  const tabs = ['dashboard', 'atletas', 'financeiro', 'uniformes'];
  const labels = ['📊 Dashboard', '👥 Atletas', '💰 Financeiro', '👕 Uniformes'];

  const tabs2 = ['dashboard', 'atletas', 'financeiro', 'uniformes', 'eventos', 'taticas', 'documentos', 'saude', 'ajustes'];
  const labels2 = ['📊 Dashboard', '👥 Atletas', '💰 Financeiro', '👕 Uniformes', '📅 Agenda', '📋 Táticas', '📄 Documentos', '🏥 Saúde', '⚙️ Ajustes'];
  $('nav').innerHTML = labels2.map((l, i) => '<button class="navb ' + (tab === tabs2[i] ? 'on' : '') + '" onclick="vai(\'' + tabs2[i] + '\')">' + l + '</button>').join('') + '<button class="navb sec" style="margin-left:auto" onclick="sair()">Sair</button>';

  $('main').innerHTML = getTabContent();
}

function vai(t) {
  tab = t;
  renderShell();
}

async function sair() {
  await sb.auth.signOut();
  carregaTudo();
}

function getTabContent() {
  switch(tab) {
    case 'dashboard':
      const pendencias = db.cobrancas.filter(c => c.status !== 'pago').length;
      const totalPago = db.cobrancas.filter(c => c.status === 'pago').reduce((s,c) => s + Number(c.valor), 0);
      const totalDesp = db.despesas.reduce((s,d) => s + Number(d.valor), 0);
      return `<h1>📊 Dashboard</h1><div class="grid g2"><div class="card"><div style="font-size:28px;font-weight:bold;color:var(--ok)">${db.atletas.length}</div><div class="mut">Jogadores</div></div><div class="card"><div style="font-size:28px;font-weight:bold;color:var(--bad)">${pendencias}</div><div class="mut">Pendências</div></div><div class="card"><div style="font-size:28px;font-weight:bold;color:var(--ok)">${brl(totalPago)}</div><div class="mut">Receita</div></div><div class="card"><div style="font-size:28px;font-weight:bold;color:var(--bad)">${brl(totalDesp)}</div><div class="mut">Despesas</div></div></div>`;

    case 'atletas':
      return `<h1>👥 Atletas</h1><div class="card"><table style="width:100%;border-collapse:collapse"><tr><th style="text-align:left;padding:8px;border-bottom:2px solid #ddd">Nome</th><th style="text-align:left;padding:8px;border-bottom:2px solid #ddd">Posição</th><th style="text-align:left;padding:8px;border-bottom:2px solid #ddd">Status</th></tr>${db.atletas.map(a => '<tr><td style="padding:8px;border-bottom:1px solid #ddd">' + esc(a.nome) + '</td><td style="padding:8px;border-bottom:1px solid #ddd;font-size:13px;color:var(--ink2)">' + esc(a.posicao || '—') + '</td><td style="padding:8px;border-bottom:1px solid #ddd"><span class="pill ' + (a.ativo ? 'p-ok' : 'p-bad') + '">' + (a.ativo ? 'Ativo' : 'Inativo') + '</span></td></tr>').join('')}</table></div>`;

    case 'financeiro':
      const cobPendentes = db.cobrancas.filter(c => c.status !== 'pago');
      const cobPagas = db.cobrancas.filter(c => c.status === 'pago');
      const totalCobPagos = cobPagas.reduce((s,c) => s + Number(c.valor), 0);
      const totalDesp2 = db.despesas.reduce((s,d) => s + Number(d.valor), 0);
      return `<h1>💰 Financeiro</h1><div class="row" style="gap:8px;margin-bottom:16px"><button class="mini" onclick="subTab='cobracas';renderShell()">💳 Cobranças</button><button class="mini" onclick="subTab='despesas';renderShell()">📋 Despesas</button><button class="mini" onclick="subTab='balanco';renderShell()">📊 Balanço</button></div><div class="card">${getFinanceiroTab()}</div>`;

    case 'uniformes':
      return `<h1>👕 Uniformes</h1><div class="card"><table style="width:100%;border-collapse:collapse"><tr><th style="text-align:left;padding:8px;border-bottom:2px solid #ddd">Descrição</th><th style="text-align:left;padding:8px;border-bottom:2px solid #ddd">Números</th><th style="text-align:left;padding:8px;border-bottom:2px solid #ddd">Status</th></tr>${db.uniformes.map(u => '<tr><td style="padding:8px;border-bottom:1px solid #ddd">' + esc(u.descricao) + '</td><td style="padding:8px;border-bottom:1px solid #ddd;font-size:13px">' + esc(u.numero) + '</td><td style="padding:8px;border-bottom:1px solid #ddd"><span class="pill p-ok">OK</span></td></tr>').join('')}</table></div>`;

    case 'eventos':
      return '<h1>📅 Agenda</h1><div class="card"><h2>Próximos Eventos</h2>' + (db.eventos.length ? '<div>' + db.eventos.map(e => '<div style="padding:8px;margin:8px 0;background:var(--blue-soft);border-radius:6px"><strong>' + esc(e.titulo) + '</strong><br><span class="mut">' + esc(e.data) + ' às ' + esc(e.hora) + ' - ' + esc(e.local) + '</span></div>').join('') + '</div>' : '<p class="mut">Nenhum evento</p>') + '</div>';

    case 'saude':
      return '<h1>🏥 Saúde</h1><div class="card"><h2>Registros</h2>' + (db.saude && db.saude.length ? '<div>' + db.saude.map(s => '<div style="padding:8px;margin:8px 0;background:#f0f0f0;border-radius:6px"><strong>' + (s.tipo || 'Registro') + '</strong><br><span class="mut">Data: ' + esc(s.data || '—') + '</span></div>').join('') + '</div>' : '<p class="mut">Nenhum registro de saúde</p>') + '</div>';

    case 'taticas':
      return '<h1>📋 Táticas</h1><div class="card"><h2>Esquemas Táticos</h2>' + (db.taticas && db.taticas.length ? '<div>' + db.taticas.map(t => '<div style="padding:8px;margin:8px 0;background:#f0f0f0;border-radius:6px"><strong>' + esc(t.formacao || 'Esquema') + '</strong><br><span class="mut">Data: ' + esc(t.data || '—') + '</span></div>').join('') + '</div>' : '<p class="mut">Nenhuma tática registrada</p>') + '</div>';

    case 'documentos':
      return '<h1>📄 Documentos</h1><div class="card"><h2>Arquivos</h2>' + (db.documentos && db.documentos.length ? '<div>' + db.documentos.map(d => '<div style="padding:8px;margin:8px 0;background:#f0f0f0;border-radius:6px"><strong>' + esc(d.tipo || 'Documento') + '</strong><br><span class="mut">Pessoa: ' + esc(d.pessoa || '—') + ' | Data: ' + esc(d.data || '—') + '</span></div>').join('') + '</div>' : '<p class="mut">Nenhum documento</p>') + '</div>';

    case 'ajustes':
      return '<h1>⚙️ Ajustes</h1><div class="card"><h2>Configurações do Time</h2><label>Nome do Time:</label><input type="text" id="teamName" value="' + esc((db.config && db.config.team_name) || 'OAB/PA Master') + '" style="margin-bottom:12px"><label>Mensalidade Padrão (R$):</label><input type="number" id="teamFee" value="' + ((db.config && db.config.default_fee) || 0) + '" style="margin-bottom:12px"><button class="mini" style="margin-top:12px" onclick="alert(\'Ajustes salvos!\')">Salvar Ajustes</button></div>';

    default: return '<p>Tab não encontrada</p>';
  }
}

function getFinanceiroTab() {
  if (subTab === 'cobracas') {
    const cobPendentes = db.cobrancas.filter(c => c.status !== 'pago');
    const cobPagas = db.cobrancas.filter(c => c.status === 'pago');
    const totalPendente = cobPendentes.reduce((s,c) => s + Number(c.valor), 0);
    const totalPago = cobPagas.reduce((s,c) => s + Number(c.valor), 0);
    return '<h2>💳 Cobranças</h2><p class="mut">Pendente: <strong>' + brl(totalPendente) + '</strong> | Pago: <strong>' + brl(totalPago) + '</strong></p>' + (cobPendentes.length ? '<div>' + cobPendentes.map(c => '<div style="padding:8px;margin:8px 0;background:var(--warn-soft);border-radius:6px"><strong>' + esc(c.desc) + '</strong><br><span class="mut">' + brl(c.valor) + '</span></div>').join('') + '</div>' : '<p class="mut">Nenhuma pendência</p>');
  } else if (subTab === 'despesas') {
    const totalDesp = db.despesas.reduce((s,d) => s + Number(d.valor), 0);
    return '<h2>📋 Despesas</h2><p class="mut">Total: <strong>' + brl(totalDesp) + '</strong></p>' + (db.despesas.length ? '<div>' + db.despesas.map(d => '<div style="padding:8px;margin:8px 0;background:var(--bad-soft);border-radius:6px"><strong>' + esc(d.item) + '</strong><br><span class="mut">' + esc(d.categoria) + ' - ' + brl(d.valor) + '</span></div>').join('') + '</div>' : '<p class="mut">Nenhuma despesa</p>');
  } else {
    const totalRec = db.cobrancas.filter(c => c.status === 'pago').reduce((s,c) => s + Number(c.valor), 0);
    const totalDesp = db.despesas.reduce((s,d) => s + Number(d.valor), 0);
    const saldo = totalRec - totalDesp;
    return '<h2>📊 Balanço</h2><div class="grid g3"><div><div style="font-size:20px;font-weight:bold;color:var(--ok)">' + brl(totalRec) + '</div><div class="mut">Receitas</div></div><div><div style="font-size:20px;font-weight:bold;color:var(--bad)">' + brl(totalDesp) + '</div><div class="mut">Despesas</div></div><div><div style="font-size:20px;font-weight:bold;color:' + (saldo >= 0 ? 'var(--ok)' : 'var(--bad)') + '">' + brl(saldo) + '</div><div class="mut">Saldo</div></div></div>';
  }
}

carregaTudo();
</script>
</body>
</html>
