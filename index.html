<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OAB/PA Master — Gestão do Time</title>
<style>
:root {
  --primary: #B8272D;
  --bg: #F6F4EF;
  --card: #FFFFFF;
  --text: #23262E;
  --text-light: #5C616E;
  --border: #E1DFD8;
}

* { box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--text);
}

.login-container {
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  background: linear-gradient(135deg, var(--primary) 0%, #8b1f28 100%);
  padding: 20px;
}

.login-box {
  background: var(--card);
  border-radius: 12px;
  padding: 40px;
  width: 100%;
  max-width: 400px;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
}

.login-box h1 {
  text-align: center;
  color: var(--primary);
  margin: 0 0 30px 0;
  font-size: 24px;
}

.crest {
  text-align: center;
  font-size: 64px;
  margin-bottom: 20px;
}

.form-group {
  margin-bottom: 20px;
}

.form-group label {
  display: block;
  margin-bottom: 8px;
  font-weight: 500;
  font-size: 14px;
  color: var(--text);
}

.form-group input {
  width: 100%;
  padding: 12px;
  border: 1px solid var(--border);
  border-radius: 6px;
  font-size: 14px;
}

.form-group input:focus {
  outline: none;
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(184, 39, 45, 0.1);
}

.btn {
  padding: 12px 24px;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  font-weight: 600;
  font-size: 14px;
  width: 100%;
  margin-top: 12px;
  transition: all 0.2s;
}

.btn-primary {
  background: var(--primary);
  color: white;
}

.btn-primary:hover {
  background: #a01f26;
  transform: translateY(-2px);
}

.alert {
  padding: 12px 16px;
  border-radius: 6px;
  margin-bottom: 20px;
  font-size: 14px;
}

.alert-error {
  background: #f8d7da;
  color: #721c24;
  border-left: 4px solid #721c24;
}

.alert-success {
  background: #d4edda;
  color: #155724;
  border-left: 4px solid #155724;
}

#main-page { display: none; }
</style>
</head>
<body>

<div id="login-page" class="login-container">
  <div class="login-box">
    <div class="crest">⚖️</div>
    <h1>OAB/PA Master</h1>
    <div id="login-alert"></div>
    <div class="form-group">
      <label>Email</label>
      <input type="email" id="loginEmail" placeholder="seu@email.com">
    </div>
    <div class="form-group">
      <label>Senha</label>
      <input type="password" id="loginPassword" placeholder="••••••••">
    </div>
    <button class="btn btn-primary" onclick="handleLogin()">Entrar</button>
  </div>
</div>

<div id="main-page">
  <h1>Bem-vindo!</h1>
  <p id="userInfo"></p>
  <button onclick="handleLogout()">Sair</button>
</div>

<div id="status"></div>
<div id="logs"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://pzodgfsekqpumvgigeii.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB6b2RnZnNla3FwdW12Z2lnZWlpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQyNjEyNzYsImV4cCI6MjA5OTgzNzI3Nn0.-tQn-ECR6t-waBBuihIesi6LhxJ3s22xORzR3OwMoeQ';

let supabaseClient = null;
let currentUser = null;

function initSupabase() {
  if (!window.supabase) {
    throw new Error('Supabase CDN não carregou');
  }
  supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
}

function showAlert(elementId, message, type) {
  const element = document.getElementById(elementId);
  if (element) {
    const className = type === 'error' ? 'alert-error' : 'alert-success';
    element.innerHTML = '<div class="alert ' + className + '">' + message + '</div>';
    setTimeout(() => { element.innerHTML = ''; }, 5000);
  }
}

async function handleLogin() {
  const email = document.getElementById('loginEmail').value;
  const password = document.getElementById('loginPassword').value;

  if (!email || !password) {
    showAlert('login-alert', 'Preencha email e senha', 'error');
    return;
  }

  try {
    const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
    if (error) throw error;

    currentUser = data.user;
    showAlert('login-alert', 'Login realizado!', 'success');
    setTimeout(() => showMainPage(), 500);
  } catch (error) {
    showAlert('login-alert', error.message, 'error');
  }
}

async function handleLogout() {
  try {
    await supabaseClient.auth.signOut();
    currentUser = null;
    showLoginPage();
  } catch (error) {
    showAlert('login-alert', error.message, 'error');
  }
}

function showLoginPage() {
  document.getElementById('login-page').style.display = 'flex';
  document.getElementById('main-page').style.display = 'none';
}

function showMainPage() {
  document.getElementById('login-page').style.display = 'none';
  document.getElementById('main-page').style.display = 'block';
  document.getElementById('userInfo').textContent = 'Olá, ' + currentUser.email;
}

window.addEventListener('DOMContentLoaded', () => {
  try {
    initSupabase();
    showLoginPage();
  } catch (error) {
    showAlert('login-alert', error.message, 'error');
  }
});
</script>

</body>
</html>
