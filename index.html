<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OAB/PA Master — Gestão do Time</title>
<link rel="icon" type="image/png" href="escudo.png">
<link rel="apple-touch-icon" href="escudo-192.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#B8272D">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root{
  --bg:#F6F4EF; --card:#FFFFFF; --ink:#23262E; --ink2:#5C616E; --line:#E1DFD8;
  --p:#B8272D; --p-soft:#F7E5E2; --blue:#1C4FA0; --blue-soft:#E3EAF6; --gold:#A8811C; --gold-soft:#F6EDD6;
  --ok:#2E7D4F; --ok-soft:#E2F1E7; --warn:#A86A12; --warn-soft:#F8EEDD; --bad:#B3372E; --bad-soft:#F9E7E5;
  --shadow:0 1px 3px rgba(35,38,46,.08),0 4px 14px rgba(35,38,46,.06);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:15px/1.55 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif;letter-spacing:.01em;text-wrap:balance}
h1{font-size:26px;margin:0}h2{font-size:20px;margin:0 0 12px}h3{font-size:16px;margin:0 0 8px}
button{font:inherit;cursor:pointer;border:none;border-radius:9px;padding:8px 14px;background:var(--p);color:#fff;transition:filter .15s}
button:hover{filter:brightness(1.08)}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
button.sec{background:var(--card);color:var(--ink);border:1px solid var(--line)}
button.warn{background:var(--warn)}button.bad{background:var(--bad)}button.gold{background:var(--gold)}
button.mini{padding:4px 10px;font-size:13px;border-radius:7px}
button:disabled{opacity:.55;cursor:wait}
input,select,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:9px;padding:8px 10px;width:100%}
textarea{min-height:70px;resize:vertical}
label{display:block;font-size:12.5px;font-weight:600;color:var(--ink2);margin:10px 0 4px;text-transform:uppercase;letter-spacing:.05em}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink2);text-align:left;padding:8px 10px;border-bottom:2px solid var(--line)}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tblwrap{overflow-x:auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow)}
.clickable{cursor:pointer;transition:border-color .15s}
.clickable:hover{border-color:var(--p)}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.p-ok{background:var(--ok-soft);color:var(--ok)}.p-warn{background:var(--warn-soft);color:var(--warn)}.p-bad{background:var(--bad-soft);color:var(--bad)}.p-mut{background:var(--blue-soft);color:var(--blue)}.p-gold{background:var(--gold-soft);color:var(--gold)}
a{color:var(--blue)}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.mut{color:var(--ink2);font-size:13px}
.stat .n{font-size:26px;font-weight:700;font-family:Georgia,serif}
.stat .l{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink2)}
#shell{display:flex;min-height:100vh}
#side{width:230px;flex-shrink:0;background:var(--card);border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100vh;overflow-y:auto}
#side .brand{padding:4px 10px 16px}
#side .brand .t{font-family:Georgia,serif;font-weight:700;font-size:17px;line-height:1.25}
#side .brand .s{font-size:11.5px;color:var(--ink2);text-transform:uppercase;letter-spacing:.08em;margin-top:3px}
.navb{display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:transparent;color:var(--ink);padding:9px 12px;border-radius:9px;font-size:14px}
.navb:hover{background:var(--p-soft);filter:none}
.navb.on{background:var(--p);color:#fff;font-weight:600}
.navb .ic{width:20px;text-align:center}
#main{flex:1;padding:26px 30px 60px;min-width:0}
#topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.badge-user{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:5px 14px 5px 6px}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--p);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0}
.sect{margin-bottom:22px}
.alertline{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:10px;margin-bottom:8px;font-size:14px}
.al-bad{background:var(--bad-soft)}.al-warn{background:var(--warn-soft)}.al-ok{background:var(--ok-soft)}
.alertline.clickable:hover{outline:1px solid var(--p)}
#modalbg{position:fixed;inset:0;background:rgba(10,12,16,.55);display:none;align-items:flex-start;justify-content:center;z-index:50;padding:30px 14px;overflow-y:auto}
#modalbg.open{display:flex}
#modal{background:var(--card);border-radius:16px;max-width:640px;width:100%;padding:24px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 20px;border-radius:99px;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:99;max-width:90vw}
#toast.show{opacity:1}
.termo{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:20px 22px;max-height:340px;overflow-y:auto;font-size:13.5px;line-height:1.65}
.termo h4{font-family:Georgia,serif;margin:14px 0 6px;font-size:14px}
.termo p{margin:0 0 8px}
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(160deg,var(--p-soft),var(--bg) 55%)}
.login-box{width:100%;max-width:420px}
.crest{width:86px;margin:0 auto 14px;display:flex;justify-content:center}
.crest img{width:86px;height:auto}
.tabbtns{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tabbtns button{background:var(--card);color:var(--ink);border:1px solid var(--line);padding:6px 13px;font-size:13.5px}
.tabbtns button.on{background:var(--p);color:#fff;border-color:var(--p)}
.campo{background:repeating-linear-gradient(0deg,#2E8B52 0 40px,#2A7F4B 40px 80px);border-radius:14px;padding:22px 10px;display:flex;flex-direction:column;gap:18px;border:3px solid #fff;outline:3px solid #1D5A34;position:relative;overflow:hidden}
.campo::before{content:'';position:absolute;left:0;right:0;top:50%;border-top:2px solid rgba(255,255,255,.6)}
.campo::after{content:'';position:absolute;left:50%;top:50%;width:70px;height:70px;border:2px solid rgba(255,255,255,.6);border-radius:50%;transform:translate(-50%,-50%)}
.campo .area,.prancheta .area{position:absolute;left:50%;transform:translateX(-50%);width:46%;height:34px;border:2px solid rgba(255,255,255,.6);pointer-events:none}
.campo .a-top,.prancheta .a-top{top:-2px;border-top:none;border-radius:0 0 10px 10px}
.campo .a-bot,.prancheta .a-bot{bottom:-2px;border-bottom:none;border-radius:10px 10px 0 0}
.tok .pos{display:block;font-size:9px;font-weight:600;color:#5C616E;text-transform:uppercase;letter-spacing:.03em;text-align:center}
.campo .linha{display:flex;justify-content:space-evenly;gap:6px;flex-wrap:wrap;position:relative;z-index:2}
.jog{background:#fff;color:#1E2228;border-radius:99px;padding:4px 11px;font-size:12.5px;font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.3);white-space:nowrap;text-align:center}
.jog .pos{display:block;font-size:9px;font-weight:600;color:#5C616E;text-transform:uppercase;letter-spacing:.04em}
.jog.gk{background:#F2C11E}
.prancheta{position:relative;width:100%;aspect-ratio:3/3.6;background:repeating-linear-gradient(0deg,#2E8B52 0 11%,#2A7F4B 11% 22%);border:3px solid #fff;outline:3px solid #1D5A34;border-radius:14px;overflow:hidden;touch-action:none}
.prancheta .plin{position:absolute;left:0;right:0;top:50%;border-top:2px solid rgba(255,255,255,.55);pointer-events:none}
.prancheta .pcirc{position:absolute;left:50%;top:50%;width:18%;aspect-ratio:1;border:2px solid rgba(255,255,255,.55);border-radius:50%;transform:translate(-50%,-50%);pointer-events:none}
.tok{position:absolute;transform:translate(-50%,-50%);background:#fff;color:#1E2228;border-radius:99px;padding:3px 9px;font-size:12px;font-weight:700;box-shadow:0 2px 5px rgba(0,0,0,.35);cursor:grab;user-select:none;white-space:nowrap;z-index:5}
.tok.bola{background:#F2C11E;border-radius:50%;width:26px;height:26px;display:flex;align-items:center;justify-content:center;padding:0}
.tok.mov{transition:left 2.2s ease-in-out, top 2.2s ease-in-out}
.setas{position:absolute;inset:0;width:100%;height:100%;z-index:3;pointer-events:none}
.doc{display:flex;gap:10px;align-items:center;padding:8px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:6px;font-size:13.5px}
.patrow{display:flex;gap:12px;flex-wrap:wrap;align-items:stretch;justify-content:center}
.pat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-decoration:none;color:var(--ink);min-width:110px}
.pat img{max-height:52px;max-width:130px;object-fit:contain}
.pat.master{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold-soft)}
.pat.master img{max-height:82px;max-width:210px}
.pat .pn{font-size:12px;font-weight:700;text-align:center}
.pat .pb{font-size:11px;color:var(--gold);font-weight:600;text-align:center}
.medal{font-size:16px}
details{border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:8px;background:var(--card)}
summary{cursor:pointer;font-weight:600;font-size:14px}
#bottombar{display:none}
@media(max-width:820px){
  #shell{flex-direction:column}
  #side{display:none}
  #bottombar{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);z-index:40;justify-content:space-around;align-items:stretch;padding:6px 4px calc(8px + env(safe-area-inset-bottom));box-shadow:0 -2px 12px rgba(0,0,0,.08)}
  .bb{display:flex;flex-direction:column;align-items:center;gap:2px;background:none;color:var(--ink2);font-size:10.5px;padding:4px 6px;border-radius:10px;flex:1;font-weight:600}
  .bb .bi{font-size:21px;line-height:1}
  .bb.on{color:var(--p);background:var(--p-soft)}
  .bb:hover{filter:none}
  #main{padding:16px 14px 110px}
  input,select,textarea{font-size:16px;padding:10px 12px}
  button{padding:10px 16px}
  button.mini{padding:6px 12px;font-size:13.5px}
  h1{font-size:22px}
  td,th{padding:8px 8px}
  #modalbg{padding:12px 8px}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<div id="modalbg"><div id="modal"></div></div>
<div id="toast"></div>

<script>
'use strict';
/* ================= SUPABASE ================= */
const SB_URL='https://pzodgfsekqpumvgigeii.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB6b2RnZnNla3FwdW12Z2lnZWlpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQyNjEyNzYsImV4cCI6MjA5OTgzNzI3Nn0.-tQn-ECR6t-waBBuihIesi6LhxJ3s22xORzR3OwMoeQ';
const sb=window.supabase.createClient(SB_URL,SB_KEY);
async function q(p){ const {data,error}=await p; if(error){ toast('⚠️ '+(error.message||'Erro')); console.error(error); throw error; } return data; }

/* ================= ESTADO ================= */
const TERMO_LGPD_V='1.0', TERMO_UNI_V='1.0';
let db=null, me=null, tab='painel', subState={};
const ROLES={diretoria:'Diretoria',treinador:'Treinador',auxiliar:'Auxiliar técnico',preparador:'Preparador físico',atleta:'Atleta'};
const podeSaude=r=>['diretoria','treinador','preparador','auxiliar'].includes(r);
const gestor=()=>['diretoria','treinador','auxiliar'].includes(me.role);
const posicoesDe=a=>(a.posicao||'').split(/[,;\/]| e /i).map(s=>s.trim()).filter(s=>s&&s!=='—');
const NAV={diretoria:['painel','atletas','docs','saude','avaliacao','desempenho','taticas','agenda','presencas','financeiro','uniformes','lgpd','ajustes'],
  treinador:['painel','saude','avaliacao','desempenho','taticas','agenda','presencas'],
  auxiliar:['painel','saude','avaliacao','desempenho','taticas','agenda','presencas'],
  /* auxiliar tem os mesmos poderes do treinador (gestor) */
  preparador:['painel','saude','avaliacao','desempenho','taticas','agenda','presencas'],
  atleta:['meu','saude','avaliacao','desempenho','taticas','agenda','presencas']};
const NAVLBL={painel:['📊','Dashboard'],atletas:['👥','Atletas'],docs:['📁','Documentos'],saude:['🩺','Saúde'],avaliacao:['📈','Avaliação física'],
  desempenho:['🏆','Desempenho'],taticas:['📋','Táticas'],agenda:['🗓️','Agenda'],presencas:['✅','Frequência'],financeiro:['💰','Financeiro'],uniformes:['👕','Uniformes & materiais'],
  lgpd:['⚖️','Termos & LGPD'],ajustes:['⚙️','Ajustes'],meu:['🏠','Meu espaço']};

/* ================= HELPERS ================= */
const $=id=>document.getElementById(id);
const uid=()=>crypto.randomUUID();
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const brl=v=>(Number(v)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const ehMensal=c=>/^Mensalidade /.test(c.desc||'');
const nomeCob=c=>c.atletaId?nomeAt(c.atletaId):('🎟️ '+(c.convidado||'Convidado'));
const valorDe=c=>(ehMensal(c)&&c.status==='atrasado')?(db.config.mensApos||c.valor):c.valor;
const dbr=d=>{ if(!d)return '—'; const[a,m,dd]=String(d).slice(0,10).split('-'); return `${dd}/${m}/${a}`; };
const hoje=()=>new Date().toISOString().slice(0,10);
const agora=()=>new Date().toLocaleString('pt-BR');
const fdt=t=>t?new Date(t).toLocaleString('pt-BR'):'';
const ini=n=>n.trim().split(/\s+/).map(p=>p[0]).slice(0,2).join('').toUpperCase();
const pnome=n=>{const p=n.trim().split(/\s+/).filter(w=>!/^(dr\.?|dra\.?|prof\.?|profa\.?)$/i.test(w));return p[0]||n;};
const byId=(arr,id)=>arr.find(x=>x.id===id);
const at=id=>byId(db.atletas,id);
const elenco=()=>db.atletas.filter(a=>a.ativo&&!a.pendente&&(a.role==='atleta'||a.role==='diretoria'));
const membros=()=>db.atletas.filter(a=>a.ativo&&!a.pendente);
const nomeAt=id=>{const a=at(id);return a?a.nome:'(removido)';};
const kb=n=>n>1048576?(n/1048576).toFixed(1)+' MB':Math.round(n/1024)+' KB';
function CREST(s){ return `<img src="escudo.png" width="${s}" alt="Escudo OAB/PA Master" style="height:auto;flex-shrink:0;display:block">`; }
function toast(m){ const t=$('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(t._x); t._x=setTimeout(()=>t.classList.remove('show'),3000); }
function modal(html){ $('modal').innerHTML=html; $('modalbg').classList.add('open'); }
function fecha(){ $('modalbg').classList.remove('open'); }
function confirma(msg,cb){
  modal(`<h2>⚠️ Confirmar exclusão</h2><p style="font-size:15px">${msg}</p><p class="mut">Essa ação não pode ser desfeita.</p>
  <div class="row" style="margin-top:16px"><button class="bad" id="cf_go">Sim, excluir</button><button class="sec" onclick="fecha()">Cancelar</button></div>`);
  $('cf_go').onclick=()=>{ fecha(); cb(); };
}
document.addEventListener('click',e=>{ if(e.target.id==='modalbg') fecha(); });
function fval(id){ const el=$(id); return el?el.value.trim():''; }
function copiar(txt,msg){ navigator.clipboard.writeText(txt).then(()=>toast(msg||'Copiado!')).catch(()=>toast('Não foi possível copiar')); }
function baixar(nome,conteudo,mime){ const b=conteudo instanceof Blob?conteudo:new Blob([conteudo],{type:mime}); const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download=nome; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),4000); }
function log(tipo,texto){ sb.from('logs').insert({tipo,texto,quem:me?me.nome:'sistema'}).then(()=>{}); }

/* ================= CARREGAMENTO ================= */
function mapAtleta(r){ return {id:r.id,nome:r.nome,fone:r.fone,email:r.email,oab:r.oab,posicao:r.posicao,role:r.role,ativo:r.ativo,pendente:!r.aprovado,fundador:!!r.fundador,cargo:r.cargo||'',
  consent:{aceito:r.consent_status==='aceito',recusado:r.consent_status==='recusado',revogado:r.consent_status==='revogado',quando:fdt(r.consent_quando),versao:r.consent_versao||TERMO_LGPD_V},saude:{}}; }
async function carregaTudo(){
  const [perfis,saude,eventos,presencas,cobrancas,avaliacoes,metas,stats,uniformes,inventario,tn,te,docsAll,logs,tarefas,cfg,lotes,balancorec,unifhist]=await Promise.all([
    q(sb.from('perfis').select('*').order('nome')),
    q(sb.from('saude').select('*')),
    q(sb.from('eventos').select('*').order('data')),
    q(sb.from('presencas').select('*')),
    q(sb.from('cobrancas').select('*')),
    q(sb.from('avaliacoes').select('*')),
    q(sb.from('metas').select('*')),
    q(sb.from('stats').select('*')),
    q(sb.from('uniformes').select('*')),
    sb.from('inventario').select('*').then(r=>r.data||[]),
    q(sb.from('taticas_notas').select('*').order('quando',{ascending:false})),
    q(sb.from('taticas_esquemas').select('*').order('quando',{ascending:false})),
    q(sb.from('documentos').select('*').order('quando',{ascending:false})),
    sb.from('logs').select('*').order('quando',{ascending:false}).limit(300).then(r=>r.data||[]),
    sb.from('tarefas').select('*').order('quando',{ascending:false}).then(r=>r.data||[]),
    q(sb.from('config').select('*').eq('id',1).single()),
    sb.from('import_lotes').select('*').order('data_import',{ascending:false}).then(r=>r.data||[]),
    sb.from('balanco_receitas').select('*').order('data',{ascending:false}).then(r=>r.data||[]),
    sb.from('uniforme_numeros_historico').select('*').order('quando',{ascending:false}).then(r=>r.data||[])
  ]);
  db={};
  db.atletas=perfis.map(mapAtleta);
  saude.forEach(s=>{ const a=at(s.atleta_id); if(a)a.saude={sangue:s.sangue,plano:s.plano,alergias:s.alergias,medicamentos:s.medicamentos,condicoes:s.condicoes,emergencia:s.emergencia,lesoes:s.lesoes,obs:s.obs,lesoesLista:s.lesoes_lista||[],obsLista:s.obs_lista||[]}; });
  db.eventos=eventos.map(e=>({id:e.id,tipo:e.tipo,titulo:e.titulo,data:String(e.data),hora:e.hora,local:e.local,obs:e.obs}));
  db.presencas=presencas.map(p=>({eventoId:p.evento_id,atletaId:p.atleta_id,status:p.status}));
  db.cobrancas=cobrancas.map(c=>({id:c.id,atletaId:c.atleta_id,convidado:c.convidado||'',desc:c.descricao,valor:c.valor,venc:String(c.venc),

/* ================= PDF ================= */
function lat1(s){ let o=''; for(const ch of String(s)){ const c=ch.codePointAt(0);
  if(c<=255)o+=ch; else o+=({'—':'-','–':'-','’':"'",'‘':"'",'“':'"','”':'"','•':'-',' ':' ','…':'...'}[ch]??''); } return o; }
function pdfEsc(s){ return s.replace(/\\/g,'\\\\').replace(/\(/g,'\\(').replace(/\)/g,'\\)'); }
function genPDF(nomeArq,titulo,linhas){
  const wrapd=[];
  linhas.forEach(l=>{ l=lat1(l);
    if(l.length<=100){wrapd.push(l);return;}
    let cur=''; l.split(' ').forEach(t=>{ if((cur+' '+t).trim().length>100){wrapd.push(cur);cur=t;} else cur=(cur?cur+' ':'')+t; }); if(cur)wrapd.push(cur); });
  const porPag=50, pags=[];
  for(let i=0;i<Math.max(wrapd.length,1);i+=porPag)pags.push(wrapd.slice(i,i+porPag));
  const objs=[];
  const kids=pags.map((_,i)=>`${5+i*2} 0 R`).join(' ');
  objs.push(`1 0 obj<</Type/Catalog/Pages 2 0 R>>endobj`);
  objs.push(`2 0 obj<</Type/Pages/Kids[${kids}]/Count ${pags.length}>>endobj`);
  objs.push(`3 0 obj<</Type/Font/Subtype/Type1/BaseFont/Helvetica/Encoding/WinAnsiEncoding>>endobj`);
  objs.push(`4 0 obj<</Type/Font/Subtype/Type1/BaseFont/Helvetica-Bold/Encoding/WinAnsiEncoding>>endobj`);
  pags.forEach((pg,i)=>{
    let s='';
    if(i===0) s+=`BT /F2 13 Tf 50 792 Td (${pdfEsc(lat1(titulo))}) Tj ET\n`;
    s+=`BT /F1 9.5 Tf 13.5 TL 50 ${i===0?764:800} Td\n`;
    pg.forEach(l=>{ s+=`(${pdfEsc(l)}) Tj T*\n`; });
    s+='ET';
    objs.push(`${5+i*2} 0 obj<</Type/Page/Parent 2 0 R/MediaBox[0 0 595 842]/Resources<</Font<</F1 3 0 R/F2 4 0 R>>>>/Contents ${6+i*2} 0 R>>endobj`);
    objs.push(`${6+i*2} 0 obj<</Length ${s.length}>>stream\n${s}\nendstream endobj`);
  });
  let pdf='%PDF-1.4\n'; const offs=[];
  objs.forEach(o=>{ offs.push(pdf.length); pdf+=o+'\n'; });
  const xref=pdf.length;
  pdf+=`xref\n0 ${objs.length+1}\n0000000000 65535 f \n`+offs.map(o=>String(o).padStart(10,'0')+' 00000 n \n').join('');
  pdf+=`trailer<</Size ${objs.length+1}/Root 1 0 R>>\nstartxref\n${xref}\n%%EOF`;
  const bytes=new Uint8Array(pdf.length); for(let i=0;i<pdf.length;i++)bytes[i]=pdf.charCodeAt(i)&0xFF;
  baixar(nomeArq,new Blob([bytes],{type:'application/pdf'}));
  toast('PDF baixado — anexe no WhatsApp para compartilhar');
}
function htmlParaLinhas(html){
  const d=document.createElement('div'); d.innerHTML=html; const out=[];
  d.querySelectorAll('h4,p').forEach(el=>{ const t=el.textContent.replace(/\s+/g,' ').trim(); if(!t)return;
    if(el.tagName==='H4'){ out.push(''); out.push(t.toUpperCase()); } else out.push(t); });
  return out;
}

  me=mapAtleta(perfil);
  if(perfil.aprovado===false){ telaPendente(); return; }
  if(!perfil.ativo){ telaInativo(); return; }
  if(!me.consent.aceito&&!me.consent.recusado){ await carregaTudo(); renderConsent(); return; }
  try{ const {data:n}=await sb.rpc('gera_mensalidades'); if(n>0)toast(`💰 ${n} mensalidade(s) do mês geradas automaticamente`); }catch(_){}
  try{ await carregaTudo(); }catch(e){ toast('Erro ao carregar dados'); return; }
  if(!NAV[me.role].includes(tab)) tab=NAV[me.role][0];
  renderShell();
}

const VAPID_PUB='BKK3rTzH9ywx-aRgITkhaYB0nnWmAJWAshuVfQdWzhbStRr7zERT1zBE5Kkh0j01RUSEppkh8ffzYqiYS4uIKug';

function b64ToU8(s){ const p='='.repeat((4-s.length%4)%4); const b=atob((s+p).replace(/-/g,'+').replace(/_/g,'/')); return Uint8Array.from([...b].map(c=>c.charCodeAt(0))); }
function notifAtivas(){ return typeof Notification!=='undefined'&&Notification.permission==='granted'&&localStorage.getItem('notif_ok')==='1'; }
async function ativarNotif(){
  try{
    if(!('serviceWorker' in navigator)||!('PushManager' in window)||typeof Notification==='undefined'){
      toast('Neste aparelho: adicione o app à Tela de Início primeiro (iPhone precisa disso) e tente de novo'); return; }
    const perm=await Notification.requestPermission();
    if(perm!=='granted'){toast('Permissão negada — ative nas configurações do navegador');return;}
    const reg=await navigator.serviceWorker.ready;
    const sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64ToU8(VAPID_PUB)});
    const j=sub.toJSON();
    const {data:ex}=await sb.from('push_subs').select('id,sub').eq('atleta_id',me.id);
    if(!(ex||[]).some(s=>s.sub&&s.sub.endpoint===j.endpoint)) await q(sb.from('push_subs').insert({atleta_id:me.id,sub:j}));
    localStorage.setItem('notif_ok','1');
    toast('🔔 Notificações ativadas neste aparelho!'); renderTab();
  }catch(e){ toast('⚠️ Não deu: '+e.message); }
}

async function revogaGo(aid){
  const a=at(aid);
  await q(sb.from('perfis').update({consent_status:'revogado',consent_quando:new Date().toISOString()}).eq('id',aid));

}

/* ================= PENDÊNCIAS / ALERTAS ================= */
function pendencias(a){
  const P=[];
  const cobAb=db.cobrancas.filter(c=>c.atletaId===a.id&&c.status!=='pago');
  const atras=cobAb.filter(c=>c.status==='atrasado');
  if(atras.length)P.push({txt:`💰 ${atras.length} pagamento(s) em atraso — ${brl(atras.reduce((s,c)=>s+Number(valorDe(c)),0))}`,tab:'financeiro'});
  else if(cobAb.length)P.push({txt:`💰 ${cobAb.length} cobrança(s) a vencer — ${brl(cobAb.reduce((s,c)=>s+Number(valorDe(c)),0))}`,tab:'financeiro'});
  const f=db.presencas.filter(p=>p.atletaId===a.id&&p.status==='falta').length;
  if(db.config.limiteFaltas>0&&f>=db.config.limiteFaltas)P.push({txt:`🚫 ${f} faltas (limite: ${db.config.limiteFaltas})`,tab:'presencas'});
  if(a.role==='atleta'||a.role==='diretoria')db.config.docsObrig.filter(cat=>!db.arquivos.some(d=>d.atletaId===a.id&&d.categoria===cat)).forEach(cat=>P.push({txt:`📁 Enviar documento: ${cat}`,tab:'docs'}));
  db.metas.filter(m=>m.atletaId===a.id&&m.status==='andamento'&&m.prazo&&m.prazo<hoje()).forEach(m=>P.push({txt:`📈 Meta vencida: ${m.desc}`,tab:'avaliacao'}));
  if(!a.consent.aceito&&!a.consent.recusado&&!a.consent.revogado)P.push({txt:'⚖️ Termo LGPD pendente de aceite',tab:'lgpd'});
  if(a.consent.recusado||a.consent.revogado)P.push({txt:'⚖️ Sem consentimento LGPD (recusado/revogado)',tab:'lgpd'});
  db.uniformes.filter(u=>u.atletaId===a.id&&u.status==='pendente').forEach(u=>P.push({txt:`👕 Termo do uniforme nº ${u.numero} aguardando aceite`,tab:'uniformes'}));
  return P;
}
function alertas(){
  const A=[];
  if(me.role==='diretoria')db.atletas.filter(a=>a.pendente).forEach(a=>A.push({t:'warn',tab:'atletas',m:`🆕 Solicitação de cadastro aguardando aprovação: ${esc(a.nome)}`}));
  db.cobrancas.filter(c=>c.status==='atrasado').forEach(c=>A.push({t:'bad',tab:'financeiro',m:`💰 Pagamento atrasado: ${esc(nomeCob(c))} — ${esc(c.desc)} (${brl(valorDe(c))}, venceu ${dbr(c.venc)})`}));
  db.metas.filter(m=>m.status==='andamento'&&m.prazo&&m.prazo<hoje()).forEach(m=>A.push({t:'warn',tab:'avaliacao',m:`📈 Meta vencida não alcançada: ${esc(nomeAt(m.atletaId))} — ${esc(m.desc)} (prazo ${dbr(m.prazo)})`}));
  db.atletas.filter(a=>a.ativo&&!a.pendente).forEach(a=>{
    if(a.role==='atleta'||a.role==='diretoria'){
      const f=db.presencas.filter(p=>p.atletaId===a.id&&p.status==='falta').length;
      if(db.config.limiteFaltas>0&&f>=db.config.limiteFaltas)A.push({t:'warn',tab:'presencas',m:`🚫 ${esc(a.nome)} atingiu ${f} faltas (limite: ${db.config.limiteFaltas})`});
      const faltamDocs=db.config.docsObrig.filter(cat=>!db.arquivos.some(d=>d.atletaId===a.id&&d.categoria===cat));
      if(faltamDocs.length&&me.role==='diretoria')A.push({t:'warn',tab:'docs',m:`📁 ${esc(a.nome)} ainda não enviou: ${esc(faltamDocs.join(', '))}`});
    }
    if(!a.consent.aceito&&!a.consent.recusado&&!a.consent.revogado)A.push({t:'warn',tab:'lgpd',m:`⚖️ ${esc(a.nome)} ainda não respondeu ao termo de consentimento LGPD`});
  });
  if(me.role==='diretoria')db.tarefas.filter(t=>t.status==='aberta'&&t.prazo&&t.prazo<hoje()).forEach(t=>A.push({t:'warn',tab:'painel',m:`📌 Tarefa da diretoria vencida: ${esc(t.titulo)} (${esc(nomeAt(t.respId))})`}));
  if(me.role==='diretoria')(db.pats||[]).filter(p=>p.ativo&&p.vigencia_ate).forEach(p=>{
    const v=String(p.vigencia_ate).slice(0,10); const dias=Math.ceil((new Date(v)-new Date(hoje()))/86400000);
    if(dias<0)A.push({t:'bad',tab:'ajustes',m:`🤝 Patrocínio de ${esc(p.nome)} VENCIDO em ${dbr(v)} — hora de renovar`});
    else if(dias<=30)A.push({t:'warn',tab:'ajustes',m:`🤝 Patrocínio de ${esc(p.nome)} vence em ${dias} dia(s) (${dbr(v)})`});
  });
  db.uniformes.forEach(u=>{
    const falt=Object.entries(u.pecas||{}).filter(([,v])=>v==='faltando').map(([k])=>PECAS_LBL[k]);
    if(falt.length)A.push({t:'bad',tab:'uniformes',m:`👕 Uniforme nº ${esc(u.numero)} INCOMPLETO — faltando: ${esc(falt.join(', '))}`});

  });
  return A;
}

async function salvaAtleta(id){

  const patch={nome,fone:fval('a_fone'),oab:fval('a_oab'),posicao:fval('a_pos'),cargo:fval('a_cargo')};

async function carregaJSZip(){ if(window.JSZip)return;
  await new Promise((res,rej)=>{ const s=document.createElement('script'); s.src='https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js'; s.onload=res; s.onerror=()=>rej(new Error('sem internet para carregar o compactador')); document.head.appendChild(s); });
}
async function baixarZipPessoa(aid){
  const files=db.arquivos.filter(d=>d.atletaId===aid);
  if(!files.length){toast('Esta pessoa não tem documentos');return;}
  toast('Preparando o ZIP…');
  try{
    await carregaJSZip(); const zip=new JSZip();
    for(const d of files){ const {data,error}=await sb.storage.from('arquivos').createSignedUrl(d.path,300); if(error)continue;
      const bl=await (await fetch(data.signedUrl)).blob(); zip.file((d.categoria+' - '+d.nome).replace(/[\/\\]/g,'-'),bl); }
    baixar('documentos-'+pnome(nomeAt(aid)).toLowerCase()+'-'+hoje()+'.zip',await zip.generateAsync({type:'blob'}),'application/zip');
    log('docs',`${me.nome} baixou o ZIP de documentos de ${nomeAt(aid)}`);
    toast('ZIP baixado ✔');
  }catch(e){ toast('⚠️ '+e.message); }
}
async function baixarZipTodos(){
  if(!db.arquivos.length){toast('Nenhum documento no arquivo');return;}
  toast('Preparando o ZIP de todos — aguarde…');
  try{
    await carregaJSZip(); const zip=new JSZip();
    for(const d of db.arquivos){ const {data,error}=await sb.storage.from('arquivos').createSignedUrl(d.path,300); if(error)continue;
      const bl=await (await fetch(data.signedUrl)).blob();
      zip.folder(nomeAt(d.atletaId).replace(/[\/\\]/g,'-')).file((d.categoria+' - '+d.nome).replace(/[\/\\]/g,'-'),bl); }
    baixar('documentos-oab-master-'+hoje()+'.zip',await zip.generateAsync({type:'blob'}),'application/zip');

      ${podeEditar?`<td><button class="mini sec" onclick="formStat('${sel}','${a.id}')">✏️ Lançar</button></td>`:''}</tr>`; }).join('')}</table></div>`;

  ${Object.keys(agg).length?Object.entries(agg).map(([id,a])=>`<tr><td>${esc(nomeAt(id))}</td><td>${a.j}</td><td>${a.g}</td><td>${a.as}</td><td>${a.ca}</td><td>${a.cv}</td><td>${a.des}</td><td>${a.due}</td><td>${a.pas}</td><td>${a.notas.length?(a.notas.reduce((x,y)=>x+y,0)/a.notas.length).toFixed(1):'—'}</td></tr>`).join(''):'<tr><td colspan="10" class="mut">Nenhuma estatística lançada ainda.</td></tr>'}</table></div>

function carrImg(src,cors){ return new Promise(res=>{ const i=new Image(); if(cors)i.crossOrigin='anonymous'; i.onload=()=>res(i); i.onerror=()=>res(null); i.src=src; }); }
async function geraArte(){
  const b=$('btn_ar'); b.disabled=true;
  const ev=byId(db.eventos,fval('ar_jogo'))||{titulo:'',data:hoje()};
  const gn=fval('ar_n')||'0', ge=fval('ar_e')||'0', dest=fval('ar_d');
  const pats=(db.pats||[]).filter(p=>p.ativo);
  const [escImg,...logos]=await Promise.all([carrImg('escudo.png'),...pats.filter(p=>p.logo_url).map(p=>carrImg(p.logo_url,true))]);
  const W=1080,H=1350,cv=document.createElement('canvas'); cv.width=W; cv.height=H; const x=cv.getContext('2d');
  const g=x.createLinearGradient(0,0,0,H); g.addColorStop(0,'#B8272D'); g.addColorStop(1,'#6E1013'); x.fillStyle=g; x.fillRect(0,0,W,H);
  x.fillStyle='rgba(255,255,255,.05)'; for(let i=-200;i<W+200;i+=170){ x.save(); x.translate(i,0); x.rotate(.2); x.fillRect(0,-200,70,H+400); x.restore(); }
  if(escImg){ const w=280,h=w*escImg.height/escImg.width; x.drawImage(escImg,(W-w)/2,60,w,h); }
  x.textAlign='center';
  x.fillStyle='#F2C11E'; x.font='bold 66px Georgia'; x.fillText(db.config.time.toUpperCase(),W/2,500);
  const adv=(ev.titulo||'').replace(/^jogo\s*[×x]\s*/i,'').trim();
  x.fillStyle='#fff'; x.font='600 46px Helvetica'; x.fillText(adv?('×  '+adv):'', W/2, 566);
  const vit=Number(gn)>Number(ge), emp=Number(gn)===Number(ge);
  x.font='bold 230px Helvetica'; x.fillText(`${gn} × ${ge}`,W/2,820);
  x.font='bold 44px Helvetica'; x.fillStyle=vit?'#F2C11E':'#fff';
  x.fillText(vit?'VITÓRIA DO MASTER! 🏆':emp?'EMPATE BATALHADO 🤝':'SEGUIMOS JUNTOS 💪',W/2,900);
  x.fillStyle='#fff'; x.font='38px Helvetica'; x.fillText(dbr(ev.data)+(ev.local?' — '+ev.local:''),W/2,960);
  if(dest){ x.fillStyle='#F2C11E'; x.font='italic 38px Georgia'; x.fillText('⭐ '+dest,W/2,1030); }
  x.fillStyle='#fff'; x.fillRect(0,H-250,W,250);
  x.fillStyle='#B8272D'; x.font='bold 32px Helvetica'; x.fillText('OBRIGADO AOS NOSSOS PATROCINADORES 🤝',W/2,H-200);
  const ls=logos.filter(Boolean);
  if(ls.length){
    const lw=Math.min(210,(W-100)/ls.length-16), lh=120; let px=(W-(ls.length*(lw+16)-16))/2;
    ls.forEach(im=>{ const r=Math.min(lw/im.width,lh/im.height); const w2=im.width*r,h2=im.height*r;
      x.drawImage(im,px+(lw-w2)/2,H-165+(lh-h2)/2,w2,h2); px+=lw+16; });
  } else if(pats.length){ x.fillStyle='#5C616E'; x.font='600 34px Helvetica'; x.fillText(pats.map(p=>p.nome).join(' · '),W/2,H-110); }
  cv.toBlob(bl=>{ baixar('arte-pos-jogo-'+String(ev.data)+'.png',bl,'image/png'); b.disabled=false; fecha(); toast('🎨 Arte gerada! Está nos downloads — compartilhe no grupo'); },'image/png');
}
function csvStats(){

function esqCoords(e){
  let rows=FORMS[e.formacao];
  if(!rows){ rows=[]; for(let i=0;i<e.posicoes.length;i+=3)rows.push(e.posicoes.slice(i,i+3).map(p=>p.lbl)); }
  const n=rows.length; let k=0; const out=[];
  rows.forEach((labels,ri)=>{ const y=n>1?88-ri*(74/(n-1)):50;
    labels.forEach((lbl,j)=>{ const p=e.posicoes[k]||{lbl};
      out.push({...p,lbl:p.lbl||lbl,x:p.x??((j+1)*100/(labels.length+1)),y:p.y??y}); k++; }); });
  return out;
}

function ecLiga(){

const prSeta=(x1,y1,x2,y2,cor,mk)=>`<line x1="${x1}%" y1="${y1}%" x2="${x2}%" y2="${y2}%" stroke="${cor}" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#${mk})"/>`;

function prModo(m){ prSt.modo=m; ['mover','destino','seta'].forEach(v=>{ const b=$('prm_'+v); if(b)b.className='mini '+(v===m?'':'sec'); }); }
function prAddTok(n,bola,tipo){ if(!n)return; prSt.tokens.push({n,b:!!bola,x0:50,y0:bola?58:tipo==='adv'?20:82,x1:null,y1:null,tipo:tipo||'time'}); if($('pr_add'))$('pr_add').value=''; prDesenha(); }
function prDesenha(){
  const c=$('pr_campo'); if(!c)return;
  c.querySelectorAll('.tok').forEach(t=>t.remove());
  prSt.tokens.forEach((t,i)=>{
    const el=document.createElement('div');
    el.className='tok'+(t.b?' bola':'')+(t.tipo==='adv'?' adv':'');
    el.textContent=t.n; el.dataset.i=i;
    el.style.left=t.x0+'%'; el.style.top=t.y0+'%';
    if(t.tipo==='adv') el.style.opacity='0.6';
    c.appendChild(el);
  });
  const svg=$('pr_svg'); if(!svg)return;
  let s=PR_DEFS;
  prSt.setas.forEach(a=>{ s+=prSeta(a[0],a[1],a[2],a[3],'#fff','ah'); });
  prSt.tokens.filter(t=>t.x1!=null).forEach(t=>{ s+=prSeta(t.x0,t.y0,t.x1,t.y1,'#F2C11E','ah2'); });
  svg.innerHTML=s;
}
function prLiga(){
  const c=$('pr_campo'); let dragI=null, setaIni=null;
  const pct=ev=>{ const r=c.getBoundingClientRect(); return [Math.min(97,Math.max(3,(ev.clientX-r.left)/r.width*100)),Math.min(97,Math.max(3,(ev.clientY-r.top)/r.height*100))]; };
  c.onpointerdown=ev=>{
    if(prSt.modo==='seta'){ setaIni=pct(ev); c.setPointerCapture(ev.pointerId); ev.preventDefault(); return; }
    const tok=ev.target.closest('.tok');
    if(tok){ dragI=+tok.dataset.i; c.setPointerCapture(ev.pointerId); ev.preventDefault(); }
  };
  c.onpointermove=ev=>{
    if(dragI!=null){ const [x,y]=pct(ev); const t=prSt.tokens[dragI];
      if(prSt.modo==='destino'){ t.x1=x; t.y1=y; } else { t.x0=x; t.y0=y; }
      prDesenha(); }
  };
  c.onpointerup=ev=>{
    if(setaIni){ const [x,y]=pct(ev); if(Math.hypot(x-setaIni[0],y-setaIni[1])>4)prSt.setas.push([setaIni[0],setaIni[1],x,y]); setaIni=null; prDesenha(); }
    dragI=null;
  };
}

async function salvaEsquema(id){
  const nome=fval('e_nome'); if(!nome){toast('Dê um nome ao esquema');return;}
  const sels=[...document.querySelectorAll('.esq_sel')], nums=[...document.querySelectorAll('.esq_num')];
  const posicoes=sels.map((s,i)=>({lbl:s.dataset.lbl,atletaId:s.value,num:(nums[i]?nums[i].value.trim():'')}));
  if(id){ const antigo=byId(db.taticas.esquemas,id);
    if(antigo&&antigo.formacao===fval('e_form')) posicoes.forEach((p,i)=>{ const o=antigo.posicoes[i]; if(o&&o.x!=null){ p.x=o.x; p.y=o.y; } }); }

  const temAdv=$('e_adv_check').checked;
  const dados={nome,formacao:fval('e_form'),posicoes,obs:fval('e_obs')};

  if(temAdv){
    const nomesAdv=[...document.querySelectorAll('.esq_adv_nome')].map(e=>e.value.trim());
    const numsAdv=[...document.querySelectorAll('.esq_adv_num')].map(e=>e.value.trim());
    const posAdv=nomesAdv.map((n,i)=>({lbl:n,num:numsAdv[i]||''})).filter(p=>p.lbl);
    dados.adversario={nome:fval('e_adv_nome'),posicoes:posAdv};
    dados.placar={time:Number(fval('e_placar_time'))||0,adversario:Number(fval('e_placar_adv'))||0};
    dados.data_jogo=fval('e_data_jogo')||null;
    dados.performance=fval('e_performance')||'';
    dados.descricao_jogo=fval('e_desc_jogo')||'';
  } else {
    dados.adversario=null;
    dados.placar=null;
    dados.data_jogo=null;
    dados.performance='';
    dados.descricao_jogo='';
  }

  if(id) await q(sb.from('taticas_esquemas').update(dados).eq('id',id));
  else await q(sb.from('taticas_esquemas').insert(dados));
  log('taticas',`Esquema ${id?'atualizado':'criado'}: ${nome}${temAdv?' × '+fval('e_adv_nome'):''}`);
  fecha(); await recarrega(); toast('Esquema salvo');
}

function tPres(){
  const evs=[...db.eventos].sort((a,b)=>b.data.localeCompare(a.data)); const sel=subState.presEv||(evs[0]&&evs[0].id)||'';
  const ats=elenco();

  let quadro='';
  if(podeMarcar){
    quadro=sel?`<div class="card sect"><label style="margin-top:0">Fazer chamada — compromisso</label>
    <select onchange="subState.presEv=this.value;renderTab()">${evs.map(e=>`<option value="${e.id}" ${e.id===sel?'selected':''}>${dbr(e.data)} — ${esc(e.titulo)}</option>`).join('')}</select>

      const p=db.presencas.find(x=>x.eventoId===sel&&x.atletaId===a.id);

    }).join('')}</table></div></div>`:'<div class="card sect"><p class="mut">Cadastre compromissos na Agenda para fazer a chamada.</p></div>';
  }
  const rank=ats.map(a=>{
    const ps=db.presencas.filter(p=>p.atletaId===a.id);
    const cmp=ps.filter(p=>['presente','atraso'].includes(p.status));
    const jg=cmp.filter(p=>{const e=byId(db.eventos,p.eventoId);return e&&e.tipo==='jogo';}).length;
    const tr=cmp.filter(p=>{const e=byId(db.eventos,p.eventoId);return e&&e.tipo==='treino';}).length;
    const f=ps.filter(p=>p.status==='falta').length, at_=ps.filter(p=>p.status==='atraso').length, j=ps.filter(p=>p.status==='justificada').length;
    return {a,jg,tr,f,at_,j,tot:ps.length,pct:ps.length?Math.round(cmp.length/ps.length*100):null};
  });
  const comDados=rank.filter(r=>r.tot>0).sort((x,y)=>(y.pct-x.pct)||(y.jg+y.tr)-(x.jg+x.tr));
  const minhas=me.role==='atleta'?db.presencas.filter(p=>p.atletaId===me.id).map(p=>({p,e:byId(db.eventos,p.eventoId)})).filter(x=>x.e).sort((x,y)=>y.e.data.localeCompare(x.e.data)):[];
  return `${quadro}

  ${comDados.map((r,i)=>`<tr><td class="medal">${i===0?'🥇':i===1?'🥈':i===2?'🥉':(i+1)+'º'}</td><td>${esc(r.a.nome)}</td><td>${r.jg}</td><td>${r.tr}</td><td><strong>${r.pct}%</strong></td></tr>`).join('')}</table></div>`:'<p class="mut">Nenhuma chamada registrada ainda.</p>'}</div>

async function lerPlanilhaBalanco(){
  const f=$('imp_bal_file').files[0];if(!f){toast('Escolha arquivo');return;}
  toast('Lendo planilha…');
  try{
    await carregaXLSX();
    const wb=XLSX.read(await f.arrayBuffer());
    console.log('Planilhas encontradas:',wb.SheetNames);
    const acoes=[];
    const numDe=v=>{ const n=Number(String(v).replace(/[R$\s.]/g,m=>m==='.'?'.':'').replace(',','.')); return isNaN(n)?0:n; };

    for(const sn of wb.SheetNames){
      console.log(`Lendo aba: ${sn}`);
      const rows=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,defval:''});
      console.log(`Total de linhas: ${rows.length}`);
      console.log('Primeiras 3 linhas:', rows.slice(0,3));

      for(let i=0; i<rows.length; i++){
        const r=rows[i];
        console.log(`Linha ${i}:`, r);
        const item=String(r[0]||'').trim();
        const val=numDe(r[1]||'');
        let data=String(r[2]||hoje()).trim();

        // Validar formato de data (YYYY-MM-DD)
        if(!data.match(/^\d{4}-\d{2}-\d{2}$/)){
          console.log(`  Data inválida "${data}", usando hoje()`);
          data=hoje();
        }

        console.log(`  Item="${item}", Valor=${val}, Data="${data}"`);
        if(!item||val<=0){console.log('  Ignorada (item vazio ou valor 0)');continue;}
        acoes.push({item,valor:val,data});
      }
    }
    console.log('Total de registros lidos:',acoes.length);
    if(!acoes.length){toast('Nenhum registro encontrado - verifique formato da planilha');return;}
    impBalancoAcoes=acoes;
    $('imp_bal_prev').innerHTML=`<div class="card"><strong>${acoes.length} registros encontrados</strong><p class="mut">${acoes.slice(0,5).map(a=>esc(a.item)+' — '+brl(a.valor)).join('<br>')}</p><button class="gold" style="margin-top:8px" onclick="aplicaImportBalanco()">✓ Aplicar importação</button></div>`;
    toast('Pronto! Clique em Aplicar para confirmar.');
  }catch(e){
    console.error('Erro ao ler planilha:',e);
    toast('Erro ao ler: '+e.message);
  }
}
async function aplicaImportBalanco(){
  if(!impBalancoAcoes.length){toast('Nenhum dado para importar');return;}
  const tipo=impBalancoTipo;
  const autor=me?.nome||'Sistema';
  const qtd=impBalancoAcoes.length;
  console.log('Iniciando importação:',{tipo,autor,qtd,dados:impBalancoAcoes});

  // Testar inserção de um registro de teste primeiro
  try{
    if(tipo==='receita'){
      // Teste com 1 receita
      const teste={data:impBalancoAcoes[0].data,tipo:'outro',descricao:impBalancoAcoes[0].item,valor:impBalancoAcoes[0].valor,origem:'Importado de planilha',autor:autor};
      console.log('Testando 1 receita:',teste);
      const {error:err1}=await sb.from('balanco_receitas').insert([teste]);
      if(err1){console.error('Erro receita:',err1);throw new Error('Receita: '+err1.message);}

      // Se teste passou, inserir o resto
      const rows=impBalancoAcoes.map(a=>({data:a.data,tipo:'outro',descricao:a.item,valor:a.valor,origem:'Importado de planilha',autor:autor}));
      console.log('Inserindo todas receitas:',rows.length);
      const {error}=await sb.from('balanco_receitas').insert(rows);
      if(error)throw new Error(error.message);
    }else{
      // Teste com 1 despesa
      const teste={data:impBalancoAcoes[0].data,item:impBalancoAcoes[0].item,categoria:'Outros',qtd:1,valor:impBalancoAcoes[0].valor,quem:me?.nome||'Sistema',obs:'Teste',tipo_lancamento:'importado'};
      console.log('Testando 1 despesa:',teste);
      const {error:err1}=await sb.from('despesas').insert([teste]);
      if(err1){console.error('Erro despesa:',err1);throw new Error('Despesa: '+err1.message);}

      // Se teste passou, inserir o resto
      const rows=impBalancoAcoes.map(a=>({data:a.data,item:a.item,categoria:'Outros',qtd:1,valor:a.valor,quem:me?.nome||'Sistema',obs:'Importado de planilha',tipo_lancamento:'importado'}));
      console.log('Inserindo todas despesas:',rows.length);
      const {error}=await sb.from('despesas').insert(rows);
      if(error)throw new Error(error.message);
    }
    log('financeiro',`Importação Balanço ${tipo}: ${qtd} registros`);
    impBalancoAcoes=[];impBalancoTipo='';
    fecha();
    await recarrega();
    toast('✅ '+qtd+' registros importados com sucesso!');
  }catch(e){
    const msg='❌ '+String(e.message||e);
    console.error('Erro:',e);
    toast(msg);
  }
}

function desfazImport(id){

  const rows=[]; let [y,m]=de.split('-').map(Number); const [ya,ma]=ate.split('-').map(Number); let seg=0;

const MES_N={JAN:1,FEV:2,MAR:3,ABR:4,MAI:5,JUN:6,JUL:7,AGO:8,SET:9,OUT:10,NOV:11,DEZ:12};
const MES_LBL=['','JAN','FEV','MAR','ABR','MAI','JUN','JUL','AGO','SET','OUT','NOV','DEZ'];
function normNome(n){ return String(n||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase().replace(/\b(DR|DRA|PROF|PROFA)\.?\s+/g,'').replace(/\s+/g,' ').trim(); }
function achaAtleta(nome){
  const alvo=normNome(nome); if(!alvo)return null;
  let m=membros().find(a=>normNome(a.nome)===alvo); if(m)return m;
  m=membros().find(a=>{const na=normNome(a.nome);return na.includes(alvo)||alvo.includes(na);}); if(m)return m;
  const t=alvo.split(' ');
  return membros().find(a=>{const na=normNome(a.nome).split(' ');return t.length>1&&na.length>1&&t[0]===na[0]&&t[t.length-1]===na[na.length-1];})||null;
}
let impPlano=null;
const DESP_RE=/(aluguel|agua|água|goleiro|passagem|hospedagem|compra|lavagem|publicidade|repasse|supermercado|assador|churrasqueira|pegador|bagagem|arbitr|taxa|inscri|material|equipamento)/i;
const REC_RE=/(patroc|aux[ií]lio|cr[eé]dito|doa[cç]|churrasco)/i;
function catDespesa(nome){
  const n=String(nome).toLowerCase();
  if(/campo/.test(n))return 'Campo/Aluguel';
  if(/passagem|hospedagem|bagagem/.test(n))return 'Transporte';
  if(/supermercado|churrasqueira|assador|água|agua/.test(n))return 'Confraternização';
  if(/lavagem|uniforme/.test(n))return 'Uniformes';
  if(/goleiro|arbitr/.test(n))return 'Arbitragem';
  if(/material|bola|v[aá]lvula|pegador|colete|equipamento/.test(n))return 'Material esportivo';
  if(/inscri/.test(n))return 'Inscrições';
  return 'Outros';
}
async function calcularHashPlanilha(arquivo,dados){
  // Calcula hash do arquivo baseado em nome + primeiro/últimos registros
  const primeirosDados=JSON.stringify(dados.slice(0,3));
  const ultimosDados=JSON.stringify(dados.slice(-3));
  const txt=arquivo.name+primeirosDados+ultimosDados;
  const encoder=new TextEncoder();
  const buffer=await crypto.subtle.digest('SHA-256',encoder.encode(txt));
  return Array.from(new Uint8Array(buffer)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

async function lerPlanilha(){
  const f=$('imp_file').files[0]; if(!f){toast('Escolha o arquivo');return;}
  toast('Lendo a planilha…');
  try{
    await carregaXLSX();
    const wb=XLSX.read(await f.arrayBuffer());
    const acoes=[]; const naoAchados=new Set(); const anoPad=fval('imp_ano')||String(new Date().getFullYear());
    const numDe=v=>{ const n=Number(String(v).replace(/[R$\s.]/g,m=>m==='.'?'.':'').replace(',','.')); return isNaN(n)?0:n; };
    const dataDe=(txt,ano,mes)=>{ const m=String(txt||'').match(/(\d{1,2})\/(\d{1,2})\/(\d{2,4})/);
      if(m){ const yy=m[3].length===2?'20'+m[3]:m[3]; return `${yy}-${String(m[2]).padStart(2,'0')}-${String(m[1]).padStart(2,'0')}`; }
      return `${ano}-${String(mes).padStart(2,'0')}-${String(db.config.mensDia).padStart(2,'0')}`; };
    for(const sn of wb.SheetNames){
      const rows=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,defval:''});
      const hi=rows.findIndex(r=>r.some(c=>normNome(c)==='NOME'));
      if(hi>=0){ // grade anual
        const header=rows[hi]; const nomeCol=header.findIndex(c=>normNome(c)==='NOME');
        const ano=(sn.match(/(20\d\d)/)||[])[1]||anoPad;
        const cols=header.map((c,i)=>({i,mes:MES_N[String(c).normalize('NFD').replace(/[^A-Za-z]/g,'').toUpperCase().slice(0,3)]})).filter(x=>x.mes&&x.i>nomeCol);
        for(const r of rows.slice(hi+1)){
          const nome=r[nomeCol]; if(!String(nome).trim())continue;
          const a=achaAtleta(nome); if(!a){naoAchados.add(String(nome).trim());continue;}
          for(const col of cols){
            const cel=String(r[col.i]).trim(); if(!cel||/FALTA/i.test(cel))continue;
            const num=numDe(cel);
            if(/^(PG|OK)\.?$/i.test(cel)) acoes.push({t:'mens',aid:a.id,nome:a.nome,mes:col.mes,ano,valor:db.config.mensValor,pago:dataDe('',ano,col.mes)});
            else if(num>0) acoes.push({t:'mens',aid:a.id,nome:a.nome,mes:col.mes,ano,valor:num,pago:dataDe('',ano,col.mes)});
          }
        }
        continue;
      }
      const mMes=sn.trim().match(/^(jan|fev|mar|abr|mai|jun|jul|ago|set|out|nov|dez)\w*\.?\s*(\d{2,4})$/i);
      if(mMes){ // aba mensal
        const mes=MES_N[mMes[1].toUpperCase().slice(0,3)]; const ano=mMes[2].length===2?'20'+mMes[2]:mMes[2];
        const mm=String(mes).padStart(2,'0');
        for(const r of rows){
          const numerado=Number(r[0])>0;
          const nome=String(r[1]||'').trim(), val=String(r[2]).trim(), obs=r[3];
          if(!nome||normNome(nome)==='ATLETAS'||/TOTAL|CAIXA EM/i.test(nome))continue;
          const num=numDe(val);
          const data=dataDe(obs,ano,mes);
          if(numerado){ // mensalista da lista
            const a=achaAtleta(nome); if(!a){naoAchados.add(nome);continue;}
            if(/^(OK|PG)\.?$/i.test(val)) acoes.push({t:'mens',aid:a.id,nome:a.nome,mes,ano,valor:db.config.mensValor,pago:data});
            else if(num>0) acoes.push({t:'mens',aid:a.id,nome:a.nome,mes,ano,valor:num,pago:data});
            continue;
          }
          if(num<=0)continue;
          if(DESP_RE.test(nome)&&!REC_RE.test(nome)){ // despesa
            acoes.push({t:'desp',item:nome,categoria:catDespesa(nome),valor:num,data,obs:String(obs||'')});
            continue;
          }
          const a=achaAtleta(nome);
          if(a) acoes.push({t:'rec',aid:a.id,nomeRec:a.nome,desc:`Avulso ${mm}/${ano}`,valor:num,data});
          else if(REC_RE.test(nome)) acoes.push({t:'rec',convidado:nome,desc:nome,mesRef:`${mm}/${ano}`,valor:num,data});
          else acoes.push({t:'rec',convidado:nome,desc:`Treino avulso ${mm}/${ano}`,valor:num,data});
        }
      }
    }
    // separa e remove duplicados
    const mapa={}; acoes.filter(x=>x.t==='mens').forEach(x=>{mapa[x.aid+'|'+x.ano+'-'+x.mes]=x;});
    const mens=Object.values(mapa);
    const recs=acoes.filter(x=>x.t==='rec').filter(x=>!db.cobrancas.some(c=>
      (x.aid?c.atletaId===x.aid:normNome(c.convidado)===normNome(x.convidado))&&c.desc===x.desc&&Number(c.valor)===Number(x.valor)&&String(c.venc).slice(0,7)===String(x.data).slice(0,7)));
    const desps=acoes.filter(x=>x.t==='desp').filter(x=>!db.despesas.some(d=>
      normNome(d.item)===normNome(x.item)&&Number(d.valor)===Number(x.valor)&&String(d.data).slice(0,7)===String(x.data).slice(0,7)));
    let criar=0,atualizar=0,jaPagos=0;
    mens.forEach(x=>{ const descr=`Mensalidade ${String(x.mes).padStart(2,'0')}/${x.ano}`;
      const ex=db.cobrancas.find(c=>c.atletaId===x.aid&&c.desc===descr);
      if(!ex)criar++; else if(ex.status==='pago')jaPagos++; else atualizar++; });
    impPlano={mens,recs,desps,arquivo:f.name};
    const totRec=recs.reduce((s,x)=>s+x.valor,0), totDesp=desps.reduce((s,x)=>s+x.valor,0);
    $('imp_prev').innerHTML=`
    <div class="alertline al-ok" style="margin-top:14px">💰 <strong>${mens.length} mensalidades:</strong> ${atualizar} serão baixadas, ${criar} criadas já pagas, ${jaPagos} já estavam pagas (puladas).</div>
    <div class="alertline al-ok">🎟️ <strong>${recs.length} receitas avulsas</strong> (convidados, patrocínios, contribuições): ${brl(totRec)}.</div>
    <div class="alertline al-ok">🧾 <strong>${desps.length} despesas</strong> (campo, água, transporte...): ${brl(totDesp)}.</div>
    ${naoAchados.size?`<div class="alertline al-warn">⚠️ Mensalistas sem cadastro no sistema (pulados): ${[...naoAchados].map(esc).join(', ')}</div>`:''}
    ${(mens.length+recs.length+desps.length)?`<button style="background:var(--ok)" onclick="aplicarImport()">✔ Aplicar tudo no sistema</button>`:'<p class="mut">Nada novo para importar.</p>'}`;
  }catch(e){ toast('⚠️ '+e.message); }
}
async function aplicarImport(){
  if(!impPlano)return;
  const {mens,recs,desps,arquivo}=impPlano; let n=0;
  const lote='imp_'+Date.now().toString(36);
  const origem=`Planilha "${arquivo}" — importada em ${new Date().toLocaleDateString('pt-BR')}`;
  toast('Aplicando importação…');
  for(const x of mens){
    const mm=String(x.mes).padStart(2,'0'), descr=`Mensalidade ${mm}/${x.ano}`;
    const venc=`${x.ano}-${mm}-${String(db.config.mensDia).padStart(2,'0')}`;
    const ex=db.cobrancas.find(c=>c.atletaId===x.aid&&c.desc===descr);
    if(ex){ if(ex.status==='pago')continue;
      await q(sb.from('cobrancas').update({status:'pago',pago_em:x.pago,valor:x.valor,origem,origem_lote:lote+':baixa'}).eq('id',ex.id)); n++; }
    else{ await q(sb.from('cobrancas').insert({atleta_id:x.aid,descricao:descr,valor:x.valor,venc,status:'pago',pago_em:x.pago,origem,origem_lote:lote+':novo'})); n++; }
  }
  if(recs.length){
    await q(sb.from('cobrancas').insert(recs.map(x=>({atleta_id:x.aid||null,convidado:x.convidado||'',descricao:x.desc,valor:x.valor,venc:x.data,status:'pago',pago_em:x.data,origem,origem_lote:lote+':novo'}))));
    n+=recs.length;
  }
  if(desps.length){
    await q(sb.from('despesas').insert(desps.map(x=>({data:x.data,item:x.item,categoria:x.categoria,qtd:1,valor:x.valor,fornecedor:'',obs:x.obs||'',quem:me.nome,origem,origem_lote:lote+':novo'}))));
    n+=desps.length;
  }
  log('financeiro',`${origem}: ${mens.length} mensalidades, ${recs.length} receitas, ${desps.length} despesas (lote ${lote})`);
  impPlano=null; fecha(); await recarrega(); toast(`✔ ${n} lançamentos importados — veja a fonte de cada um e desfaça em Financeiro → Arquivos`);
}

async function exportModelo(){
  toast('Gerando a planilha modelo…');
  try{
    await carregaXLSX();
    const ano=String(new Date().getFullYear());
    const wb=XLSX.book_new?XLSX.book_new():XLSX.utils.book_new();
    // Aba 1: LISTAGEM (grade nomes × meses)
    const grade=[[],['','',db.config.time.toUpperCase()],['','',`PIX PAGAMENTO: ${db.config.pix||'—'}`],
      ['ATUALIZADA: '+new Date().toLocaleDateString('pt-BR'),'','','',`VALOR DA MENSALIDADE: ${brl(db.config.mensValor)} (até dia ${db.config.mensDia}; após: ${brl(db.config.mensApos)})`],
      ['QTD.','NOME',...MES_LBL.slice(1)]];
    const els=[...elenco()].sort((a,b)=>a.nome.localeCompare(b.nome));
    els.forEach((a,i)=>{
      const linha=[i+1,normNome(a.nome)];
      for(let m=1;m<=12;m++){
        const descr=`Mensalidade ${String(m).padStart(2,'0')}/${ano}`;
        const c=db.cobrancas.find(x=>x.atletaId===a.id&&x.desc===descr);
        if(!c)linha.push('');
        else if(c.status==='pago')linha.push(Number(c.valor)===Number(db.config.mensValor)?'PG':Number(c.valor));
        else if(c.status==='atrasado')linha.push('Falta '+Number(valorDe(c)));
        else linha.push('');
      }
      grade.push(linha);
    });
    XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(grade),'LISTAGEM '+ano);
    // Abas mensais de arrecadação (meses com pagamento)
    const MABA=['','Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
    for(let m=1;m<=12;m++){
      const pagos=db.cobrancas.filter(c=>c.status==='pago'&&c.pagoEm&&String(c.pagoEm).slice(0,7)===`${ano}-${String(m).padStart(2,'0')}`);
      if(!pagos.length)continue;
      const aoa=[['','Atletas','','']];
      pagos.sort((a,b)=>nomeCob(a).localeCompare(nomeCob(b))).forEach((c,i)=>{
        aoa.push([i+1,nomeCob(c).replace('🎟️ ',''),Number(c.valor),`em ${dbr(c.pagoEm)}${ehMensal(c)?'':' — '+c.desc}`]); });
      aoa.push(['','Total',pagos.reduce((s,c)=>s+Number(c.valor),0),'']);
      XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(aoa),`${MABA[m]} ${ano.slice(2)}`);
    }
    // Aba Orçamento anual
    const mesSoma=(filtro)=>{ const arr=[]; let tot=0;
      for(let m=1;m<=12;m++){ const v=db.cobrancas.filter(c=>c.status==='pago'&&c.pagoEm&&String(c.pagoEm).slice(0,7)===`${ano}-${String(m).padStart(2,'0')}`&&filtro(c)).reduce((s,c)=>s+Number(c.valor),0); arr.push(v||''); tot+=v; }
      return [...arr,tot||'']; };
    const despMes=(filtro)=>{ const arr=[]; let tot=0;
      for(let m=1;m<=12;m++){ const v=db.despesas.filter(d=>String(d.data).slice(0,7)===`${ano}-${String(m).padStart(2,'0')}`&&filtro(d)).reduce((s,d)=>s+Number(d.valor),0); arr.push(v||''); tot+=v; }
      return [...arr,tot||'']; };
    const orc=[['ORÇAMENTO ANUAL '+ano],[],['RENDA'],['Item',...MABA.slice(1),'Total'],
      ['Mensalidades',...mesSoma(c=>ehMensal(c))],
      ['Avulsos',...mesSoma(c=>!ehMensal(c))],
      ['Patrocínio (contratos ativos)','','','','','','','','','','','','',(db.pats||[]).filter(p=>p.ativo).reduce((s,p)=>s+Number(p.valor||0),0)||''],
      [],['DESPESAS'],['Categoria',...MABA.slice(1),'Total']];
    CATS_DESP.forEach(cat=>{ const linha=despMes(d=>d.categoria===cat); if(linha[12]!=='')orc.push([cat,...linha]); });
    orc.push(['Total de despesas',...despMes(()=>true)]);
    const rec=db.cobrancas.filter(c=>c.status==='pago').reduce((s,c)=>s+Number(c.valor),0);
    orc.push([],['SALDO INICIAL'+(db.config.saldoIniObs?' ('+db.config.saldoIniObs+')':''),'','','','','','','','','','','','',db.config.saldoIni||''],
      ['SALDO EM CAIXA','','','','','','','','','','','','',db.config.saldoIni+rec-totDespesas()]);
    XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(orc),'Orçamento '+ano);
    XLSX.writeFile(wb,'planilha-oab-master-'+hoje()+'.xlsx');
    toast('Planilha modelo baixada ✔');
  }catch(e){ toast('⚠️ '+e.message); }
}

async function salvaUni(){
  const d=fval('u_desc'); if(!d){toast('Descreva o uniforme');return;}
  const nums=new Set();
  for(const tok of fval('u_nums').split(/[,;]/).map(s=>s.trim()).filter(Boolean)){
    const mr=tok.match(/^(\d+)\s*[-–a]\s*(\d+)$/);
    if(mr){ const a=+mr[1], b=+mr[2]; if(b<a){toast(`Intervalo inválido: "${tok}"`);return;}
      for(let n=a;n<=b;n++)nums.add(n); }
    else if(/^\d+$/.test(tok)) nums.add(+tok);
    else { toast(`Não entendi "${tok}" — use números e intervalos (ex.: 1-10, 25)`); return; }
  }
  if(!nums.size){toast('Informe a numeração (ex.: 1-10, 15-20, 25)');return;}
  if(nums.size>60){toast('Máximo de 60 números por lote');return;}
  const jaExistem=[...nums].filter(n=>db.uniformes.some(u=>u.descricao===d&&u.numero===String(n)));
  if(jaExistem.length){toast(`Os números ${jaExistem.join(', ')} já existem em "${d}" — remova-os da lista`);return;}
  const pcs=[...document.querySelectorAll('.chk_peca:checked')].map(c=>c.value);
  if(!pcs.length){toast('Marque ao menos uma peça');return;}
  const pecas={}; pcs.forEach(k=>pecas[k]='estoque');
  const gkSet=new Set(fval('u_gk').split(/[,;]/).map(s=>parseInt(s.trim())).filter(n=>!isNaN(n)));
  const ordenados=[...nums].sort((a,b)=>a-b);
  const rows=ordenados.map(n=>({descricao:d,numero:String(n),tamanho:'',pecas,fornecedor:fval('u_forn'),
    goleiro:gkSet.has(n),cor:gkSet.has(n)?(fval('u_gkcor')||fval('u_cor')):fval('u_cor')}));
  await q(sb.from('uniformes').insert(rows));
  log('uniforme',`Lote cadastrado: ${d}, números ${fval('u_nums')} (${pcs.map(k=>PECAS_LBL[k]).join(', ')})`);
  fecha(); await recarrega(); toast(`${rows.length} uniforme(s) cadastrado(s)`);
}

async function entregaGo(id){
  const u=byId(db.uniformes,id);
  const conv=$('eu_conv')?fval('eu_conv'):(u.convidado||'');
  const pcs=[...document.querySelectorAll('.chk_ent:checked')].map(c=>c.value);
  if(!pcs.length){toast('Marque ao menos uma peça');return;}
  if(conv){ // atleta de fora do sistema — registro manual, sem termo eletrônico
    const pecas={...u.pecas}; pcs.forEach(k=>pecas[k]='atleta');
    await q(sb.from('uniformes').update({status:'com_atleta',atleta_id:null,convidado:conv,convidado_fone:($('eu_convfone')?fval('eu_convfone'):''),entregue_em:agora(),aceito_em:'registro manual — '+agora(),pecas}).eq('id',id));
    log('uniforme',`Uniforme nº ${u.numero}: ${pcs.map(k=>PECAS_LBL[k]).join(', ')} entregue(s) a ${conv} (de fora do sistema — registro manual)`);
    fecha(); await recarrega(); toast('Entrega registrada para '+conv+' 🎟️');
    return;
  }
  const aid=$('eu_quem')?fval('eu_quem'):u.atletaId;
  const a=at(aid);
  const pecas={...u.pecas}; pcs.forEach(k=>pecas[k]='pendente');
  await q(sb.from('uniformes').update({status:'pendente',atleta_id:aid,convidado:'',entregue_em:agora(),pecas}).eq('id',id));
  log('uniforme',`Uniforme nº ${u.numero}: ${pcs.map(k=>PECAS_LBL[k]).join(', ')} entregue(s) a ${a.nome} — aguardando aceite`);
  fecha(); await recarrega(); toast('Entrega registrada — aguardando aceite');
  if(a.fone){ const msg=`👕 *${db.config.time}*\n\nOlá, ${pnome(a.nome)}! Registramos a entrega de: *${pcs.map(k=>PECAS_LBL[k]).join(', ')}* do uniforme nº ${u.numero} (${u.descricao}).\n\nEntre no sistema e aceite o *termo de responsabilidade* no seu perfil. Devolva no retorno das viagens. 🤝`;
    modal(`<h2>Avisar o atleta?</h2><div class="row" style="margin-top:12px"><button onclick="window.open(waLink('${esc(a.fone)}',\`${msg.replace(/`/g,'')}\`),'_blank');fecha()">📱 Enviar aviso</button><button class="sec" onclick="fecha()">Agora não</button></div>`); }

async function devolveGo(id){

  const pecas={...u.pecas};
  [...document.querySelectorAll('.sel_dev')].forEach(s=>{ pecas[s.dataset.k]=s.value; });
  const comAtleta=Object.values(pecas).some(v=>v==='atleta'||v==='pendente');
  const status=comAtleta?(Object.values(pecas).some(v=>v==='pendente')?'pendente':'com_atleta'):'estoque';
  const patch={pecas,status};
  if(!comAtleta){ patch.atleta_id=null; patch.convidado=''; patch.convidado_fone=''; patch.aceito_em=''; patch.entregue_em=''; }
  await q(sb.from('uniformes').update(patch).eq('id',id));
  const falt=Object.entries(pecas).filter(([,v])=>v==='faltando').map(([k])=>PECAS_LBL[k]);
  log('uniforme',`Devolução do uniforme nº ${u.numero} registrada${falt.length?' — FALTANDO: '+falt.join(', '):''}`);

}

function relacaoMateriais(){
  // agrupa TUDO por pessoa: uniformes + materiais emprestados
  const pessoas={};
  const pega=k=>(pessoas[k]??={unis:[],emps:[]});
  db.uniformes.filter(u=>u.atletaId||u.convidado).forEach(u=>{
    pega(u.atletaId?nomeAt(u.atletaId):('🎟️ '+u.convidado)).unis.push(u);
  });
  db.inventario.forEach(i=>(i.emprestimos||[]).forEach(e=>{
    const cad=membros().find(a=>normNome(pnome(a.nome))===normNome(e.nome)||normNome(a.nome)===normNome(e.nome));
    pega(cad?cad.nome:('🎟️ '+e.nome)).emps.push({item:i.nome,...e});
  }));
  const linhas=[];
  if(Object.keys(pessoas).length){
    linhas.push('*📋 Pendências de devolução, por atleta:*','');
    Object.entries(pessoas).sort((a,b)=>a[0].localeCompare(b[0])).forEach(([nome,p])=>{
      linhas.push(`*${nome}:*`);
      p.unis.forEach(u=>{
        const pcs=Object.entries(u.pecas||{}).filter(([,v])=>v==='atleta'||v==='pendente').map(([k])=>PECAS_LBL[k].toLowerCase()).join(', ');
        const falt=Object.entries(u.pecas||{}).filter(([,v])=>v==='faltando').map(([k])=>PECAS_LBL[k].toLowerCase()).join(', ');
        linhas.push(`   👕 ${u.descricao} nº ${u.numero}${u.goleiro?' 🧤':''} — ${pcs||'—'}${u.status==='pendente'?' ⚠️ termo pendente':''}${falt?' · FALTANDO: '+falt:''}`);
      });
      p.emps.forEach(e=>linhas.push(`   📦 ${e.qtd}× ${e.item} (desde ${e.quando})`));
      linhas.push('');
    });
  }
  const faltEstoque=db.uniformes.filter(u=>!u.atletaId&&!u.convidado&&Object.values(u.pecas||{}).some(v=>v==='faltando'));
  if(faltEstoque.length){
    linhas.push('*⚠️ Peças extraviadas (sem responsável):*');
    faltEstoque.forEach(u=>{ const falt=Object.entries(u.pecas||{}).filter(([,v])=>v==='faltando').map(([k])=>PECAS_LBL[k].toLowerCase()).join(', ');
      linhas.push(`• ${u.descricao} nº ${u.numero} — ${falt}`); });
  }
  if(!linhas.length){toast('Nada com ninguém: uniformes e materiais todos no estoque! 🎉');return;}
  const msg=`👕 *${db.config.time} — Relação de uniformes e materiais*\n📅 ${new Date().toLocaleDateString('pt-BR')}\n\n${linhas.join('\n').replace(/\n{3,}/g,'\n\n')}\n_Pedimos a devolução após os jogos e viagens. Qualquer divergência, falar com a diretoria._ 🤝⚖️`;
  modalWhats('Relação de uniformes e materiais',msg);
  log('uniforme','Relação de uniformes/materiais gerada para o WhatsApp');
}

async function salvaItem(id){ const n=fval('i_nome'); if(!n){toast('Informe o item');return;}
  const b=$('btn_it'); if(b)b.disabled=true;
  let foto_url=id?(byId(db.inventario,id).fotoUrl||''):'';
  const f=$('i_foto')&&$('i_foto').files[0];
  if(f){ if(f.size>4*1048576){toast('Foto grande demais (máx. 4 MB)');if(b)b.disabled=false;return;}
    const path='materiais/'+uid()+'-'+f.name.replace(/[^\w.\-]+/g,'_');
    const {error}=await sb.storage.from('publico').upload(path,f);
    if(error){toast('⚠️ Envio da foto falhou: '+error.message);if(b)b.disabled=false;return;}
    foto_url=SB_URL+'/storage/v1/object/public/publico/'+path; }
  const dados={nome:n,cat:fval('i_cat')||'Geral',qtd:Number(fval('i_qtd'))||1,marca:fval('i_marca'),cor:fval('i_cor'),material:fval('i_mat'),obs:fval('i_obs'),foto_url};
  if(id) await q(sb.from('inventario').update(dados).eq('id',id));

async function limparTodosOsLancamentos(){
  const msg=`⚠️ ATENÇÃO! Você vai deletar TODOS os lançamentos:\n\n• ${db.despesas.length} despesas\n• ${db.balanco.length} receitas\n\nEsta ação NÃO PODE SER DESFEITA!\n\nTem certeza?`;
  if(!confirm(msg)){return;}
  if(!confirm('Tem CERTEZA mesmo? Digite "sim" se quer continuar.')){return;}

  toast('Limpando lançamentos…');
  try{
    // Deletar todas as despesas
    if(db.despesas.length>0){
      const ids=db.despesas.map(d=>d.id);
      await q(sb.from('despesas').delete().in('id',ids));
    }
    // Deletar todas as receitas
    if(db.balanco.length>0){
      const ids=db.balanco.map(r=>r.id);
      await q(sb.from('balanco_receitas').delete().in('id',ids));
    }
    log('financeiro','LIMPEZA TOTAL: todos os lançamentos deletados');
    await recarrega();
    toast('✅ Lançamentos limpados com sucesso!');
  }catch(e){
    toast('❌ Erro ao limpar: '+e.message);
    console.error(e);
  }
}

async function pdfParaPng(file){
  if(!window.pdfjsLib){
    await new Promise((res,rej)=>{ const s=document.createElement('script'); s.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js'; s.onload=res; s.onerror=()=>rej(new Error('sem internet para carregar o conversor')); document.head.appendChild(s); });
    pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  }
  const pdf=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise;
  const page=await pdf.getPage(1);
  const vp0=page.getViewport({scale:1});
  const vp=page.getViewport({scale:Math.min(4,1400/Math.max(vp0.width,vp0.height))});
  const c=document.createElement('canvas'); c.width=vp.width; c.height=vp.height;
  const ctx=c.getContext('2d'); ctx.fillStyle='#fff'; ctx.fillRect(0,0,c.width,c.height);
  await page.render({canvasContext:ctx,viewport:vp}).promise;
  const d=ctx.getImageData(0,0,c.width,c.height).data;
  let minX=c.width,minY=c.height,maxX=0,maxY=0;
  for(let y=0;y<c.height;y+=2)for(let xx=0;xx<c.width;xx+=2){ const i=(y*c.width+xx)*4;
    if(d[i]<245||d[i+1]<245||d[i+2]<245){ if(xx<minX)minX=xx; if(xx>maxX)maxX=xx; if(y<minY)minY=y; if(y>maxY)maxY=y; } }
  let alvo=c;
  if(maxX>minX&&maxY>minY){ const pad=10;
    minX=Math.max(0,minX-pad); minY=Math.max(0,minY-pad); maxX=Math.min(c.width,maxX+pad); maxY=Math.min(c.height,maxY+pad);
    alvo=document.createElement('canvas'); alvo.width=maxX-minX; alvo.height=maxY-minY;
    alvo.getContext('2d').drawImage(c,minX,minY,alvo.width,alvo.height,0,0,alvo.width,alvo.height); }
  return await new Promise(r=>alvo.toBlob(r,'image/png'));
}
async function salvaPat(id){
  const nome=fval('p_nome'); if(!nome){toast('Informe o nome');return;}
  const b=$('btn_pat'); b.disabled=true;
  let logo_url=id?(byId(db.pats,id).logo_url||''):'';
  let f=$('p_logo').files[0];
  if(f&&(f.type==='application/pdf'||/\.pdf$/i.test(f.name))){
    toast('Convertendo o PDF em imagem…');
    try{ const blob=await pdfParaPng(f); f=new File([blob],f.name.replace(/\.pdf$/i,'')+'.png',{type:'image/png'}); }
    catch(e){ toast('⚠️ Não consegui converter o PDF: '+e.message); b.disabled=false; return; }
  }
  if(f){ if(f.size>3*1048576){toast('Logo grande demais (máx. 3 MB)');b.disabled=false;return;}
    const path='patrocinadores/'+uid()+'-'+f.name.replace(/[^\w.\-]+/g,'_');
    const {error}=await sb.storage.from('publico').upload(path,f);
    if(error){toast('⚠️ Envio da logo falhou: '+error.message);b.disabled=false;return;}
    logo_url=SB_URL+'/storage/v1/object/public/publico/'+path; }
  const dados={nome,tier:fval('p_tier'),link:fval('p_link'),beneficio:fval('p_ben'),logo_url,ativo:$('p_ativo').checked,ordem:Number(fval('p_ord'))||0,valor:Number(fval('p_valor'))||0,vigencia_ate:fval('p_vig')||null};
  if(id) await q(sb.from('patrocinadores').update(dados).eq('id',id));
  else await q(sb.from('patrocinadores').insert(dados));
  log('patrocinio',`Patrocinador ${id?'atualizado':'cadastrado'}: ${nome}`);
  fecha(); await recarrega(); toast('Patrocinador salvo');
}
