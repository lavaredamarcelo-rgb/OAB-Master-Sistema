async function lerPlanilhaBalanco(){
  const f=$('imp_bal_file').files[0];if(!f){toast('Escolha arquivo');return;}
  toast('Lendo planilha…');
  try{
    await carregaXLSX();
    const wb=XLSX.read(await f.arrayBuffer());
    console.log('Planilhas encontradas:',wb.SheetNames);
    const acoes=[];
    const numDe=v=>{ const n=Number(String(v).replace(/[R$\s.]/g,m=>m==='.'?'.':'').replace(',','.')); return isNaN(n)?0:n; };

    for(const sn of wb.SheetNames){
      console.log(`Lendo aba: ${sn}`);
      const rows=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,defval:''});
      console.log(`Total de linhas: ${rows.length}`);
      console.log('Primeiras 3 linhas:', rows.slice(0,3));

      for(let i=0; i<rows.length; i++){
        const r=rows[i];
        console.log(`Linha ${i}:`, r);
        const item=String(r[0]||'').trim();
        const val=numDe(r[1]||'');
        let data=String(r[2]||hoje()).trim();

        // Validar formato de data (YYYY-MM-DD)
        if(!data.match(/^\d{4}-\d{2}-\d{2}$/)){
          console.log(`  Data inválida "${data}", usando hoje()`);
          data=hoje();
        }

        console.log(`  Item="${item}", Valor=${val}, Data="${data}"`);
        if(!item||val<=0){console.log('  Ignorada (item vazio ou valor 0)');continue;}
        acoes.push({item,valor:val,data});
      }
    }
    console.log('Total de registros lidos:',acoes.length);
    if(!acoes.length){toast('Nenhum registro encontrado - verifique formato da planilha');return;}
    impBalancoAcoes=acoes;
    $('imp_bal_prev').innerHTML=`<div class="card"><strong>${acoes.length} registros encontrados</strong><p class="mut">${acoes.slice(0,5).map(a=>esc(a.item)+' — '+brl(a.valor)).join('<br>')}</p><button class="gold" style="margin-top:8px" onclick="aplicaImportBalanco()">✓ Aplicar importação</button></div>`;
    toast('Pronto! Clique em Aplicar para confirmar.');
  }catch(e){
    console.error('Erro ao ler planilha:',e);
    toast('Erro ao ler: '+e.message);
  }
}
async function aplicaImportBalanco(){
  if(!impBalancoAcoes.length){toast('Nenhum dado para importar');return;}
  const tipo=impBalancoTipo;
  const autor=me?.nome||'Sistema';
  const qtd=impBalancoAcoes.length;
  console.log('Iniciando importação:',{tipo,autor,qtd,dados:impBalancoAcoes});

  // Testar inserção de um registro de teste primeiro
  try{
    if(tipo==='receita'){
      // Teste com 1 receita
      const teste={data:impBalancoAcoes[0].data,tipo:'outro',descricao:impBalancoAcoes[0].item,valor:impBalancoAcoes[0].valor,origem:'Importado de planilha',autor:autor};
      console.log('Testando 1 receita:',teste);
      const {error:err1}=await sb.from('balanco_receitas').insert([teste]);
      if(err1){console.error('Erro receita:',err1);throw new Error('Receita: '+err1.message);}

      // Se teste passou, inserir o resto
      const rows=impBalancoAcoes.map(a=>({data:a.data,tipo:'outro',descricao:a.item,valor:a.valor,origem:'Importado de planilha',autor:autor}));
      console.log('Inserindo todas receitas:',rows.length);
      const {error}=await sb.from('balanco_receitas').insert(rows);
      if(error)throw new Error(error.message);
    }else{
      // Teste com 1 despesa
      const teste={data:impBalancoAcoes[0].data,item:impBalancoAcoes[0].item,categoria:'Outros',qtd:1,valor:impBalancoAcoes[0].valor,quem:me?.nome||'Sistema',obs:'Teste',tipo_lancamento:'importado'};
      console.log('Testando 1 despesa:',teste);
      const {error:err1}=await sb.from('despesas').insert([teste]);
      if(err1){console.error('Erro despesa:',err1);throw new Error('Despesa: '+err1.message);}

      // Se teste passou, inserir o resto
      const rows=impBalancoAcoes.map(a=>({data:a.data,item:a.item,categoria:'Outros',qtd:1,valor:a.valor,quem:me?.nome||'Sistema',obs:'Importado de planilha',tipo_lancamento:'importado'}));
      console.log('Inserindo todas despesas:',rows.length);
      const {error}=await sb.from('despesas').insert(rows);
      if(error)throw new Error(error.message);
    }
    log('financeiro',`Importação Balanço ${tipo}: ${qtd} registros`);
    impBalancoAcoes=[];impBalancoTipo='';
    fecha();
    await recarrega();
    toast('✅ '+qtd+' registros importados com sucesso!');
  }catch(e){
    const msg='❌ '+String(e.message||e);
    console.error('Erro:',e);
    toast(msg);
  }
}

      ${receitas.filter(r=>!r.pago).length?`<span class="pill p-warn">${receitas.filter(r=>!r.pago).length} pendente</span>`:''}

      <div class="tblwrap"><table><tr><th>Data</th><th>Descrição</th><th>Valor</th><th>Status</th></tr>
      ${receitas.length?receitas.map(r=>`<tr>

  <details>

    </div>
  </details>
  </div>`;

const MESES_NOME=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
function gerarPDFFinanceiro(){
  const anoAtual=new Date().getFullYear();
  const anos=[...new Set([...db.balanco.map(r=>r.data.slice(0,4)),...db.despesas.map(d=>d.data.slice(0,4)),...db.cobrancas.map(c=>c.venc.slice(0,4)),String(anoAtual)])].sort().reverse();
  modal(`<h2>📊 Relatório Financeiro Detalhado</h2>
  <div class="grid g3">
  <div><label>Ano</label><select id="rf_ano">${anos.map(a=>`<option ${a==String(anoAtual)?'selected':''}>${a}</option>`).join('')}</select></div>
  <div><label>De</label><select id="rf_de">${MESES_NOME.map((m,i)=>`<option value="${i}" ${i===0?'selected':''}>${m}</option>`).join('')}</select></div>
  <div><label>Até</label><select id="rf_ate">${MESES_NOME.map((m,i)=>`<option value="${i}" ${i===11?'selected':''}>${m}</option>`).join('')}</select></div>
  </div>
  <div class="row" style="margin-top:10px"><input type="checkbox" id="rf_resumo" checked style="width:auto"><span>Resumir mensalidades em 1 linha por mês (recomendado)</span></div>
  <div class="row" style="margin-top:6px"><input type="checkbox" id="rf_cat" checked style="width:auto"><span>Incluir gastos por categoria de despesa</span></div>
  <div class="row" style="margin-top:14px"><button onclick="gerarPDFFinanceiroGo()">📄 Gerar PDF</button><button class="sec" onclick="fecha()">Cancelar</button></div>`);
}
function gerarPDFFinanceiroGo(){
  const ano=fval('rf_ano')||String(new Date().getFullYear());
  const mDe=Number(fval('rf_de'))||0, mAte=Number(fval('rf_ate'));
  const ate=isNaN(mAte)?11:mAte;
  if(mDe>ate){toast('O mês "De" deve vir antes do "Até"');return;}
  const resumoMens=$('rf_resumo')&&$('rf_resumo').checked;
  const porCat=$('rf_cat')&&$('rf_cat').checked;
  fecha();
  // Acumulado parte do saldo inicial + tudo pago ANTES do período
  const antes=pf=>pf<ano+'-'+String(mDe+1).padStart(2,'0');
  let acum=db.config.saldoIni
    +db.balanco.filter(r=>r.pago&&antes(r.data.slice(0,7))).reduce((s,r)=>s+Number(r.valor),0)
    +db.cobrancas.filter(c=>c.status==='pago'&&antes(c.venc.slice(0,7))).reduce((s,c)=>s+Number(valorDe(c)),0)
    -db.despesas.filter(d=>d.pago&&antes(d.data.slice(0,7))).reduce((s,d)=>s+Number(d.valor),0);
  const acumInicio=acum;
  const meses=[];
  for(let i=mDe;i<=ate;i++){
    const pf=ano+'-'+String(i+1).padStart(2,'0');
    const rec=db.balanco.filter(r=>r.data.startsWith(pf)&&r.pago).reduce((s,r)=>s+Number(r.valor),0);
    const men=db.cobrancas.filter(c=>c.venc.startsWith(pf)&&c.status==='pago').reduce((s,c)=>s+Number(valorDe(c)),0);
    const des=db.despesas.filter(d=>d.data.startsWith(pf)&&d.pago).reduce((s,d)=>s+Number(d.valor),0);
    const saldo=rec+men-des; acum+=saldo;
    meses.push({i,pf,rec,men,des,saldo,acum});
  }
  const recT=meses.reduce((s,m)=>s+m.rec,0), menT=meses.reduce((s,m)=>s+m.men,0), desT=meses.reduce((s,m)=>s+m.des,0);
  const mMov=meses.filter(m=>m.rec+m.men+m.des>0).length||1;
  const medias=`<h2>📐 Médias mensais — para planejamento</h2>
  <div class="cards">
    <div class="card"><div class="n ok">${brl((recT+menT)/mMov)}</div><div class="l">Receita média/mês</div></div>
    <div class="card"><div class="n bad">${brl(desT/mMov)}</div><div class="l">Despesa média/mês</div></div>
    <div class="card"><div class="n ${(recT+menT-desT)>=0?'ok':'bad'}">${brl((recT+menT-desT)/mMov)}</div><div class="l">Resultado médio/mês</div></div>
  </div>
  <p style="font-size:11.5px;color:#8a8f99;text-align:center;margin-top:-10px">Calculada sobre ${mMov} m${mMov>1?'eses':'ês'} com movimento — referência do quanto entra e sai num mês típico.</p>`;
  // Gráfico de barras (evolução do saldo acumulado)
  const maxAbs=Math.max(1,...meses.map(m=>Math.abs(m.acum)));
  const grafico=`<h2>📈 Evolução do saldo em caixa</h2>
  <div style="margin:8px 0 4px">${meses.map(m=>`<div style="display:flex;align-items:center;gap:8px;margin-bottom:4px">
    <div style="width:38px;font-size:11px;font-weight:bold;text-align:right">${MESES_NOME[m.i].slice(0,3)}</div>
    <div style="flex:1;background:#f0f0f0;border-radius:4px;height:18px;position:relative;overflow:hidden">
      <div style="width:${Math.max(2,Math.round(Math.abs(m.acum)/maxAbs*100))}%;height:100%;background:${m.acum>=0?'#2E7D4F':'#c41e3a'};border-radius:4px"></div>
    </div>
    <div style="width:105px;font-size:11.5px;font-weight:bold" class="${m.acum>=0?'ok':'bad'}">${brl(m.acum)}</div>
  </div>`).join('')}</div>`;
  // Gastos por categoria (no período)
  const noPeriodo=d=>{const pf=d.data.slice(0,7);return pf>=ano+'-'+String(mDe+1).padStart(2,'0')&&pf<=ano+'-'+String(ate+1).padStart(2,'0');};
  const cats={};
  db.despesas.filter(d=>d.pago&&noPeriodo(d)).forEach(d=>{cats[d.categoria||'Sem categoria']=(cats[d.categoria||'Sem categoria']||0)+Number(d.valor);});
  const catRows=Object.entries(cats).sort((a,b)=>b[1]-a[1]);
  const secCat=porCat&&catRows.length?`<h2>🧾 Para onde foi o dinheiro — por categoria</h2>
  <table><tr><th>Categoria</th><th>Valor pago</th><th>% das despesas</th></tr>
  ${catRows.map(([c,v])=>`<tr><td><strong>${esc(c)}</strong></td><td class="bad">${brl(v)}</td><td>${desT?Math.round(v/desT*100):0}%</td></tr>`).join('')}</table>`:'';
  // Seções mensais
  const seccoes=meses.map(m=>{
    const itens=[];
    db.balanco.filter(r=>r.data.startsWith(m.pf)).forEach(r=>itens.push({data:r.data,desc:r.descricao+(r.pessoa?' · '+r.pessoa:''),tipo:'💵 Receita',valor:Number(r.valor),pago:r.pago,ent:true}));
    if(!resumoMens) db.cobrancas.filter(c=>c.venc.startsWith(m.pf)).forEach(c=>itens.push({data:c.venc,desc:c.desc+' — '+(c.atletaId?pnome(nomeAt(c.atletaId)):(c.convidado||'')),tipo:'💳 Mensalidade',valor:Number(valorDe(c)),pago:c.status==='pago',ent:true}));
    db.despesas.filter(d=>d.data.startsWith(m.pf)).forEach(d=>itens.push({data:d.data,desc:d.item+(d.categoria?' · '+d.categoria:'')+(d.fornecedor?' · 🏭 '+d.fornecedor:''),tipo:'🧾 Despesa',valor:Number(d.valor),pago:d.pago,ent:false}));
    itens.sort((a,b)=>a.data.localeCompare(b.data));
    const mensMes=db.cobrancas.filter(c=>c.venc.startsWith(m.pf));
    const mensPagas=mensMes.filter(c=>c.status==='pago');
    const mensResumo=resumoMens&&mensMes.length?`<tr style="background:#fdf6e3"><td>—</td><td><strong>💳 Mensalidades do mês</strong> — ${mensPagas.length} paga${mensPagas.length===1?'':'s'} de ${mensMes.length} (${mensMes.length?Math.round(mensPagas.length/mensMes.length*100):0}% adimplência)</td><td>💳 Resumo</td><td class="ok">+ ${brl(m.men)}</td><td>${mensMes.length-mensPagas.length?`<span class="warn">${mensMes.length-mensPagas.length} em aberto</span>`:'<span class="ok">✔ Todas pagas</span>'}</td></tr>`:'';
    if(!itens.length&&!mensResumo)return '';
    return `<div class="mes"><h2>📅 ${MESES_NOME[m.i]} / ${ano}</h2>
    <table><tr><th>Data</th><th>Descrição</th><th>Tipo</th><th>Valor</th><th>Situação</th></tr>
    ${mensResumo}
    ${itens.map(x=>`<tr><td>${dbr(x.data)}</td><td>${esc(x.desc)}</td><td>${x.tipo}</td><td class="${x.ent?'ok':'bad'}">${x.ent?'+':'−'} ${brl(x.valor)}</td><td>${x.pago?'<span class="ok">✔ Pago</span>':'<span class="warn">Pendente</span>'}</td></tr>`).join('')}
    <tr class="tot"><td colspan="3">Resultado do mês (somente pagos)</td><td colspan="2" class="${m.saldo>=0?'ok':'bad'}">${m.saldo>=0?'+':''}${brl(m.saldo)} · acumulado: ${brl(m.acum)}</td></tr>
    </table></div>`;
  }).join('');
  const periodo=mDe===0&&ate===11?`ano ${ano}`:`${MESES_NOME[mDe]} a ${MESES_NOME[ate]} de ${ano}`;
  abreRelatorio(`<h1>💰 Relatório Financeiro Detalhado</h1>
  <p class="sub">${esc(db.config.time)} — ${periodo} · valores consolidados consideram apenas lançamentos pagos</p>
  <div class="cards">

/* ================= NEGOCIAÇÃO DE ATRASADOS ================= */
const ehAcordo=c=>/^🤝 Acordo/.test(c.desc||'');
function planosNegociacao(atId){
  const atr=db.cobrancas.filter(c=>c.atletaId===atId&&c.status==='atrasado'&&!ehAcordo(c));
  if(!atr.length)return null;
  const totalCheio=+atr.reduce((s,c)=>s+restanteDe(c),0).toFixed(2);
  const totalBase=+atr.reduce((s,c)=>s+Math.max(0,Number(c.valor)-pagoParcial(c)),0).toFixed(2);
  const hj=new Date(); const anoStr=String(hj.getFullYear());
  const dia=Math.min(db.config.mensDia||10,28);
  const vencMes=m=>{ const d=new Date(hj.getFullYear(),m,dia);
    if(d<=hj){ const alt=new Date(hj.getTime()+5*864e5); return alt.toISOString().slice(0,10); }
    return `${anoStr}-${String(m+1).padStart(2,'0')}-${String(dia).padStart(2,'0')}`; };
  const meses=[]; for(let m=hj.getMonth();m<12;m++)meses.push(m);
  const n=meses.length;
  const distribui=(total,pesos)=>{ const soma=pesos.reduce((a,b)=>a+b,0);
    const parcelas=pesos.map(pz=>+(total*pz/soma).toFixed(2));
    const dif=+(total-parcelas.reduce((a,b)=>a+b,0)).toFixed(2);
    parcelas[parcelas.length-1]=+(parcelas[parcelas.length-1]+dif).toFixed(2);
    return parcelas.map((v,i)=>({venc:vencMes(meses[i]),valor:v})); };
  const planos=[];
  planos.push({key:'avista',titulo:'💰 Quitação à vista',sub:`Paga o valor base, sem os acréscimos de atraso — economia de ${brl(totalCheio-totalBase)}`,total:totalBase,parcelas:[{venc:hoje(),valor:totalBase}]});
  if(n>=2){
    planos.push({key:'linear',titulo:`📆 Parcelado em ${n}×`,sub:'Parcelas iguais até dezembro, junto com a mensalidade do mês',total:totalCheio,parcelas:distribui(totalCheio,meses.map(()=>1))});
    planos.push({key:'entrada',titulo:'💳 Entrada de 30% + parcelas',sub:`Entrada agora e o restante em ${n-1}× até dezembro`,total:totalCheio,
      parcelas:[{venc:hoje(),valor:+(totalCheio*0.3).toFixed(2)},...distribui(+(totalCheio*0.7).toFixed(2),meses.slice(1).map(()=>1))]});
    planos.push({key:'escalonado',titulo:'📈 Escalonado (começa leve)',sub:'Parcelas crescentes — a maior fica para dezembro',total:totalCheio,parcelas:distribui(totalCheio,meses.map((_,i)=>i+1))});
  }
  return {atr,totalCheio,totalBase,planos};
}
function modalNegociacao(atId){
  const a=at(atId); if(!a)return;
  const N=planosNegociacao(atId);
  if(!N){toast('Este jogador não tem cobranças em atraso para negociar 🎉');return;}
  subState.negPlanos=N.planos; subState.negAtleta=atId;

/* ---- Pix: QR Code e copia e cola (padrão BR Code do Banco Central) ---- */
function crc16(s){ let crc=0xFFFF;
  for(let i=0;i<s.length;i++){ crc^=s.charCodeAt(i)<<8;
    for(let j=0;j<8;j++){ crc=(crc&0x8000)?((crc<<1)^0x1021):(crc<<1); crc&=0xFFFF; } }
  return crc.toString(16).toUpperCase().padStart(4,'0'); }
function pixPayload(valor){
  if(!db.config.pix)return '';
  const emv=(id,v)=>id+String(v.length).padStart(2,'0')+v;
  const limpa=(s,n)=>(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^A-Za-z0-9 ]/g,' ').replace(/\s+/g,' ').trim().toUpperCase().slice(0,n);
  const nome=limpa(db.config.time,25)||'TIME';
  let p=emv('00','01')
    +emv('26',emv('00','br.gov.bcb.pix')+emv('01',db.config.pix.trim()))
    +emv('52','0000')+emv('53','986');
  if(valor>0)p+=emv('54',valor.toFixed(2));
  p+=emv('58','BR')+emv('59',nome)+emv('60','BELEM')+emv('62',emv('05','***'));
  return p+'6304'+crc16(p+'6304');
}
async function carregaQR(){ if(window.QRCode)return;
  await new Promise((res,rej)=>{ const s=document.createElement('script'); s.src='https://cdn.jsdelivr.net/npm/qrcode@1.5.4/build/qrcode.min.js'; s.onload=res; s.onerror=()=>rej(new Error('sem internet para carregar o gerador de QR')); document.head.appendChild(s); });
}

  const c=byId(db.cobrancas,id); if(!c)return;

  const valor=restanteDe(c)>0?restanteDe(c):Number(valorDe(c));

  modal(`<h2>💳 Pagar com Pix</h2>

  </div>
  <p class="mut" style="margin-top:10px">Após o pagamento, envie o comprovante à diretoria para dar baixa. 🤝</p>`);
  try{ await carregaQR(); window.QRCode.toCanvas($('pix_qr'),payload,{width:232,margin:1}); }
  catch(_){ const el=$('pix_qr'); if(el)el.parentElement.innerHTML='<p class="mut">Não consegui desenhar o QR — use o copia e cola abaixo, funciona igual.</p>'; }

function cobrarAtrasados(){
  const atr=db.cobrancas.filter(c=>c.status==='atrasado');
  if(!atr.length){toast('Nenhum atraso! 🎉');return;}
  const totv=atr.reduce((s,c)=>s+Number(valorDe(c)),0);
  const nomes=[...new Set(atr.map(c=>c.atletaId?'@'+pnome(nomeAt(c.atletaId)):(c.convidado||'').trim()).filter(Boolean))].sort();
  const msg=`⚽ *${db.config.time} — Aviso da Tesouraria*\n\nPrezados(as) atletas,\n\nConstam *${atr.length} cobrança(s) em aberto*, totalizando *${brl(totv)}*.\n\n📣 Atenção: ${nomes.join(', ')}\n\nPedimos que cada um verifique a própria situação no sistema e regularize o quanto antes. Quem já pagou, por favor desconsidere e envie o comprovante.${db.config.pix?'\n\n💳 Pix: '+db.config.pix:''}\n\nA pontualidade de todos mantém o clube em campo. Contamos com vocês! 🤝⚖️`;
  modalWhats('Aviso geral no grupo',msg);
}
async function pagou(id){
  const c=byId(db.cobrancas,id);
  const patch={status:'pago',pago_em:hoje()};
  if(c&&ehMensal(c)&&c.status==='atrasado')patch.valor=db.config.mensApos;
  await q(sb.from('cobrancas').update(patch).eq('id',id));
  log('financeiro',`Pagamento baixado: ${nomeAt(byId(db.cobrancas,id).atletaId)}`);
  await recarrega(); toast('Pagamento registrado'); }

async function salvaEdicaoCobranca(id){
  const desc=fval('ed_desc'),pessoa=fval('ed_pessoa'),detalhes=fval('ed_detalhes');
  if(!desc){toast('Preencha a descrição');return;}
  const c=byId(db.cobrancas,id);
  if(c){
    await q(sb.from('cobrancas').update({descricao:desc,pessoa:pessoa||null,detalhes:detalhes||null}).eq('id',id));
    c.desc=desc; c.pessoa=pessoa; c.detalhes=detalhes;
  }
  fecha(); renderTab(); toast('✅ Cobrança atualizada!');
}
function delCobranca(id){ const c=byId(db.cobrancas,id); confirma(`Excluir a cobrança "${esc(c?c.desc:'')}" de ${esc(c?nomeAt(c.atletaId):'')} (${c?brl(c.valor):''})?`,async()=>{ await q(sb.from('cobrancas').delete().eq('id',id)); await recarrega(); toast('Cobrança excluída'); }); }

async function salvaAvulso(){
  const data=fval('av_data')||hoje(), v=Number(fval('av_valor'))||db.config.avulsoValor, detalhes=fval('av_detalhes');
  const ids=[...document.querySelectorAll('.av_chk:checked')].map(c=>c.value);
  const convs=fval('av_conv').split(',').map(s=>s.trim()).filter(Boolean);
  if(!ids.length&&!convs.length){toast('Marque alguém ou informe convidados');return;}
  const pago=$('av_pago').checked;
  const rows=[...ids.map(aid=>({atleta_id:aid,descricao:'Treino avulso '+dbr(data),valor:v,venc:data,status:pago?'pago':'pendente',pago_em:pago?data:null,detalhes:detalhes||null})),
    ...convs.map(nm=>({atleta_id:null,convidado:nm,descricao:'Treino avulso '+dbr(data),valor:v,venc:data,status:pago?'pago':'pendente',pago_em:pago?data:null,pessoa:nm,detalhes:detalhes||null}))];
  await q(sb.from('cobrancas').insert(rows));
  log('financeiro',`Treino avulso ${dbr(data)}: ${rows.length} lançamento(s) de ${brl(v)}${pago?' (pagos)':' (em aberto)'}`);
  fecha(); await recarrega(); toast(rows.length+' registro(s) de treino avulso 🏃');
}
const pagoParcial=c=>(c.pagamentos||[]).reduce((s,p)=>s+Number(p.valor||0),0);
const restanteDe=c=>Math.max(0,Number(valorDe(c))-pagoParcial(c));
const FORMAS_PG=['Pix','Dinheiro','Transferência','Cartão','Outro'];
function formPagamento(id){
  const c=byId(db.cobrancas,id); const tardia=ehMensal(c)&&c.status==='atrasado';
  const devido=Number(valorDe(c)), jaPago=pagoParcial(c), resto=c.status==='pago'?0:Math.max(0,devido-jaPago);
  modal(`<h2>✔ Registrar pagamento</h2>
  <p class="mut">${esc(nomeCob(c))} — ${esc(c.desc)} · vence ${dbr(c.venc)}</p>
  <div class="grid g3" style="margin-top:8px">
    <div class="card stat" style="padding:8px"><div class="n" style="font-size:17px">${brl(devido)}</div><div class="l">Devido</div></div>
    <div class="card stat" style="padding:8px"><div class="n" style="font-size:17px;color:var(--ok)">${brl(jaPago)}</div><div class="l">Já pago</div></div>
    <div class="card stat" style="padding:8px"><div class="n" style="font-size:17px;color:${resto>0?'var(--warn)':'var(--ok)'}">${brl(resto)}</div><div class="l">Restante</div></div>
  </div>
  ${(c.pagamentos||[]).length?`<label style="margin-top:10px">Pagamentos já registrados</label>${c.pagamentos.map((p,i)=>`<div class="alertline al-ok" style="padding:6px 10px"><div style="flex:1">💰 ${brl(p.valor)} — ${dbr(p.data)}${p.forma?' · '+esc(p.forma):''}${p.quem?` <span class="mut">(${esc(p.quem)})</span>`:''}</div><button class="mini sec" onclick="removePagamento('${id}',${i})">✕</button></div>`).join('')}`:''}
  ${c.status!=='pago'?`<div class="grid g3">
  <div><label>Data</label><input id="pg_data" type="date" value="${hoje()}"></div>
  <div><label>Valor recebido (R$)</label><input id="pg_valor" type="number" step="0.01" value="${resto.toFixed(2)}"></div>
  <div><label>Forma</label><select id="pg_forma">${FORMAS_PG.map(f=>`<option>${f}</option>`).join('')}</select></div>
  </div>
  ${tardia?`<div class="row" style="margin-top:6px">
    <button class="mini sec" onclick="$('pg_valor').value='${Math.max(0,Number(db.config.mensApos)-jaPago).toFixed(2)}'">Restante c/ acréscimo (${brl(db.config.mensApos)})</button>
    <button class="mini sec" onclick="$('pg_valor').value='${Math.max(0,Number(c.valor)-jaPago).toFixed(2)}'">Restante valor base (${brl(c.valor)})</button>
  </div>`:''}
  <div class="row" style="margin-top:8px"><input type="checkbox" id="pg_quita" style="width:auto"><span>Dar por <strong>quitada</strong> com este pagamento (ex.: desconto negociado)</span></div>
  <p class="mut" style="margin-top:6px">💡 Pagou só uma parte? Registre o valor recebido — a cobrança fica <strong>parcial</strong> e o resto você lança depois, em outra data.<br>📅 Registrando um pagamento antigo? Use a <strong>data real</strong>: se foi dentro do prazo, vale o valor base, <strong>sem acréscimo</strong>.</p>`:''}
  <div class="row" style="margin-top:14px">
  ${c.status!=='pago'?`<button style="background:var(--ok)" onclick="pagouGo('${id}')">Confirmar pagamento</button>`:''}
  ${c.status==='pago'?`<button class="warn" onclick="desfazPagamento('${id}')">↩ Desfazer pagamento</button>`:''}
  <button class="sec" onclick="fecha()">Fechar</button></div>`);
}
async function pagouGo(id){
  const c=byId(db.cobrancas,id);
  const valor=Number(fval('pg_valor'))||0, data=fval('pg_data')||hoje(), forma=fval('pg_forma')||'';
  const quitaChk=$('pg_quita')&&$('pg_quita').checked;
  const jaTinha=pagoParcial(c);
  if(valor<=0&&!quitaChk&&jaTinha<=0){toast('Informe o valor recebido');return;}
  const pags=valor>0?[...(c.pagamentos||[]),{data,valor,forma,quem:me.nome}]:[...(c.pagamentos||[])];
  const totalPago=pags.reduce((s,p)=>s+Number(p.valor||0),0);
  // Pagamento com data dentro do prazo: vale o valor base, sem acréscimo de atraso
  const dataRef=pags.length?pags[pags.length-1].data:data;
  const dentroPrazo=String(dataRef)<=String(c.venc);
  const devido=(ehMensal(c)&&c.status==='atrasado'&&dentroPrazo)?Number(c.valor):Number(valorDe(c));
  const quita=quitaChk||(totalPago>0&&totalPago>=devido-0.005);
  let dados=quita
    ?{status:'pago',pago_em:dataRef,valor:totalPago>0?totalPago:Number(c.valor),forma_pagamento:pags.length>1?pags.map(p=>p.forma||'—').join(' + '):(pags.length?pags[pags.length-1].forma:forma),pagamentos:pags}
    :{pagamentos:pags};
  let {error}=await sb.from('cobrancas').update(dados).eq('id',id);
  if(error&&/pagamentos|forma_pagamento/.test(error.message||'')){
    if(!quita){toast('⚠️ Rode o SQL v12 no Supabase para ativar pagamentos parciais');return;}
    delete dados.pagamentos; delete dados.forma_pagamento;
    const {error:e2}=await sb.from('cobrancas').update(dados).eq('id',id);
    if(e2){toast('⚠️ '+e2.message);return;}
    toast('⚠️ Pago salvo sem o detalhe da forma — rode o SQL v12 no Supabase');
  } else if(error){toast('⚠️ '+error.message);return;}
  log('financeiro',`Pagamento ${quita?'registrado':'PARCIAL'}: ${nomeCob(c)} — ${c.desc} (${brl(valor)} em ${dbr(data)}${forma?' via '+forma:''})`);
  fecha(); await recarrega();
  toast(quita?(dentroPrazo&&ehMensal(c)&&c.status==='atrasado'?'Pagamento registrado 💰 — em dia pela data, sem acréscimo':'Pagamento registrado 💰'):'Parcial registrado — restante '+brl(Math.max(0,devido-totalPago)));
}
async function removePagamento(id,idx){
  const c=byId(db.cobrancas,id); const pags=[...(c.pagamentos||[])]; const rem=pags.splice(idx,1)[0];
  await q(sb.from('cobrancas').update({pagamentos:pags,...(c.status==='pago'?{status:'pendente',pago_em:null}:{})}).eq('id',id));
  log('financeiro',`Pagamento parcial removido: ${nomeCob(c)} — ${brl(rem?rem.valor:0)}`);
  await recarrega(); fecha(); formPagamento(id);
}
function desfazPagamento(id){
  const c=byId(db.cobrancas,id);
  confirma(`Desfazer o pagamento de <strong>${esc(nomeCob(c))} — ${esc(c.desc)}</strong>? A cobrança volta a ficar em aberto e os lançamentos parciais são apagados.`,async()=>{
    let {error}=await sb.from('cobrancas').update({status:'pendente',pago_em:null,pagamentos:[],forma_pagamento:''}).eq('id',id);
    if(error) await q(sb.from('cobrancas').update({status:'pendente',pago_em:null}).eq('id',id));
    log('financeiro',`Pagamento desfeito: ${nomeCob(c)} — ${c.desc}`);
    await recarrega(); toast('Pagamento desfeito');
  });
}
function editPagamento(id){ formPagamento(id); }
function pdfExtratoAtleta(atId){
  const a=at(atId); if(!a){toast('Atleta não encontrado');return;}
  const cs=db.cobrancas.filter(c=>c.atletaId===atId).sort((x,y)=>x.venc.localeCompare(y.venc));
  if(!cs.length){toast('Nenhuma cobrança lançada para '+pnome(a.nome));return;}
  const pagas=cs.filter(c=>c.status==='pago'), abertas=cs.filter(c=>c.status!=='pago');
  const totPago=pagas.reduce((s,c)=>s+Number(c.valor),0)+abertas.reduce((s,c)=>s+pagoParcial(c),0);
  const totAberto=abertas.reduce((s,c)=>s+restanteDe(c),0);
  const comoPagou=c=>{
    if(c.pagamentos&&c.pagamentos.length) return c.pagamentos.map(p=>`${dbr(p.data)} — ${brl(p.valor)}${p.forma?' ('+esc(p.forma)+')':''}`).join('<br>');
    return `${c.pagoEm?dbr(c.pagoEm):'—'} — ${brl(c.valor)}${c.forma?' ('+esc(c.forma)+')':''}`;
  };
  abreRelatorio(`<h1>🧾 Extrato Financeiro do Atleta</h1>
  <p class="sub">${esc(a.nome)}${a.oab?' · OAB '+esc(a.oab):''} — ${esc(db.config.time)}</p>
  <div class="cards">
    <div class="card"><div class="n">${cs.length}</div><div class="l">Cobranças</div></div>
    <div class="card"><div class="n ok">${brl(totPago)}</div><div class="l">Total pago</div></div>
    <div class="card"><div class="n ${totAberto?'bad':'ok'}">${brl(totAberto)}</div><div class="l">Em aberto</div></div>
    <div class="card"><div class="n ${totAberto?'warn':'ok'}">${totAberto?'Devendo':'Em dia ✔'}</div><div class="l">Situação</div></div>
  </div>
  ${pagas.length||abertas.some(c=>pagoParcial(c)>0)?`<h2>✔ Pagamentos realizados</h2>
  <table><tr><th>Cobrança</th><th>Vencimento</th><th>Como foi pago</th><th>Total pago</th></tr>
  ${pagas.map(c=>`<tr><td>${esc(c.desc)}</td><td>${dbr(c.venc)}</td><td>${comoPagou(c)}</td><td class="ok">${brl(c.valor)}</td></tr>`).join('')}
  ${abertas.filter(c=>pagoParcial(c)>0).map(c=>`<tr><td>${esc(c.desc)} <span class="warn">(parcial)</span></td><td>${dbr(c.venc)}</td><td>${comoPagou(c)}</td><td class="warn">${brl(pagoParcial(c))} de ${brl(valorDe(c))}</td></tr>`).join('')}
  </table>`:''}
  ${abertas.length?`<h2>⏳ Em aberto</h2>
  <table><tr><th>Cobrança</th><th>Vencimento</th><th>Situação</th><th>Valor restante</th></tr>
  ${abertas.map(c=>`<tr><td>${esc(c.desc)}</td><td>${dbr(c.venc)}</td><td>${c.status==='atrasado'?'<span class="bad">Em atraso</span>':'Pendente'}${pagoParcial(c)>0?` · <span class="warn">parcial: ${brl(pagoParcial(c))} já pago</span>`:''}</td><td class="bad">${brl(restanteDe(c))}</td></tr>`).join('')}
  </table>`:'<p class="ok" style="font-weight:bold">Nenhuma pendência — atleta em dia. 👏</p>'}
  <div style="margin-top:56px;display:flex;gap:40px;text-align:center">
    <div style="flex:1;border-top:1px solid #333;padding-top:6px">Diretoria — ${esc(db.config.time)}</div>
    <div style="flex:1;border-top:1px solid #333;padding-top:6px">${esc(a.nome)}</div>
  </div>`,`Extrato — ${pnome(a.nome)}`);
}
function quitacaoLote(aidPre){
  const devs=elenco().map(a=>({a,cs:db.cobrancas.filter(c=>c.atletaId===a.id&&c.status!=='pago')})).filter(x=>x.cs.length);
  if(!devs.length){toast('Ninguém com cobranças em aberto! 🎉');return;}
  modal(`<h2>💳 Quitação em lote</h2>
  <p class="mut">Marque as cobranças, aplique desconto (%, R$ ou ajustando cada valor) e confirme tudo de uma vez.</p>
  <label>Jogador</label><select id="ql_atleta" onchange="qlRender()">
  <option value="__todos__" ${!aidPre?'selected':''}>🌐 Todos os jogadores — ${devs.reduce((s,x)=>s+x.cs.length,0)} cobranças em aberto</option>
  ${devs.map(x=>`<option value="${x.a.id}" ${x.a.id===aidPre?'selected':''}>${esc(x.a.nome)} — ${x.cs.length} em aberto</option>`).join('')}</select>
  <div id="ql_body"></div>`);
  qlRender();
}
function qlLinhas(){ return [...document.querySelectorAll('.ql_row')].map(r=>({chk:r.querySelector('.ql_chk'),val:r.querySelector('.ql_val'),id:r.dataset.id})); }
function qlBase(id){ const c=byId(db.cobrancas,id); return Number(($('ql_semmulta')&&$('ql_semmulta').checked)?c.valor:valorDe(c)); }
function qlAplicaBase(){ const p=Number(fval('ql_pct'))||0;
  qlLinhas().forEach(l=>{ l.val.value=(Math.round(qlBase(l.id)*(1-p/100)*100)/100).toFixed(2); }); qlTotal(); }
function qlTotal(){ const d=Number(fval('ql_desc'))||0;
  const soma=qlLinhas().filter(l=>l.chk.checked).reduce((s,l)=>s+(Number(l.val.value)||0),0);
  if($('ql_tot'))$('ql_tot').textContent=brl(Math.max(0,soma-d)); }
function qlRender(){
  const aid=fval('ql_atleta');
  const cs=db.cobrancas.filter(c=>(aid==='__todos__'||c.atletaId===aid)&&c.status!=='pago')
    .sort((a,b)=>nomeAt(a.atletaId).localeCompare(nomeAt(b.atletaId))||a.venc.localeCompare(b.venc));
  $('ql_body').innerHTML=`
  <div style="margin-top:10px;max-height:240px;overflow-y:auto;border:1px solid var(--bg-alt);border-radius:6px;padding:8px">${cs.map(c=>`<div class="row ql_row" data-id="${c.id}" style="margin-bottom:6px">
    <input type="checkbox" class="ql_chk" checked style="width:auto">
    <span style="flex:1;min-width:140px">${aid==='__todos__'?'<strong>'+esc(pnome(nomeAt(c.atletaId)))+'</strong> · ':''}${esc(c.desc)} <span class="mut">venc. ${dbr(c.venc)}${ehMensal(c)&&c.status==='atrasado'?' · com acréscimo: '+brl(valorDe(c)):''}</span></span>
    <input class="ql_val" type="number" step="0.01" value="${Number(valorDe(c)).toFixed(2)}" style="max-width:110px;font-variant-numeric:tabular-nums">
  </div>`).join('')}</div>
  <div class="row" style="margin-top:12px"><input type="checkbox" id="ql_semmulta" style="width:auto"><span>Perdoar o acréscimo (usar valor base nas atrasadas)</span></div>
  <div class="grid g3" style="margin-top:10px">
  <div><label>Desconto (%)</label><input id="ql_pct" type="number" min="0" max="100" value="0" placeholder="Ex.: 10"></div>
  <div><label>Desconto extra (R$)</label><input id="ql_desc" type="number" step="0.01" value="0"></div>
  <div><label>Data do pagamento</label><input id="ql_data" type="date" value="${hoje()}"></div>
  </div>
  <p class="mut" style="margin-top:8px;margin-bottom:8px">💡 O % e o "perdoar acréscimo" recalculam os valores acima — e você ainda pode ajustar qualquer valor à mão.</p>
  <p style="font-size:17px;margin-bottom:12px;border-top:1px solid var(--bg-alt);padding-top:8px">Total a receber: <strong id="ql_tot" style="color:var(--ok)"></strong></p>
  <div class="row" style="gap:8px"><button style="background:var(--ok);flex:1" onclick="qlGo()">✓ Confirmar quitação</button><button class="sec" style="flex:1" onclick="fecha()">Cancelar</button></div>`;
  qlLinhas().forEach(l=>{ l.chk.onchange=qlTotal; l.val.oninput=qlTotal; });
  $('ql_semmulta').onchange=qlAplicaBase; $('ql_pct').oninput=qlAplicaBase; $('ql_desc').oninput=qlTotal;
  qlTotal();
}
async function qlGo(){
  const sel=qlLinhas().filter(l=>l.chk.checked);
  if(!sel.length){toast('Selecione ao menos uma cobrança');return;}
  const d=Number(fval('ql_desc'))||0, data=fval('ql_data')||hoje();

async function gerarRetroGo(){
  const de=fval('gr_de'), ate=fval('gr_ate'), quem=fval('gr_quem');
  if(!de||!ate||de>ate){toast('Período inválido');return;}
  const alvos=quem==='__todos__'?elenco().filter(a=>!a.isentoMens):elenco().filter(a=>a.id===quem);
  if(!alvos.length){toast('Jogador não encontrado');return;}
  if(quem!=='__todos__'&&alvos[0].isentoMens&&!confirm(`${alvos[0].nome} é isento de mensalidade. Gerar mesmo assim?`))return;
  const rows=[]; let [y,m]=de.split('-').map(Number); const [ya,ma]=ate.split('-').map(Number); let seg=0;
  while((y<ya||(y===ya&&m<=ma))&&seg<24){
    const mm=String(m).padStart(2,'0'), descr=`Mensalidade ${mm}/${y}`;
    const venc=`${y}-${mm}-${String(db.config.mensDia).padStart(2,'0')}`;

    m++; if(m>12){m=1;y++;} seg++;
  }
  if(!rows.length){fecha();toast('Nada a gerar — essas mensalidades já existem');return;}
  await q(sb.from('cobrancas').insert(rows));
  log('financeiro',`Mensalidades retroativas geradas: ${rows.length} cobranças (${de} a ${ate})${quem!=='__todos__'?' — só '+alvos[0].nome:''}`);
  fecha(); await recarrega(); toast(rows.length+' cobranças geradas 🧾');
}

/* ---- Importação de planilhas do time ---- */
const MES_N={JAN:1,FEV:2,MAR:3,ABR:4,MAI:5,JUN:6,JUL:7,AGO:8,SET:9,OUT:10,NOV:11,DEZ:12};
const MES_LBL=['','JAN','FEV','MAR','ABR','MAI','JUN','JUL','AGO','SET','OUT','NOV','DEZ'];
function normNome(n){ return String(n||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase().replace(/\b(DR|DRA|PROF|PROFA)\.?\s+/g,'').replace(/\s+/g,' ').trim(); }
function achaAtleta(nome){
  const alvo=normNome(nome); if(!alvo)return null;
  let m=membros().find(a=>normNome(a.nome)===alvo); if(m)return m;
  m=membros().find(a=>{const na=normNome(a.nome);return na.includes(alvo)||alvo.includes(na);}); if(m)return m;
  const t=alvo.split(' ');
  return membros().find(a=>{const na=normNome(a.nome).split(' ');return t.length>1&&na.length>1&&t[0]===na[0]&&t[t.length-1]===na[na.length-1];})||null;
}
let impPlano=null;
const DESP_RE=/(aluguel|agua|água|goleiro|passagem|hospedagem|compra|lavagem|publicidade|repasse|supermercado|assador|churrasqueira|pegador|bagagem|arbitr|taxa|inscri|material|equipamento)/i;
const REC_RE=/(patroc|aux[ií]lio|cr[eé]dito|doa[cç]|churrasco)/i;
function catDespesa(nome){
  const n=String(nome).toLowerCase();
  if(/campo/.test(n))return 'Campo/Aluguel';
  if(/passagem|hospedagem|bagagem/.test(n))return 'Transporte';
  if(/supermercado|churrasqueira|assador|água|agua/.test(n))return 'Confraternização';
  if(/lavagem|uniforme/.test(n))return 'Uniformes';
  if(/goleiro|arbitr/.test(n))return 'Arbitragem';
  if(/material|bola|v[aá]lvula|pegador|colete|equipamento/.test(n))return 'Material esportivo';
  if(/inscri/.test(n))return 'Inscrições';
  return 'Outros';
}
async function calcularHashPlanilha(arquivo,dados){
  // Calcula hash do arquivo baseado em nome + primeiro/últimos registros
  const primeirosDados=JSON.stringify(dados.slice(0,3));
  const ultimosDados=JSON.stringify(dados.slice(-3));
  const txt=arquivo.name+primeirosDados+ultimosDados;
  const encoder=new TextEncoder();
  const buffer=await crypto.subtle.digest('SHA-256',encoder.encode(txt));
  return Array.from(new Uint8Array(buffer)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

  const loteAnterior=db.lotes.find(l=>l.hash===hash&&l.status==='ativo');
  if(loteAnterior){
    return {encontrado:true,lote:loteAnterior};
  }
  return {encontrado:false};
}

  <p class="mut">Lê tudo de uma vez, nos formatos que o time já usa:<br>
  • <strong>Grade anual</strong> (LISTAGEM: nomes × meses com "PG"/valor) → mensalidades;<br>
  • <strong>Abas mensais</strong> (ex.: "Jul 26") → mensalidades, <strong>avulsos e convidados, patrocínios/receitas e despesas</strong> (aluguel de campo, água, goleiro, passagens...).</p>
  <label>Ano (usado quando a planilha não indica)</label><input id="imp_ano" type="number" value="${new Date().getFullYear()}">

async function lerPlanilha(){
  const f=$('imp_file').files[0]; if(!f){toast('Escolha o arquivo');return;}
  toast('Lendo a planilha…');
  try{
    await carregaXLSX();
    const wb=XLSX.read(await f.arrayBuffer());
    const acoes=[]; const naoAchados=new Set(); const anoPad=fval('imp_ano')||String(new Date().getFullYear());
    const numDe=v=>{ const n=Number(String(v).replace(/[R$\s.]/g,m=>m==='.'?'.':'').replace(',','.')); return isNaN(n)?0:n; };
    const dataDe=(txt,ano,mes)=>{ const m=String(txt||'').match(/(\d{1,2})\/(\d{1,2})\/(\d{2,4})/);
      if(m){ const yy=m[3].length===2?'20'+m[3]:m[3]; return `${yy}-${String(m[2]).padStart(2,'0')}-${String(m[1]).padStart(2,'0')}`; }
      return `${ano}-${String(mes).padStart(2,'0')}-${String(db.config.mensDia).padStart(2,'0')}`; };
    for(const sn of wb.SheetNames){
      const rows=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,defval:''});
      const hi=rows.findIndex(r=>r.some(c=>normNome(c)==='NOME'));
      if(hi>=0){ // grade anual
        const header=rows[hi]; const nomeCol=header.findIndex(c=>normNome(c)==='NOME');
        const ano=(sn.match(/(20\d\d)/)||[])[1]||anoPad;
        const cols=header.map((c,i)=>({i,mes:MES_N[String(c).normalize('NFD').replace(/[^A-Za-z]/g,'').toUpperCase().slice(0,3)]})).filter(x=>x.mes&&x.i>nomeCol);
        for(const r of rows.slice(hi+1)){
          const nome=r[nomeCol]; if(!String(nome).trim())continue;
          const a=achaAtleta(nome); if(!a){naoAchados.add(String(nome).trim());continue;}
          for(const col of cols){
            const cel=String(r[col.i]).trim(); if(!cel||/FALTA/i.test(cel))continue;
            const num=numDe(cel);
            if(/^(PG|OK)\.?$/i.test(cel)) acoes.push({t:'mens',aid:a.id,nome:a.nome,mes:col.mes,ano,valor:db.config.mensValor,pago:dataDe('',ano,col.mes)});
            else if(num>0) acoes.push({t:'mens',aid:a.id,nome:a.nome,mes:col.mes,ano,valor:num,pago:dataDe('',ano,col.mes)});
          }
        }
        continue;
      }
      const mMes=sn.trim().match(/^(jan|fev|mar|abr|mai|jun|jul|ago|set|out|nov|dez)\w*\.?\s*(\d{2,4})$/i);
      if(mMes){ // aba mensal
        const mes=MES_N[mMes[1].toUpperCase().slice(0,3)]; const ano=mMes[2].length===2?'20'+mMes[2]:mMes[2];
        const mm=String(mes).padStart(2,'0');
        for(const r of rows){
          const numerado=Number(r[0])>0;
          const nome=String(r[1]||'').trim(), val=String(r[2]).trim(), obs=r[3];
          if(!nome||normNome(nome)==='ATLETAS'||/TOTAL|CAIXA EM/i.test(nome))continue;
          const num=numDe(val);
          const data=dataDe(obs,ano,mes);
          if(numerado){ // mensalista da lista
            const a=achaAtleta(nome); if(!a){naoAchados.add(nome);continue;}
            if(/^(OK|PG)\.?$/i.test(val)) acoes.push({t:'mens',aid:a.id,nome:a.nome,mes,ano,valor:db.config.mensValor,pago:data});
            else if(num>0) acoes.push({t:'mens',aid:a.id,nome:a.nome,mes,ano,valor:num,pago:data});
            continue;
          }
          if(num<=0)continue;
          if(DESP_RE.test(nome)&&!REC_RE.test(nome)){ // despesa
            acoes.push({t:'desp',item:nome,categoria:catDespesa(nome),valor:num,data,obs:String(obs||'')});
            continue;
          }
          const a=achaAtleta(nome);
          if(a) acoes.push({t:'rec',aid:a.id,nomeRec:a.nome,desc:`Avulso ${mm}/${ano}`,valor:num,data});
          else if(REC_RE.test(nome)) acoes.push({t:'rec',convidado:nome,desc:nome,mesRef:`${mm}/${ano}`,valor:num,data});
          else acoes.push({t:'rec',convidado:nome,desc:`Treino avulso ${mm}/${ano}`,valor:num,data});
        }
      }
    }
    // separa e remove duplicados
    const mapa={}; acoes.filter(x=>x.t==='mens').forEach(x=>{mapa[x.aid+'|'+x.ano+'-'+x.mes]=x;});
    const mens=Object.values(mapa);
    const recs=acoes.filter(x=>x.t==='rec').filter(x=>!db.cobrancas.some(c=>
      (x.aid?c.atletaId===x.aid:normNome(c.convidado)===normNome(x.convidado))&&c.desc===x.desc&&Number(c.valor)===Number(x.valor)&&String(c.venc).slice(0,7)===String(x.data).slice(0,7)));
    const desps=acoes.filter(x=>x.t==='desp').filter(x=>!db.despesas.some(d=>
      normNome(d.item)===normNome(x.item)&&Number(d.valor)===Number(x.valor)&&String(d.data).slice(0,7)===String(x.data).slice(0,7)));
    let criar=0,atualizar=0,jaPagos=0;
    mens.forEach(x=>{ const descr=`Mensalidade ${String(x.mes).padStart(2,'0')}/${x.ano}`;
      const ex=db.cobrancas.find(c=>c.atletaId===x.aid&&c.desc===descr);
      if(!ex)criar++; else if(ex.status==='pago')jaPagos++; else atualizar++; });
    impPlano={mens,recs,desps,arquivo:f.name};
    const totRec=recs.reduce((s,x)=>s+x.valor,0), totDesp=desps.reduce((s,x)=>s+x.valor,0);
    $('imp_prev').innerHTML=`
    <div class="alertline al-ok" style="margin-top:14px">💰 <strong>${mens.length} mensalidades:</strong> ${atualizar} serão baixadas, ${criar} criadas já pagas, ${jaPagos} já estavam pagas (puladas).</div>
    <div class="alertline al-ok">🎟️ <strong>${recs.length} receitas avulsas</strong> (convidados, patrocínios, contribuições): ${brl(totRec)}.</div>
    <div class="alertline al-ok">🧾 <strong>${desps.length} despesas</strong> (campo, água, transporte...): ${brl(totDesp)}.</div>
    ${naoAchados.size?`<div class="alertline al-warn">⚠️ Mensalistas sem cadastro no sistema (pulados): ${[...naoAchados].map(esc).join(', ')}</div>`:''}
    ${(mens.length+recs.length+desps.length)?`<button style="background:var(--ok)" onclick="aplicarImport()">✔ Aplicar tudo no sistema</button>`:'<p class="mut">Nada novo para importar.</p>'}`;
  }catch(e){ toast('⚠️ '+e.message); }
}

async function exportModelo(){
  toast('Gerando a planilha modelo…');
  try{
    await carregaXLSX();
    const ano=String(new Date().getFullYear());
    const wb=XLSX.book_new?XLSX.book_new():XLSX.utils.book_new();
    // Aba 1: LISTAGEM (grade nomes × meses)
    const grade=[[],['','',db.config.time.toUpperCase()],['','',`PIX PAGAMENTO: ${db.config.pix||'—'}`],
      ['ATUALIZADA: '+new Date().toLocaleDateString('pt-BR'),'','','',`VALOR DA MENSALIDADE: ${brl(db.config.mensValor)} (até dia ${db.config.mensDia}; após: ${brl(db.config.mensApos)})`],
      ['QTD.','NOME',...MES_LBL.slice(1)]];
    const els=[...elenco()].sort((a,b)=>a.nome.localeCompare(b.nome));
    els.forEach((a,i)=>{
      const linha=[i+1,normNome(a.nome)];
      for(let m=1;m<=12;m++){
        const descr=`Mensalidade ${String(m).padStart(2,'0')}/${ano}`;
        const c=db.cobrancas.find(x=>x.atletaId===a.id&&x.desc===descr);
        if(!c)linha.push('');
        else if(c.status==='pago')linha.push(Number(c.valor)===Number(db.config.mensValor)?'PG':Number(c.valor));
        else if(c.status==='atrasado')linha.push('Falta '+Number(valorDe(c)));
        else linha.push('');
      }
      grade.push(linha);
    });
    XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(grade),'LISTAGEM '+ano);
    // Abas mensais de arrecadação (meses com pagamento)
    const MABA=['','Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
    for(let m=1;m<=12;m++){
      const pagos=db.cobrancas.filter(c=>c.status==='pago'&&c.pagoEm&&String(c.pagoEm).slice(0,7)===`${ano}-${String(m).padStart(2,'0')}`);
      if(!pagos.length)continue;
      const aoa=[['','Atletas','','']];
      pagos.sort((a,b)=>nomeCob(a).localeCompare(nomeCob(b))).forEach((c,i)=>{
        aoa.push([i+1,nomeCob(c).replace('🎟️ ',''),Number(c.valor),`em ${dbr(c.pagoEm)}${ehMensal(c)?'':' — '+c.desc}`]); });
      aoa.push(['','Total',pagos.reduce((s,c)=>s+Number(c.valor),0),'']);
      XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(aoa),`${MABA[m]} ${ano.slice(2)}`);
    }
    // Aba Orçamento anual
    const mesSoma=(filtro)=>{ const arr=[]; let tot=0;
      for(let m=1;m<=12;m++){ const v=db.cobrancas.filter(c=>c.status==='pago'&&c.pagoEm&&String(c.pagoEm).slice(0,7)===`${ano}-${String(m).padStart(2,'0')}`&&filtro(c)).reduce((s,c)=>s+Number(c.valor),0); arr.push(v||''); tot+=v; }
      return [...arr,tot||'']; };
    const despMes=(filtro)=>{ const arr=[]; let tot=0;
      for(let m=1;m<=12;m++){ const v=db.despesas.filter(d=>String(d.data).slice(0,7)===`${ano}-${String(m).padStart(2,'0')}`&&filtro(d)).reduce((s,d)=>s+Number(d.valor),0); arr.push(v||''); tot+=v; }
      return [...arr,tot||'']; };
    const orc=[['ORÇAMENTO ANUAL '+ano],[],['RENDA'],['Item',...MABA.slice(1),'Total'],
      ['Mensalidades',...mesSoma(c=>ehMensal(c))],
      ['Avulsos',...mesSoma(c=>!ehMensal(c))],
      ['Patrocínio (contratos ativos)','','','','','','','','','','','','',(db.pats||[]).filter(p=>p.ativo).reduce((s,p)=>s+Number(p.valor||0),0)||''],
      [],['DESPESAS'],['Categoria',...MABA.slice(1),'Total']];
    CATS_DESP.forEach(cat=>{ const linha=despMes(d=>d.categoria===cat); if(linha[12]!=='')orc.push([cat,...linha]); });
    orc.push(['Total de despesas',...despMes(()=>true)]);
    const rec=db.cobrancas.filter(c=>c.status==='pago').reduce((s,c)=>s+Number(c.valor),0);
    orc.push([],['SALDO INICIAL'+(db.config.saldoIniObs?' ('+db.config.saldoIniObs+')':''),'','','','','','','','','','','','',db.config.saldoIni||''],
      ['SALDO EM CAIXA','','','','','','','','','','','','',db.config.saldoIni+rec-totDespesas()]);
    XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(orc),'Orçamento '+ano);
    XLSX.writeFile(wb,'planilha-oab-master-'+hoje()+'.xlsx');
    toast('Planilha modelo baixada ✔');
  }catch(e){ toast('⚠️ '+e.message); }
}

async function salvaUni(){
  const d=fval('u_desc'); if(!d){toast('Descreva o uniforme');return;}
  const nums=new Set();
  for(const tok of fval('u_nums').split(/[,;]/).map(s=>s.trim()).filter(Boolean)){
    const mr=tok.match(/^(\d+)\s*[-–a]\s*(\d+)$/);
    if(mr){ const a=+mr[1], b=+mr[2]; if(b<a){toast(`Intervalo inválido: "${tok}"`);return;}
      for(let n=a;n<=b;n++)nums.add(n); }
    else if(/^\d+$/.test(tok)) nums.add(+tok);
    else { toast(`Não entendi "${tok}" — use números e intervalos (ex.: 1-10, 25)`); return; }
  }
  if(!nums.size){toast('Informe a numeração (ex.: 1-10, 15-20, 25)');return;}
  if(nums.size>60){toast('Máximo de 60 números por lote');return;}
  const jaExistem=[...nums].filter(n=>db.uniformes.some(u=>u.descricao===d&&u.numero===String(n)));
  if(jaExistem.length){toast(`Os números ${jaExistem.join(', ')} já existem em "${d}" — remova-os da lista`);return;}
  const pcs=[...document.querySelectorAll('.chk_peca:checked')].map(c=>c.value);
  if(!pcs.length){toast('Marque ao menos uma peça');return;}
  const pecas={}; pcs.forEach(k=>pecas[k]='estoque');
  const gkSet=new Set(fval('u_gk').split(/[,;]/).map(s=>parseInt(s.trim())).filter(n=>!isNaN(n)));
  const ordenados=[...nums].sort((a,b)=>a-b);
  const rows=ordenados.map(n=>({descricao:d,numero:String(n),tamanho:'',pecas,fornecedor:fval('u_forn'),
    goleiro:gkSet.has(n),cor:gkSet.has(n)?(fval('u_gkcor')||fval('u_cor')):fval('u_cor')}));
  await q(sb.from('uniformes').insert(rows));
  log('uniforme',`Lote cadastrado: ${d}, números ${fval('u_nums')} (${pcs.map(k=>PECAS_LBL[k]).join(', ')})`);
  fecha(); await recarrega(); toast(`${rows.length} uniforme(s) cadastrado(s)`);
}

    const pecas={...u.pecas}; pcs.forEach(k=>pecas[k]='atleta');

  }
  const aid=$('eu_quem')?fval('eu_quem'):u.atletaId;
  const a=at(aid);
  const pecas={...u.pecas}; pcs.forEach(k=>pecas[k]='pendente');
  await q(sb.from('uniformes').update({status:'pendente',atleta_id:aid,convidado:'',entregue_em:agora(),pecas}).eq('id',id));
  log('uniforme',`Uniforme nº ${u.numero}: ${pcs.map(k=>PECAS_LBL[k]).join(', ')} entregue(s) a ${a.nome} — aguardando aceite`);

function relacaoMateriais(){
  // agrupa TUDO por pessoa: uniformes + materiais emprestados
  const pessoas={};
  const pega=k=>(pessoas[k]??={unis:[],emps:[]});
  db.uniformes.filter(u=>u.atletaId||u.convidado).forEach(u=>{
    pega(u.atletaId?nomeAt(u.atletaId):('🎟️ '+u.convidado)).unis.push(u);
  });
  db.inventario.forEach(i=>(i.emprestimos||[]).forEach(e=>{
    const cad=membros().find(a=>normNome(pnome(a.nome))===normNome(e.nome)||normNome(a.nome)===normNome(e.nome));
    pega(cad?cad.nome:('🎟️ '+e.nome)).emps.push({item:i.nome,...e});
  }));
  const linhas=[];
  if(Object.keys(pessoas).length){
    linhas.push('*📋 Pendências de devolução, por atleta:*','');
    Object.entries(pessoas).sort((a,b)=>a[0].localeCompare(b[0])).forEach(([nome,p])=>{
      linhas.push(`*${nome}:*`);
      p.unis.forEach(u=>{
        const pcs=Object.entries(u.pecas||{}).filter(([,v])=>v==='atleta'||v==='pendente').map(([k])=>PECAS_LBL[k].toLowerCase()).join(', ');
        const falt=Object.entries(u.pecas||{}).filter(([,v])=>v==='faltando').map(([k])=>PECAS_LBL[k].toLowerCase()).join(', ');
        linhas.push(`   👕 ${u.descricao} nº ${u.numero}${u.goleiro?' 🧤':''} — ${pcs||'—'}${u.status==='pendente'?' ⚠️ termo pendente':''}${falt?' · FALTANDO: '+falt:''}`);
      });
      p.emps.forEach(e=>linhas.push(`   📦 ${e.qtd}× ${e.item} (desde ${e.quando})`));
      linhas.push('');
    });
  }
  const faltEstoque=db.uniformes.filter(u=>!u.atletaId&&!u.convidado&&Object.values(u.pecas||{}).some(v=>v==='faltando'));
  if(faltEstoque.length){
    linhas.push('*⚠️ Peças extraviadas (sem responsável):*');
    faltEstoque.forEach(u=>{ const falt=Object.entries(u.pecas||{}).filter(([,v])=>v==='faltando').map(([k])=>PECAS_LBL[k].toLowerCase()).join(', ');
      linhas.push(`• ${u.descricao} nº ${u.numero} — ${falt}`); });
  }
  if(!linhas.length){toast('Nada com ninguém: uniformes e materiais todos no estoque! 🎉');return;}
  const msg=`👕 *${db.config.time} — Relação de uniformes e materiais*\n📅 ${new Date().toLocaleDateString('pt-BR')}\n\n${linhas.join('\n').replace(/\n{3,}/g,'\n\n')}\n_Pedimos a devolução após os jogos e viagens. Qualquer divergência, falar com a diretoria._ 🤝⚖️`;
  modalWhats('Relação de uniformes e materiais',msg);
  log('uniforme','Relação de uniformes/materiais gerada para o WhatsApp');
}

async function limparTodosOsLancamentos(){
  const msg=`⚠️ ATENÇÃO! Você vai deletar TODOS os lançamentos:\n\n• ${db.despesas.length} despesas\n• ${db.balanco.length} receitas\n\nEsta ação NÃO PODE SER DESFEITA!\n\nTem certeza?`;
  if(!confirm(msg)){return;}
  if(!confirm('Tem CERTEZA mesmo? Digite "sim" se quer continuar.')){return;}

  toast('Limpando lançamentos…');
  try{
    // Deletar todas as despesas
    if(db.despesas.length>0){
      const ids=db.despesas.map(d=>d.id);
      await q(sb.from('despesas').delete().in('id',ids));
    }
    // Deletar todas as receitas
    if(db.balanco.length>0){
      const ids=db.balanco.map(r=>r.id);
      await q(sb.from('balanco_receitas').delete().in('id',ids));
    }
    log('financeiro','LIMPEZA TOTAL: todos os lançamentos deletados');
    await recarrega();
    toast('✅ Lançamentos limpados com sucesso!');
  }catch(e){
    toast('❌ Erro ao limpar: '+e.message);
    console.error(e);
  }
}

async function pdfParaPng(file){
  if(!window.pdfjsLib){
    await new Promise((res,rej)=>{ const s=document.createElement('script'); s.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js'; s.onload=res; s.onerror=()=>rej(new Error('sem internet para carregar o conversor')); document.head.appendChild(s); });
    pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  }
  const pdf=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise;
  const page=await pdf.getPage(1);
  const vp0=page.getViewport({scale:1});
  const vp=page.getViewport({scale:Math.min(4,1400/Math.max(vp0.width,vp0.height))});
  const c=document.createElement('canvas'); c.width=vp.width; c.height=vp.height;
  const ctx=c.getContext('2d'); ctx.fillStyle='#fff'; ctx.fillRect(0,0,c.width,c.height);
  await page.render({canvasContext:ctx,viewport:vp}).promise;
  const d=ctx.getImageData(0,0,c.width,c.height).data;
  let minX=c.width,minY=c.height,maxX=0,maxY=0;
  for(let y=0;y<c.height;y+=2)for(let xx=0;xx<c.width;xx+=2){ const i=(y*c.width+xx)*4;
    if(d[i]<245||d[i+1]<245||d[i+2]<245){ if(xx<minX)minX=xx; if(xx>maxX)maxX=xx; if(y<minY)minY=y; if(y>maxY)maxY=y; } }
  let alvo=c;
  if(maxX>minX&&maxY>minY){ const pad=10;
    minX=Math.max(0,minX-pad); minY=Math.max(0,minY-pad); maxX=Math.min(c.width,maxX+pad); maxY=Math.min(c.height,maxY+pad);
    alvo=document.createElement('canvas'); alvo.width=maxX-minX; alvo.height=maxY-minY;
    alvo.getContext('2d').drawImage(c,minX,minY,alvo.width,alvo.height,0,0,alvo.width,alvo.height); }
  return await new Promise(r=>alvo.toBlob(r,'image/png'));
}
async function salvaPat(id){
  const nome=fval('p_nome'); if(!nome){toast('Informe o nome');return;}
  const b=$('btn_pat'); b.disabled=true;
  let logo_url=id?(byId(db.pats,id).logo_url||''):'';
  let f=$('p_logo').files[0];
  if(f&&(f.type==='application/pdf'||/\.pdf$/i.test(f.name))){
    toast('Convertendo o PDF em imagem…');
    try{ const blob=await pdfParaPng(f); f=new File([blob],f.name.replace(/\.pdf$/i,'')+'.png',{type:'image/png'}); }
    catch(e){ toast('⚠️ Não consegui converter o PDF: '+e.message); b.disabled=false; return; }
  }
  if(f){ if(f.size>3*1048576){toast('Logo grande demais (máx. 3 MB)');b.disabled=false;return;}
    const path='patrocinadores/'+uid()+'-'+f.name.replace(/[^\w.\-]+/g,'_');
    const {error}=await sb.storage.from('publico').upload(path,f);
    if(error){toast('⚠️ Envio da logo falhou: '+error.message);b.disabled=false;return;}
    logo_url=SB_URL+'/storage/v1/object/public/publico/'+path; }
  const dados={nome,tier:fval('p_tier'),link:fval('p_link'),local:fval('p_local')||'',beneficio:fval('p_ben'),logo_url,ativo:$('p_ativo').checked,ordem:Number(fval('p_ord'))||0,valor:Number(fval('p_valor'))||0,vigencia_ate:fval('p_vig')||null};
  if(id) await q(sb.from('patrocinadores').update(dados).eq('id',id));
  else await q(sb.from('patrocinadores').insert(dados));
  log('patrocinio',`Patrocinador ${id?'atualizado':'cadastrado'}: ${nome}`);
  fecha(); await recarrega(); toast('Patrocinador salvo');
}

async function arteRodapePats(){
  const ordemTier={diamante:0,master:1,ouro:2,prata:3,bronze:4,apoio:5};
  const pats=(db.pats||[]).filter(p=>p.ativo).sort((a,b)=>(ordemTier[a.tier]??9)-(ordemTier[b.tier]??9)||(a.ordem||0)-(b.ordem||0)||a.nome.localeCompare(b.nome));
  if(!pats.length){toast('Cadastre patrocinadores primeiro');return;}
  toast('Gerando arte…');
  const comLogo=pats.filter(p=>p.logo_url);
  const [escImg,...logos]=await Promise.all([carrImg('escudo-t.png'),...comLogo.map(p=>carrImg(p.logo_url,true))]);
  const itens=comLogo.map((p,i)=>({p,img:logos[i]})).filter(x=>x.img);
  const semLogo=pats.filter(p=>!p.logo_url).map(p=>p.nome);
  // Tamanho proporcional à categoria: cada nível um degrau menor
  const escala={diamante:{h:205,cols:2},master:{h:175,cols:3},ouro:{h:145,cols:4},prata:{h:122,cols:5},bronze:{h:105,cols:5},apoio:{h:92,cols:6}};
  const grupos=Object.keys(escala).map(t=>({t,cfg:escala[t],lista:itens.filter(x=>x.p.tier===t)})).filter(g=>g.lista.length);
  const W=1080, topo=130;
  const H=topo+grupos.reduce((s,g)=>s+Math.ceil(g.lista.length/Math.min(g.cfg.cols,g.lista.length))*g.cfg.h,0)+(semLogo.length?46:0)+34;
  const cv=document.createElement('canvas'); cv.width=W; cv.height=H; const x=cv.getContext('2d');
  const g=x.createLinearGradient(0,0,W,0); g.addColorStop(0,'#B8272D'); g.addColorStop(1,'#6E1013'); x.fillStyle=g; x.fillRect(0,0,W,topo);
  x.fillStyle='rgba(255,255,255,.06)'; for(let i=-100;i<W+100;i+=170){x.save();x.translate(i,0);x.rotate(.2);x.fillRect(0,-50,60,topo+120);x.restore();}
  if(escImg){const h2=92,w2=h2*escImg.width/escImg.height;x.drawImage(escImg,26,(topo-h2)/2,w2,h2);}
  x.fillStyle='#F2C11E'; x.font='bold 40px Georgia'; x.textAlign='left'; x.fillText(db.config.time.toUpperCase(),146,56);
  x.fillStyle='#fff'; x.font='bold 31px Helvetica'; x.fillText('QUEM TORNA TUDO POSSÍVEL! 🤝',146,99);
  x.fillStyle='#fff'; x.fillRect(0,topo,W,H-topo);
  const desenhaBanda=(lista,porLinha,lh,y0)=>{
    const lw=(W-80)/porLinha;
    lista.forEach((it,i)=>{ const row=Math.floor(i/porLinha), col=i%porLinha;
      const nRow=Math.min(porLinha,lista.length-row*porLinha);
      const x0=(W-nRow*lw)/2+col*lw;
      const im=it.img, r=Math.min((lw-34)/im.width,(lh-36)/im.height);
      const w2=im.width*r, h2=im.height*r;
      x.drawImage(im,x0+(lw-w2)/2,y0+row*lh+(lh-36-h2)/2+12,w2,h2); });
    return y0+Math.ceil(lista.length/porLinha)*lh; };
  let y=topo;
  grupos.forEach(g=>{ y=desenhaBanda(g.lista,Math.min(g.cfg.cols,g.lista.length),g.cfg.h,y); });
  if(semLogo.length){ x.fillStyle='#5C616E'; x.font='600 24px Helvetica'; x.textAlign='center'; x.fillText(semLogo.join(' · '),W/2,y+30); }
  cv.toBlob(bl=>{ baixar('rodape-patrocinadores-'+hoje()+'.png',bl,'image/png'); toast('🎨 Arte do rodapé gerada — está nos downloads!'); },'image/png');
}

async function salvaRecorrenteDespesa(){

  <div class="mut">${u.status==='com_atleta'?'Sob sua responsabilidade desde '+esc(u.aceitoEm):'Aguardando seu aceite'}</div></div>${u.status==='pendente'?`<button class="mini gold" onclick="aceitarUniforme('${u.id}')">Aceitar termo</button>`:'<span class="pill p-gold">Com você</span>'}</div>`).join(''):'<p class="mut">Nenhum uniforme sob sua guarda.</p>'}

  <p class="mut" style="margin-top:8px">Lembre-se: devolva o uniforme no retorno das viagens.</p></div>
  <div class="card"><h2>🏆 Meus números</h2>
  <div class="tblwrap"><table>
  <tr><td>Jogos com estatísticas</td><td><strong>${st.length}</strong></td></tr>
  <tr><td>⚽ Gols</td><td><strong>${gols}</strong></td></tr>
  <tr><td>🅰️ Assistências</td><td><strong>${asst}</strong></td></tr>
  <tr><td>⭐ Nota média</td><td><strong>${notas.length?(notas.reduce((x,y)=>x+y,0)/notas.length).toFixed(1):'—'}</strong></td></tr>
  </table></div>
  <p class="mut" style="margin-top:8px"><a href="#" onclick="vai('saude');return false">Minha ficha de saúde →</a> · <a href="#" onclick="vai('taticas');return false">Prancheta do treinador →</a></p></div>
  <div class="sect">${cardPats()}</div>
  <div class="sect">${cardDiretoria()}</div>
  <div class="card"><div class="spread"><h2>📁 Meus documentos</h2>
  ${db.arquivos.some(d=>d.atletaId===me.id)?`<button class="mini sec" onclick="baixarZipPessoa('${me.id}')">⬇ Baixar todos (ZIP)</button>`:''}</div>
  <p class="mut">Cada documento tem sua gaveta: toque em <strong>📎 Anexar</strong> no tipo certo (PDF ou foto, máx. 10 MB). Visíveis para você e para a diretoria — é daqui que saem os documentos para as inscrições nos campeonatos.</p>
  ${slotsDocs(me.id,true)}</div>
  </div>`;
}

boot();
</script>
</body>
</html>
