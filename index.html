function editaUniforme(id){
  const u=byId(db.uniformes,id);
  if(!u){toast('Uniforme não encontrado');return;}
  modal(`<h2>✏️ Editar Uniforme</h2>
  <div class="grid g2">
  <div><label>Descrição/Modelo</label><input id="eu_desc" value="${esc(u.descricao)}"></div>
  <div><label>Número</label><input id="eu_num" value="${esc(u.numero)}"></div>
  </div>
  <div class="grid g2">
  <div><label>Fornecedor</label><input id="eu_forn" value="${esc(u.fornecedor||'')}"></div>
  <div><label>Cor</label><input id="eu_cor" value="${esc(u.cor||'')}"></div>
  </div>
  <div class="grid g2">
  <div><label><input type="checkbox" id="eu_goleiro" ${u.goleiro?'checked':''}> 🧤 É goleiro?</label></div>
  <div></div>
  </div>
  <label>Detalhes</label><textarea id="eu_det" rows="2">${esc(u.detalhes||'')}</textarea>
  <div class="row" style="margin-top:14px"><button onclick="salvaEdicaoUniforme('${u.id}')">✓ Salvar</button><button class="gold mini" onclick="adicionaNumerosUniforme('${u.id}')">➕ Adicionar números</button><button class="bad mini" onclick="deletaUniforme('${u.id}')">✕ Deletar</button></div><button class="sec" style="margin-top:8px;width:100%" onclick="fecha()">Cancelar</button>`);
}
async function salvaEdicaoUniforme(id){
  const desc=fval('eu_desc'),num=fval('eu_num'),forn=fval('eu_forn'),cor=fval('eu_cor'),det=fval('eu_det'),goleiro=$('eu_goleiro').checked;
  if(!desc||!num){toast('Preencha descrição e número');return;}
  await q(sb.from('uniformes').update({descricao:desc,numero:num,fornecedor:forn,cor:cor,detalhes:det,goleiro:goleiro}).eq('id',id));
  log('uniformes',`Uniforme editado: ${desc} nº${num}`);
  fecha(); await recarrega(); toast('Uniforme atualizado!');
}
async function deletaUniforme(id){
  if(!confirm('Tem certeza? Esta ação não pode ser desfeita.')){return;}
  await q(sb.from('uniformes').delete().eq('id',id));
  log('uniformes','Uniforme deletado');
  fecha(); await recarrega(); toast('Uniforme removido!');
}
function adicionaNumerosUniforme(id){
  const u=byId(db.uniformes,id);
  modal(`<h2>➕ Adicionar Números — ${esc(u.descricao)}</h2>
  <p class="mut">Formato: números soltos separados por vírgula, ou faixas com hífen. Ex: <strong>1-10,15,33</strong></p>
  <label>Especificação de números</label><input id="an_spec" placeholder="Ex: 1-10,15,20-25,33">
  <div class="row" style="margin-top:14px"><button class="gold" onclick="aplicaNumeros('${id}')">✓ Adicionar</button><button class="sec" onclick="fecha()">Cancelar</button></div>`);
}
async function aplicaNumeros(id){
  const spec=fval('an_spec');
  if(!spec){toast('Digite a especificação de números');return;}
  await q(sb.rpc('adiciona_numeros_uniforme',{p_uniforme_id:id,p_especificacao:spec}));
  log('uniformes',`Números adicionados ao uniforme: ${spec}`);
  fecha(); await recarrega(); toast('Números adicionados!');
}

/* ================= DELETAR LANÇAMENTOS ================= */
async function deletaDespesa(id){
  const desp=byId(db.despesas,id);
  if(!desp){toast('Despesa não encontrada');return;}
  if(!confirm(`Tem certeza que quer deletar?\n\n${desp.item} — ${brl(desp.valor)}`)){return;}
  await q(sb.from('despesas').delete().eq('id',id));
  log('financeiro','Despesa deletada: '+desp.item);
  db.despesas=db.despesas.filter(d=>d.id!==id);
  toast('Despesa removida!');
  tFinBalancoDesp(); // Recarregar apenas a aba
}

async function deletaReceita(id){
  const rec=byId(db.balanco,id);
  if(!rec){toast('Receita não encontrada');return;}
  if(!confirm(`Tem certeza que quer deletar?\n\n${rec.descricao} — ${brl(rec.valor)}`)){return;}
  await q(sb.from('balanco_receitas').delete().eq('id',id));
  log('financeiro','Receita deletada: '+rec.descricao);
  db.balanco=db.balanco.filter(r=>r.id!==id);
  toast('Receita removida!');
  tFinBalancoRec(); // Recarregar apenas a aba
}

async function deletaDespesasLote(ids){
  const despesas=ids.map(id=>byId(db.despesas,id)).filter(Boolean);
  if(!despesas.length){toast('Nenhuma despesa selecionada');return;}
  const msg=`Deletar ${despesas.length} despesa(s)?\n\nTotal: ${brl(despesas.reduce((s,d)=>s+Number(d.valor),0))}\n\nTem certeza?`;
  if(!confirm(msg)){return;}
  await q(sb.from('despesas').delete().in('id',ids));
  log('financeiro','Deletadas '+ids.length+' despesas em lote');
  db.despesas=db.despesas.filter(d=>!ids.includes(d.id));
  toast(`${ids.length} despesa(s) removida(s)!`);
  tFinBalancoDesp(); // Recarregar aba
}

async function deletaReceitasLote(ids){
  const receitas=ids.map(id=>byId(db.balanco,id)).filter(Boolean);
  if(!receitas.length){toast('Nenhuma receita selecionada');return;}
  const msg=`Deletar ${receitas.length} receita(s)?\n\nTotal: ${brl(receitas.reduce((s,r)=>s+Number(r.valor),0))}\n\nTem certeza?`;
  if(!confirm(msg)){return;}
  await q(sb.from('balanco_receitas').delete().in('id',ids));
  log('financeiro','Deletadas '+ids.length+' receitas em lote');
  db.balanco=db.balanco.filter(r=>!ids.includes(r.id));
  toast(`${ids.length} receita(s) removida(s)!`);
  tFinBalancoRec(); // Recarregar aba
}

function delReceitasSelecionadas(){
  const ids=[...document.querySelectorAll('.recManCheck:checked')].map(el=>el.dataset.id);
  if(!ids.length){toast('Selecione ao menos uma receita');return;}
  deletaReceitasLote(ids);
}

function delDespesasSelecionadas(){
  const ids=[...document.querySelectorAll('.despCheck:checked')].map(el=>el.dataset.id);
  if(!ids.length){toast('Selecione ao menos uma despesa');return;}
  deletaDespesasLote(ids);
}

function atualizaBotaoDeletarReceitas(){
  const selecionadas=[...document.querySelectorAll('.recManCheck:checked')].length;
  const btn=document.querySelector('#delRecSel');
  if(btn) btn.style.display=selecionadas>0?'block':'none';
}

function atualizaBotaoDeletarDespesas(){
  const selecionadas=[...document.querySelectorAll('.despCheck:checked')].length;
  const btn=document.querySelector('#delDesSel');
  if(btn) btn.style.display=selecionadas>0?'block':'none';
}

// Chamar após renderizar para ligar os listeners
function ligaCheckboxesReceitas(){
  const chks=document.querySelectorAll('.recManCheck');
  chks.forEach(chk=>{ chk.onchange=atualizaBotaoDeletarReceitas; });
  atualizaBotaoDeletarReceitas();
}

function ligaCheckboxesDespesas(){
  const chks=document.querySelectorAll('.despCheck');
  chks.forEach(chk=>{ chk.onchange=atualizaBotaoDeletarDespesas; });
  atualizaBotaoDeletarDespesas();
}

/* ================= LANÇAMENTOS RECORRENTES ================= */
function lancadorRecorrenteDespesa(){
  const anoAtual=new Date().getFullYear();
  modal(`<h2>🔄 Despesa Recorrente (jan-dez)</h2>
  <p class="mut">Cria a despesa para todos os meses de 2025. Você marca cada mês como pago quando pagar.</p>
  <div class="grid g2">
  <div><label>Item/Descrição</label><input id="lrd_item" placeholder="Ex: Treinador"></div>
  <div><label>Categoria</label><input id="lrd_cat" placeholder="Ex: Pessoal"></div>
  </div>
  <label>Valor mensal</label><input id="lrd_valor" type="number" step="0.01" placeholder="Ex: 5000">
  <div class="grid g2">
  <div><label>Fornecedor/Responsável</label><input id="lrd_fornec" placeholder="Ex: João Silva"></div>
  <div><label>Vencimento (dia do mês)</label><input id="lrd_venc" type="number" min="1" max="31" value="10"></div>
  </div>
  <label>Observações</label><textarea id="lrd_obs" rows="2" placeholder="Notas adicionais"></textarea>
  <div class="row" style="margin-top:14px"><button onclick="salvaRecorrenteDespesa()">✓ Criar (12 meses)</button><button class="sec" onclick="fecha()">Cancelar</button></div>`);
}
async function salvaRecorrenteDespesa(){
  const item=fval('lrd_item'),cat=fval('lrd_cat'),valor=Number(fval('lrd_valor')),fornec=fval('lrd_fornec'),obs=fval('lrd_obs'),venc=Number(fval('lrd_venc'))||10;
  if(!item||!cat||!valor){toast('Preencha item, categoria e valor');return;}
  const anoAtual=new Date().getFullYear();
  const rows=[];
  for(let mes=1;mes<=12;mes++){
    const dataStr=`${anoAtual}-${String(mes).padStart(2,'0')}-${String(venc).padStart(2,'0')}`;
    rows.push({data:dataStr,item,categoria:cat,qtd:1,valor,fornecedor:fornec,obs,status:'pendente',tipo_recorrencia:'mensal',mes_referencia:mes,ano_referencia:anoAtual,tipo_lancamento:'recorrente',quem:me?.nome||'Sistema'});
  }
  await q(sb.from('despesas').insert(rows));
  log('financeiro',`Despesa recorrente criada: ${item} (12 meses)`);
  fecha(); await recarrega(); toast('✅ 12 meses criados!');
}

function lancadorRecorrenteReceita(){
  const anoAtual=new Date().getFullYear();
  modal(`<h2>🔄 Receita Recorrente (jan-dez)</h2>
  <p class="mut">Cria a receita para todos os meses de 2025. Você marca cada mês como recebido quando receber.</p>
  <div class="grid g2">
  <div><label>Descrição</label><input id="lrr_desc" placeholder="Ex: Mensalidade João Silva"></div>
  <div><label>Tipo</label><select id="lrr_tipo">
    <option value="mensalidade_atleta">💰 Mensalidade atleta</option>
    <option value="atleta_avulso">👤 Atleta avulso</option>
    <option value="patrocinio">🤝 Patrocínio</option>
    <option value="auxilio">🎁 Auxílio</option>
    <option value="outro">📌 Outro</option>
  </select></div>
  </div>
  <label>Valor mensal</label><input id="lrr_valor" type="number" step="0.01" placeholder="Ex: 150">
  <label>Observações</label><textarea id="lrr_obs" rows="2" placeholder="Notas adicionais"></textarea>
  <div class="row" style="margin-top:14px"><button onclick="salvaRecorrenteReceita()">✓ Criar (12 meses)</button><button class="sec" onclick="fecha()">Cancelar</button></div>`);
}
async function salvaRecorrenteReceita(){
  const desc=fval('lrr_desc'),tipo=$('lrr_tipo').value,valor=Number(fval('lrr_valor')),obs=fval('lrr_obs');
  if(!desc||!tipo||!valor){toast('Preencha descrição, tipo e valor');return;}
  const anoAtual=new Date().getFullYear();
  const autor=me?.nome||'Sistema';
  const rows=[];
  for(let mes=1;mes<=12;mes++){
    const dataStr=`${anoAtual}-${String(mes).padStart(2,'0')}-01`;
    rows.push({data:dataStr,tipo,descricao:desc,valor,origem:'Recorrente',status:'pendente',tipo_recorrencia:'mensal',mes_referencia:mes,ano_referencia:anoAtual,autor});
  }
  await q(sb.from('balanco_receitas').insert(rows));
  log('financeiro',`Receita recorrente criada: ${desc} (12 meses)`);
  fecha(); await recarrega(); toast('✅ 12 meses criados!');
}

/* ================= MEU ESPAÇO ================= */
function tMeu(){
  const minhasCob=db.cobrancas.filter(c=>c.atletaId===me.id&&c.status!=='pago');
  const minhasMetas=db.metas.filter(m=>m.atletaId===me.id);
  const meusUni=db.uniformes.filter(u=>u.atletaId===me.id);
  const minhasFaltas=db.presencas.filter(p=>p.atletaId===me.id&&p.status==='falta').length;
  const minhasPres=db.presencas.filter(p=>p.atletaId===me.id);
  const cmp=minhasPres.filter(p=>['presente','atraso'].includes(p.status)).length;
  const pct=minhasPres.length?Math.round(cmp/minhasPres.length*100):null;
  const st=db.stats.filter(s=>s.atletaId===me.id);
  const gols=st.reduce((s,x)=>s+(+x.gols||0),0), asst=st.reduce((s,x)=>s+(+x.assist||0),0);
  const notas=st.filter(x=>x.nota).map(x=>+x.nota);
  const pend=meusUni.filter(u=>u.status==='pendente');
  const prox=db.eventos.filter(e=>e.data>=hoje()).sort((a,b)=>a.data.localeCompare(b.data)).slice(0,3);
  const docsFaltando=db.config.docsObrig.filter(cat=>!db.arquivos.some(d=>d.atletaId===me.id&&d.categoria===cat));
  return `${bannerNotif()}
  ${pend.length?pend.map(u=>`<div class="alertline al-warn sect">👕 Você recebeu o uniforme <strong>${esc(u.descricao)} nº ${esc(u.numero)}</strong> — <button class="mini gold" onclick="aceitarUniforme('${u.id}')">Ler e aceitar o termo de responsabilidade</button></div>`).join(''):''}
  ${docsFaltando.length?`<div class="alertline al-warn sect">📁 <strong>Documentos pendentes com a diretoria:</strong> ${docsFaltando.map(esc).join(', ')} — anexe abaixo em "Meus documentos".</div>`:''}
  <div class="card sect" style="border-color:var(--blue)"><h2>🗓️ Próximos compromissos</h2>
  ${prox.length?prox.map(e=>`<div class="alertline" style="background:var(--blue-soft)"><div style="flex:1"><strong>${e.tipo==='jogo'?'⚽':'🏃'} ${esc(e.titulo)}</strong><div class="mut">${dbr(e.data)} às ${esc(e.hora)} — ${esc(e.local)}${e.obs?' · '+esc(e.obs):''}</div></div>
    <button class="mini" onclick="modalCal('${e.id}')">📅 Pôr no calendário</button></div>`).join(''):'<p class="mut">Nada agendado por enquanto.</p>'}
  ${prox.length?`<button class="sec mini" onclick="baixarICS(db.eventos.filter(e=>e.data>=hoje()),'agenda-oabmaster.ics')">📅 Agenda completa (.ics)</button>`:''}</div>
  <div class="sect">${cardPats()}</div>
  <div class="sect">${cardDiretoria()}</div>
  <div class="grid g4 sect">
    <div class="card stat clickable" onclick="vai('presencas')"><div class="n">${pct===null?'—':pct+'%'}</div><div class="l">Minha frequência →</div></div>
    <div class="card stat clickable" onclick="vai('desempenho')"><div class="n">${gols}⚽ ${asst}🅰️</div><div class="l">Gols / Assist. →</div></div>
    <div class="card stat"><div class="n" style="color:${minhasCob.length?'var(--warn)':'var(--ok)'}">${brl(minhasCob.reduce((s,c)=>s+Number(valorDe(c)),0))}</div><div class="l">Em aberto comigo</div></div>
    <div class="card stat"><div class="n" style="color:${db.config.limiteFaltas>0&&minhasFaltas>=db.config.limiteFaltas?'var(--bad)':'var(--ink)'}">${minhasFaltas}</div><div class="l">${db.config.limiteFaltas>0?`Faltas (limite ${db.config.limiteFaltas})`:'Faltas'}</div></div>
  </div>
  <div class="grid g2">
  <div class="card"><h2>💰 Minhas pendências</h2>
  ${minhasCob.length?minhasCob.map(c=>`<div class="alertline ${c.status==='atrasado'?'al-bad':'al-warn'}"><div style="flex:1"><strong>${esc(c.desc)}</strong> — ${brl(valorDe(c))}${ehMensal(c)&&c.status!=='atrasado'?`<div class="mut">até o dia ${db.config.mensDia}; depois ${brl(db.config.mensApos)}</div>`:''}<div class="mut">vence ${dbr(c.venc)}</div></div>${db.config.pix?`<button class="mini sec" onclick="copiar('${esc(db.config.pix)}','Chave Pix copiada')">💳 Copiar Pix</button>`:''}</div>`).join(''):'<p class="mut">Tudo pago. 👏</p>'}</div>
  <div class="card"><h2>🎯 Minhas metas</h2>
  ${minhasMetas.length?minhasMetas.map(m=>`<div class="alertline" style="background:var(--bg)"><div style="flex:1"><strong>${esc(m.desc)}</strong><div class="mut">Prazo: ${dbr(m.prazo)}</div></div>${statusMeta(m)}</div>`).join(''):'<p class="mut">Sem metas atribuídas.</p>'}
  <p class="mut" style="margin-top:8px"><a href="#" onclick="vai('avaliacao');return false">Ver minhas avaliações físicas →</a></p></div>
  <div class="card"><h2>👕 Meu uniforme</h2>
  ${meusUni.length?meusUni.map(u=>`<div class="alertline" style="background:var(--bg)"><div style="flex:1"><strong>${esc(u.descricao)} nº ${esc(u.numero)}</strong>
  <div class="row" style="gap:4px;margin-top:4px">${Object.entries(u.pecas||{}).filter(([,v])=>v!=='estoque').map(([k,v])=>pecaChip(k,v)).join('')}</div>
  <div class="mut">${u.status==='com_atleta'?'Sob sua responsabilidade desde '+esc(u.aceitoEm):'Aguardando seu aceite'}</div></div>${u.status==='pendente'?`<button class="mini gold" onclick="aceitarUniforme('${u.id}')">Aceitar termo</button>`:'<span class="pill p-gold">Com você</span>'}</div>`).join(''):'<p class="mut">Nenhum uniforme sob sua guarda.</p>'}
  <p class="mut" style="margin-top:8px">Lembre-se: devolva o uniforme no retorno das viagens.</p></div>
  <div class="card"><h2>🏆 Meus números</h2>
  <div class="tblwrap"><table>
  <tr><td>Jogos com estatísticas</td><td><strong>${st.length}</strong></td></tr>
  <tr><td>⚽ Gols</td><td><strong>${gols}</strong></td></tr>
  <tr><td>🅰️ Assistências</td><td><strong>${asst}</strong></td></tr>
  <tr><td>⭐ Nota média</td><td><strong>${notas.length?(notas.reduce((x,y)=>x+y,0)/notas.length).toFixed(1):'—'}</strong></td></tr>
  </table></div>
  <p class="mut" style="margin-top:8px"><a href="#" onclick="vai('saude');return false">Minha ficha de saúde →</a> · <a href="#" onclick="vai('taticas');return false">Prancheta do treinador →</a></p></div>
  <div class="card"><div class="spread"><h2>📁 Meus documentos</h2>
  ${db.arquivos.some(d=>d.atletaId===me.id)?`<button class="mini sec" onclick="baixarZipPessoa('${me.id}')">⬇ Baixar todos (ZIP)</button>`:''}</div>
  <p class="mut">Cada documento tem sua gaveta: toque em <strong>📎 Anexar</strong> no tipo certo (PDF ou foto, máx. 10 MB). Visíveis para você e para a diretoria — é daqui que saem os documentos para as inscrições nos campeonatos.</p>
  ${slotsDocs(me.id,true)}</div>
  </div>`;
}

boot();
</script>
