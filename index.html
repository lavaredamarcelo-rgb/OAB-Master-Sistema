<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OAB/PA Master</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --primary: #2563eb;
            --success: #10b981;
            --danger: #ef4444;
            --bg: #f9fafb;
            --surface: #ffffff;
            --text: #1f2937;
        }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        .header { background: var(--surface); padding: 20px; margin-bottom: 20px; border-radius: 8px; }
        .btn { padding: 10px 16px; border: none; border-radius: 6px; cursor: pointer; font-weight: 500; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { opacity: 0.9; }
        .form { background: var(--surface); padding: 24px; border-radius: 8px; max-width: 400px; }
        .form-group { margin-bottom: 16px; }
        label { display: block; margin-bottom: 6px; font-weight: 500; }
        input { width: 100%; padding: 10px; border: 1px solid #e5e7eb; border-radius: 6px; }
        .hidden { display: none; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 24px; }
        .stat-card { background: var(--surface); padding: 20px; border-radius: 8px; }
        .stat-label { font-size: 12px; color: #6b7280; text-transform: uppercase; }
        .stat-value { font-size: 28px; font-weight: bold; color: var(--primary); margin-top: 8px; }
    </style>
</head>
<body>
    <div id="app"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // Configuração
        const CONFIG = {
            supabaseUrl: 'https://pzodgfsekqpumvgigeii.supabase.co',
            supabaseKey: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB6b2RnZnNla3FwdW12Z2lnZWlpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3MjA0MTM5NDEsImV4cCI6MjAzNTk4OTk0MX0.SGQR_fLXrHXHZ6yRp3lR2xS5qR_xZ0xZ0xZ0xZ0xZ0xZ'
        };

        let db = null;
        let user = null;

        // Inicializa Supabase
        function initDB() {
            if (typeof window.supabase !== 'undefined') {
                db = window.supabase.createClient(CONFIG.supabaseUrl, CONFIG.supabaseKey);
            }
        }

        // Login
        async function login(email, password) {
            if (!db) initDB();
            try {
                const { data, error } = await db.auth.signInWithPassword({ email, password });
                if (error) throw error;
                user = data.user;
                render();
            } catch (e) {
                alert('Erro: ' + e.message);
            }
        }

        // Registrar
        async function signup(name, email, password) {
            if (!db) initDB();
            try {
                const { data, error } = await db.auth.signUp({ 
                    email, 
                    password,
                    options: { data: { full_name: name } }
                });
                if (error) throw error;
                user = data.user;
                render();
            } catch (e) {
                alert('Erro: ' + e.message);
            }
        }

        // Logout
        async function logout() {
            if (!db) return;
            await db.auth.signOut();
            user = null;
            render();
        }

        // Render principal
        function render() {
            const app = document.getElementById('app');
            
            if (!user) {
                renderAuth(app);
            } else {
                renderDashboard(app);
            }
        }

        function renderAuth(app) {
            app.innerHTML = `
                <div class="container">
                    <div class="header">
                        <h1>OAB/PA Master</h1>
                    </div>
                    <div class="form">
                        <h2 style="margin-bottom: 20px;">Entrar</h2>
                        <div class="form-group">
                            <label>Email</label>
                            <input type="email" id="loginEmail" placeholder="seu@email.com">
                        </div>
                        <div class="form-group">
                            <label>Senha</label>
                            <input type="password" id="loginPassword" placeholder="••••••••">
                        </div>
                        <button class="btn btn-primary" style="width: 100%;" onclick="handleLoginClick()">Entrar</button>
                        <p style="margin-top: 16px; text-align: center; font-size: 14px;">
                            Não tem conta? <a href="#" onclick="toggleAuth(); return false;">Registrar</a>
                        </p>
                    </div>
                    <div id="signupForm" class="form hidden" style="margin-top: 20px;">
                        <h2 style="margin-bottom: 20px;">Registrar</h2>
                        <div class="form-group">
                            <label>Nome</label>
                            <input type="text" id="signupName" placeholder="Seu nome">
                        </div>
                        <div class="form-group">
                            <label>Email</label>
                            <input type="email" id="signupEmail" placeholder="seu@email.com">
                        </div>
                        <div class="form-group">
                            <label>Senha</label>
                            <input type="password" id="signupPassword" placeholder="••••••••">
                        </div>
                        <button class="btn btn-primary" style="width: 100%;" onclick="handleSignupClick()">Registrar</button>
                        <p style="margin-top: 16px; text-align: center; font-size: 14px;">
                            Já tem conta? <a href="#" onclick="toggleAuth(); return false;">Entrar</a>
                        </p>
                    </div>
                </div>
            `;
        }

        function renderDashboard(app) {
            app.innerHTML = `
                <div class="container">
                    <div class="header">
                        <div style="display: flex; justify-content: space-between; align-items: center;">
                            <h1>OAB/PA Master</h1>
                            <div>
                                <span style="margin-right: 16px;">${user.email}</span>
                                <button class="btn btn-primary" onclick="handleLogoutClick()">Sair</button>
                            </div>
                        </div>
                    </div>
                    <div class="stats-grid">
                        <div class="stat-card">
                            <div class="stat-label">Atletas</div>
                            <div class="stat-value">0</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-label">Cobranças</div>
                            <div class="stat-value">0</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-label">Uniformes</div>
                            <div class="stat-value">0</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-label">Eventos</div>
                            <div class="stat-value">0</div>
                        </div>
                    </div>
                    <p>Sistema pronto para uso!</p>
                </div>
            `;
        }

        function toggleAuth() {
            const form = document.getElementById('signupForm');
            form.classList.toggle('hidden');
        }

        function handleLoginClick() {
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            if (!email || !password) {
                alert('Preencha todos os campos');
                return;
            }
            login(email, password);
        }

        function handleSignupClick() {
            const name = document.getElementById('signupName').value;
            const email = document.getElementById('signupEmail').value;
            const password = document.getElementById('signupPassword').value;
            if (!name || !email || !password) {
                alert('Preencha todos os campos');
                return;
            }
            signup(name, email, password);
        }

        function handleLogoutClick() {
            logout();
        }

        // Inicializa ao carregar
        window.addEventListener('load', function() {
            initDB();
            render();
        });
    </script>
</body>
</html>
