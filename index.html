<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OAB/PA Master — Gestão do Time</title>
<link rel="icon" type="image/png" href="escudo.png">
<link rel="apple-touch-icon" href="escudo-192.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#B8272D">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root{
  --bg:#F6F4EF; --card:#FFFFFF; --ink:#23262E; --ink2:#5C616E; --line:#E1DFD8;
  --p:#B8272D; --p-soft:#F7E5E2; --blue:#1C4FA0; --blue-soft:#E3EAF6; --gold:#A8811C; --gold-soft:#F6EDD6;
  --ok:#2E7D4F; --ok-soft:#E2F1E7; --warn:#A86A12; --warn-soft:#F8EEDD; --bad:#B3372E; --bad-soft:#F9E7E5;
  --shadow:0 1px 3px rgba(35,38,46,.08),0 4px 14px rgba(35,38,46,.06);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:15px/1.55 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif;letter-spacing:.01em;text-wrap:balance}
h1{font-size:26px;margin:0}h2{font-size:20px;margin:0 0 12px}h3{font-size:16px;margin:0 0 8px}
button{font:inherit;cursor:pointer;border:none;border-radius:9px;padding:8px 14px;background:var(--p);color:#fff;transition:filter .15s}
button:hover{filter:brightness(1.08)}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
button.sec{background:var(--card);color:var(--ink);border:1px solid var(--line)}
button.warn{background:var(--warn)}button.bad{background:var(--bad)}button.gold{background:var(--gold)}
button.mini{padding:4px 10px;font-size:13px;border-radius:7px}
button:disabled{opacity:.55;cursor:wait}
input,select,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:9px;padding:8px 10px;width:100%}
textarea{min-height:70px;resize:vertical}
label{display:block;font-size:12.5px;font-weight:600;color:var(--ink2);margin:10px 0 4px;text-transform:uppercase;letter-spacing:.05em}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink2);text-align:left;padding:8px 10px;border-bottom:2px solid var(--line)}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tblwrap{overflow-x:auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow)}
.clickable{cursor:pointer;transition:border-color .15s}
.clickable:hover{border-color:var(--p)}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.p-ok{background:var(--ok-soft);color:var(--ok)}.p-warn{background:var(--warn-soft);color:var(--warn)}.p-bad{background:var(--bad-soft);color:var(--bad)}.p-mut{background:var(--blue-soft);color:var(--blue)}.p-gold{background:var(--gold-soft);color:var(--gold)}
a{color:var(--blue)}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.g5{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.mut{color:var(--ink2);font-size:13px}
.stat .n{font-size:26px;font-weight:700;font-family:Georgia,serif;line-height:1.15;overflow-wrap:anywhere}
.stat .l{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink2)}
#shell{display:flex;min-height:100vh}
#side{width:230px;flex-shrink:0;background:var(--card);border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100vh;overflow-y:auto}
#side .brand{padding:4px 10px 16px}
#side .brand .t{font-family:Georgia,serif;font-weight:700;font-size:17px;line-height:1.25}
#side .brand .s{font-size:11.5px;color:var(--ink2);text-transform:uppercase;letter-spacing:.08em;margin-top:3px}
.navb{display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:transparent;color:var(--ink);padding:9px 12px;border-radius:9px;font-size:14px}
.navb:hover{background:var(--p-soft);filter:none}
.navb.on{background:var(--p);color:#fff;font-weight:600}
.navb .ic{width:20px;text-align:center}
#main{flex:1;padding:26px 30px 60px;min-width:0}
#topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.badge-user{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:5px 14px 5px 6px}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--p);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0}
.sect{margin-bottom:22px}
.alertline{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:10px;margin-bottom:8px;font-size:14px}
.al-bad{background:var(--bad-soft)}.al-warn{background:var(--warn-soft)}.al-ok{background:var(--ok-soft)}
.alertline.clickable:hover{outline:1px solid var(--p)}
#modalbg{position:fixed;inset:0;background:rgba(10,12,16,.55);display:none;align-items:flex-start;justify-content:center;z-index:50;padding:30px 14px;overflow-y:auto}
#modalbg.open{display:flex}
#modal{background:var(--card);border-radius:16px;max-width:640px;width:100%;padding:24px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 20px;border-radius:99px;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:99;max-width:90vw}
#toast.show{opacity:1}
.termo{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:20px 22px;max-height:340px;overflow-y:auto;font-size:13.5px;line-height:1.65}
.termo h4{font-family:Georgia,serif;margin:14px 0 6px;font-size:14px}
.termo p{margin:0 0 8px}
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(160deg,var(--p-soft),var(--bg) 55%)}
.login-box{width:100%;max-width:420px}
.crest{width:86px;margin:0 auto 14px;display:flex;justify-content:center}
.crest img{width:86px;height:auto}
.tabbtns{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tabbtns button{background:var(--card);color:var(--ink);border:1px solid var(--line);padding:6px 13px;font-size:13.5px}
.tabbtns button.on{background:var(--p);color:#fff;border-color:var(--p)}
.campo{background:repeating-linear-gradient(0deg,#2E8B52 0 40px,#2A7F4B 40px 80px);border-radius:14px;padding:22px 10px;display:flex;flex-direction:column;gap:18px;border:3px solid #fff;outline:3px solid #1D5A34;position:relative;overflow:hidden}
.campo::before{content:'';position:absolute;left:0;right:0;top:50%;border-top:2px solid rgba(255,255,255,.6)}
.campo::after{content:'';position:absolute;left:50%;top:50%;width:70px;height:70px;border:2px solid rgba(255,255,255,.6);border-radius:50%;transform:translate(-50%,-50%)}
.campo .area,.prancheta .area{position:absolute;left:50%;transform:translateX(-50%);width:46%;height:34px;border:2px solid rgba(255,255,255,.6);pointer-events:none}
.campo .a-top,.prancheta .a-top{top:-2px;border-top:none;border-radius:0 0 10px 10px}
.campo .a-bot,.prancheta .a-bot{bottom:-2px;border-bottom:none;border-radius:10px 10px 0 0}
.tok .pos{display:block;font-size:9px;font-weight:600;color:#5C616E;text-transform:uppercase;letter-spacing:.03em;text-align:center}
.tok.time .pos,.tok.adv .pos{color:#fff;opacity:.9}
.campo .linha{display:flex;justify-content:space-evenly;gap:6px;flex-wrap:wrap;position:relative;z-index:2}
.jog{background:#fff;color:#1E2228;border-radius:99px;padding:4px 11px;font-size:12.5px;font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.3);white-space:nowrap;text-align:center}
.jog .pos{display:block;font-size:9px;font-weight:600;color:#5C616E;text-transform:uppercase;letter-spacing:.04em}
.jog.gk{background:#F2C11E}
.prancheta{position:relative;width:100%;aspect-ratio:3/3.6;background:repeating-linear-gradient(0deg,#2E8B52 0 11%,#2A7F4B 11% 22%);border:3px solid #fff;outline:3px solid #1D5A34;border-radius:14px;overflow:hidden;touch-action:none}
.prancheta .plin{position:absolute;left:0;right:0;top:50%;border-top:2px solid rgba(255,255,255,.55);pointer-events:none}
.prancheta .pcirc{position:absolute;left:50%;top:50%;width:18%;aspect-ratio:1;border:2px solid rgba(255,255,255,.55);border-radius:50%;transform:translate(-50%,-50%);pointer-events:none}
.tok{position:absolute;transform:translate(-50%,-50%);background:#fff;color:#1E2228;border-radius:99px;padding:3px 9px;font-size:12px;font-weight:700;box-shadow:0 2px 5px rgba(0,0,0,.35);cursor:grab;user-select:none;white-space:nowrap;z-index:5}
.tok.bola{background:#F2C11E;border-radius:50%;width:26px;height:26px;display:flex;align-items:center;justify-content:center;padding:0}
.tok.time{background:#c41e3a;color:#fff}
.tok.adv{background:#1d4ed8;color:#fff}
.tok.mov{transition:left 2.2s ease-in-out, top 2.2s ease-in-out}
.setas{position:absolute;inset:0;width:100%;height:100%;z-index:3;pointer-events:none}
.doc{display:flex;gap:10px;align-items:center;padding:8px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:6px;font-size:13.5px;flex-wrap:wrap}
.doc>span{min-width:0;overflow-wrap:anywhere}
/* Card do jogador */
.pcard{width:235px;border-radius:20px;padding:20px 14px 14px;position:relative;text-align:center;box-shadow:0 12px 34px rgba(0,0,0,.28);flex-shrink:0}
.pcard.ouro{background:linear-gradient(160deg,#f7dd8d,#e9bc2a 45%,#c3921a);color:#3a2c05}
.pcard.clube{background:linear-gradient(160deg,#8a1f2f,#511219 58%,#27090d);color:#f7e8c8;border:1px solid #F2C11E}
.pcard .pfoto{width:138px;height:138px;border-radius:50%;object-fit:cover;border:4px solid rgba(255,255,255,.65);margin:10px auto 4px;display:block;background:#fff;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.pcard.clube .pfoto{border-color:#F2C11E}
.pcard .pnum{position:absolute;top:14px;left:16px;font-size:28px;font-weight:800;font-family:Georgia,serif;line-height:1}
.pcard .ppos{position:absolute;top:46px;left:16px;font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;max-width:80px;text-align:left}
.pcard .pescudo{position:absolute;top:12px;right:12px;width:44px;height:44px;display:flex;align-items:center;justify-content:center;filter:drop-shadow(0 2px 4px rgba(0,0,0,.35))}
.pcard .ppos2{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;opacity:.85;margin-top:3px}
.pcard .pnome{font-size:17px;font-weight:800;margin-top:6px;text-transform:uppercase;letter-spacing:.03em}
.pcard .ptime{font-size:10px;text-transform:uppercase;letter-spacing:.12em;opacity:.75;margin-top:2px}
.pcard .pstats{display:flex;justify-content:space-around;margin-top:12px;padding-top:10px;border-top:1px solid rgba(0,0,0,.18)}
.pcard.clube .pstats{border-top-color:rgba(247,232,200,.3)}
.pcard .pstats .v{font-size:17px;font-weight:800;font-family:Georgia,serif}
.pcard .pstats .k{font-size:9.5px;text-transform:uppercase;letter-spacing:.06em;opacity:.75}
.pcard .pstats>div{flex:1;text-align:center;min-width:0}
.pcard .pstats.cinco .v{font-size:14.5px}.pcard .pstats.cinco .k{font-size:8.5px;letter-spacing:.03em;white-space:nowrap}
/* ===== Card FUT (escudo TOTY) ===== */
.futwrap{width:260px;flex-shrink:0;filter:drop-shadow(0 10px 22px rgba(0,0,0,.4))}
.futwrap.glow{filter:drop-shadow(0 0 5px #F2C11E) drop-shadow(0 0 14px rgba(242,193,30,.8)) drop-shadow(0 10px 22px rgba(0,0,0,.4))}
.fut{position:relative;width:260px;height:400px;clip-path:polygon(5% 0,95% 0,100% 3.5%,100% 70%,93% 82%,72% 94%,50% 100%,28% 94%,7% 82%,0 70%,0 3.5%)}
.fut .fut-in{position:absolute;inset:7px;clip-path:polygon(5% 0,95% 0,100% 3.5%,100% 70%,93% 82%,72% 94%,50% 100%,28% 94%,7% 82%,0 70%,0 3.5%);overflow:hidden}
.fut.b-bronze{background:linear-gradient(160deg,#f0c9a3,#b07a45 45%,#5a3413)}
.fut.b-prata{background:linear-gradient(160deg,#ffffff,#c5c8d2 45%,#6f7382)}
.fut.b-ouro{background:linear-gradient(160deg,#fff1b8,#e0ac18 45%,#8a6a0c)}
.fut.b-especial{background:linear-gradient(160deg,#fff3c4,#F2C11E 40%,#d9a514 60%,#8a1f2f)}
.fut.s-clube .fut-in{background:linear-gradient(160deg,#8a1f2f 0%,#4a0f1c 35%,#1a2a5e 100%);color:#f3d27a}
.fut.s-ouro .fut-in{background:linear-gradient(160deg,#fbe8a6,#e9bc2a 45%,#b8870c);color:#3a2c05}
.fut .ftex{position:absolute;inset:0;background:repeating-linear-gradient(-32deg,rgba(255,255,255,.0) 0 9px,rgba(255,255,255,.06) 9px 11px,rgba(255,255,255,0) 11px 20px,rgba(0,0,0,.08) 20px 23px)}
.fut .ffoil{position:absolute;inset:0;width:100%;height:100%}
.fut .fring{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.fut .fbadge{position:absolute;left:50%;top:9px;transform:translateX(-50%);font-size:15px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.4))}
.fut .fov{position:absolute;left:20px;top:28px;font-size:46px;font-weight:900;font-family:Georgia,serif;line-height:1;text-shadow:0 1px 2px rgba(0,0,0,.25)}
.fut .fpos{position:absolute;left:22px;top:78px;font-size:15px;font-weight:800;letter-spacing:.06em}
.fut .fposalt{position:absolute;left:22px;top:96px;font-size:9.5px;font-weight:800;letter-spacing:.04em;opacity:.8}
.fut .fflag{position:absolute;left:22px;top:114px;width:34px;height:23px;border-radius:3px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.35)}
.fut .fcrest{position:absolute;left:21px;top:144px;width:36px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.35))}
.fut .fphoto{position:absolute;right:14px;top:24px;width:150px;height:168px;object-fit:cover;object-position:top;border-radius:10px 10px 0 0;-webkit-mask-image:linear-gradient(#000 70%,transparent 100%);mask-image:linear-gradient(#000 70%,transparent 100%)}
.fut .fphoto.ini{display:flex;align-items:center;justify-content:center;font-size:64px;font-weight:800;background:rgba(255,255,255,.12);color:rgba(255,255,255,.55)}
.fut.s-ouro .fphoto.ini{background:rgba(255,255,255,.35);color:rgba(0,0,0,.4)}
.fut .fname{position:absolute;left:0;right:0;top:194px;text-align:center;font-size:24px;font-weight:900;text-transform:uppercase;letter-spacing:.04em;line-height:1.05;padding:0 12px;text-shadow:0 1px 2px rgba(0,0,0,.3)}
.fut .fpat{position:absolute;left:0;right:0;top:224px;text-align:center;font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;opacity:.85}
.fut .fline{position:absolute;left:30px;right:30px;top:242px;height:1px;background:currentColor;opacity:.45}
.fut .fstats{position:absolute;left:26px;right:26px;top:247px;display:grid;grid-template-columns:1fr 1fr;column-gap:12px;row-gap:8px}
.fut .fstats>div{display:flex;align-items:baseline;justify-content:center;gap:8px;font-size:25px;font-weight:900;font-family:Georgia,serif;text-shadow:0 1px 2px rgba(0,0,0,.25)}
.fut .fstats>div:nth-child(2n){border-left:1px solid currentColor;padding-left:10px}
.fut .fstats>div span{font-size:14px;font-weight:800;font-family:inherit;letter-spacing:.06em;opacity:.85}
.fut .fline2{position:absolute;left:30px;right:30px;top:333px;height:1px;background:currentColor;opacity:.45}
.fut .ffoot{position:absolute;left:0;right:0;top:341px;text-align:center;font-size:9px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;opacity:.8}

.patrow{display:flex;gap:12px;flex-wrap:wrap;align-items:stretch;justify-content:center}
.pat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-decoration:none;color:var(--ink);min-width:110px}
.pat img{max-height:44px;max-width:112px;object-fit:contain}
.pat.diamante{border-color:#7dd3fc;box-shadow:0 0 0 2px rgba(125,211,252,.35)}
.pat.diamante img{max-height:96px;max-width:245px}
.pat.master{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold-soft)}
.pat.master img{max-height:82px;max-width:210px}
.pat.ouro{border-color:var(--gold)}
.pat.ouro img{max-height:68px;max-width:175px}
.pat.prata{border-color:#c0c7d1}
.pat.prata img{max-height:56px;max-width:145px}
.pat.bronze{border-color:#c9925a}
.pat.bronze img{max-height:50px;max-width:128px}
.pat .pn{font-size:12px;font-weight:700;text-align:center}
.pat .pb{font-size:11px;color:var(--gold);font-weight:600;text-align:center}
.medal{font-size:16px}
details{border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:8px;background:var(--card)}
summary{cursor:pointer;font-weight:600;font-size:14px}
#bottombar{display:none}
body.kb-aberto #bottombar{display:none!important}
@media(max-width:820px){
  #shell{flex-direction:column}
  #side{display:none}
  #bottombar{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);z-index:40;justify-content:space-around;align-items:stretch;padding:6px 4px calc(8px + env(safe-area-inset-bottom));box-shadow:0 -2px 12px rgba(0,0,0,.08)}
  .bb{display:flex;flex-direction:column;align-items:center;gap:2px;background:none;color:var(--ink2);font-size:10.5px;padding:4px 6px;border-radius:10px;flex:1;font-weight:600}
  .bb .bi{font-size:21px;line-height:1}
  .bb.on{color:var(--p);background:var(--p-soft)}
  .bb:hover{filter:none}
  #main{padding:16px 14px 110px}
  input,select,textarea{font-size:16px;padding:10px 12px}
  button{padding:10px 16px}
  button.mini{padding:9px 14px;font-size:14px;min-height:40px}
  h1{font-size:22px}
  td,th{padding:8px 8px}
  /* Modal em folha deslizante (bottom sheet) */
  #modalbg{padding:0;align-items:flex-end}
  #modal{max-width:100%;border-radius:20px 20px 0 0;max-height:92dvh;overflow-y:auto;padding:20px 16px calc(20px + env(safe-area-inset-bottom));animation:sheetup .22s ease-out}
  @keyframes sheetup{from{transform:translateY(40px);opacity:.6}to{transform:translateY(0);opacity:1}}
}
/* Celular na vertical E na horizontal (até 1000px) */
@media(max-width:1000px){
  .stat .n{font-size:clamp(15px,2.4vw + 7px,22px)}
  /* Linha de documento: categoria e botões na primeira linha, nome completo embaixo */
  .doc .dinfo{order:9;flex:1 1 100%}
  .doc button:first-of-type{margin-left:auto}
  /* Grades que devem empilhar no celular (vertical e horizontal) */
  .stack-mobile{grid-template-columns:1fr!important}
  /* Tabelas viram cartões empilhados — sem scroll lateral */
  table.cardz{display:block;border:none}
  table.cardz tr{display:block;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:10px}
  table.cardz tr:has(th){display:none}
  table.cardz td{display:flex;justify-content:space-between;align-items:center;gap:10px;border:none;padding:5px 0;flex-wrap:wrap;text-align:left}
  table.cardz td:empty{display:none}
  table.cardz td[data-l]::before{content:attr(data-l);font-size:10.5px;color:var(--ink2);text-transform:uppercase;letter-spacing:.05em;font-weight:700;flex-shrink:0}
  table.cardz td.row,table.cardz td .row{justify-content:flex-start}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<div id="modalbg"><div id="modal"></div></div>
<div id="toast"></div>

<script>

/* Frequência POR DIA: treino + amistoso no mesmo dia contam uma vez só,
   valendo a melhor situação do dia (presente > atraso > justificada > falta) */
function freqAtleta(atId){
  const peso={presente:0,atraso:1,justificada:2,falta:3};
  const porDia={};
  db.presencas.filter(p=>p.atletaId===atId).forEach(p=>{
    const e=byId(db.eventos,p.eventoId); if(!e)return;
    const d=porDia[e.data];
    const j=ehJogoTipo(e.tipo), t=ehTreinoTipo(e.tipo);
    if(!d||peso[p.status]<peso[d.status]) porDia[e.data]={status:p.status,jogo:j||(d?d.jogo:false),treino:t||(d?d.treino:false)};
    else {if(j)d.jogo=true; if(t)d.treino=true;}
  });
  const dias=Object.values(porDia);
  const cmp=dias.filter(x=>['presente','atraso'].includes(x.status));
  return {tot:dias.length,cmp:cmp.length,jg:cmp.filter(x=>x.jogo).length,tr:cmp.filter(x=>x.treino).length,
    f:dias.filter(x=>x.status==='falta').length,at:dias.filter(x=>x.status==='atraso').length,
    j:dias.filter(x=>x.status==='justificada').length,
    pct:dias.length?Math.round(cmp.length/dias.length*100):null};
}

function upFile(inp,maxMB,cb){ const f=inp.files[0]; if(!f)return; if(f.size>maxMB*1048576){toast(`Arquivo grande demais (máx. ${maxMB} MB)`);inp.value='';return;} cb(f); inp.value=''; }
async function enviaArquivo(f,escopo,atletaId,categoria,extra){
  const pasta=escopo==='tatica'?'tatica':escopo==='financeiro'?'financeiro':(atletaId||me.id);
  const path=`${pasta}/${uid()}-${f.name.replace(/[^\w.\-]+/g,'_')}`;
  const {error}=await sb.storage.from('arquivos').upload(path,f);
  if(error){toast('⚠️ Envio falhou: '+error.message);throw error;}
  let dados={atleta_id:escopo==='tatica'||escopo==='financeiro'?null:(atletaId||me.id),escopo,categoria:categoria||'Outro',nome:f.name,path,mime:f.type,tam:f.size,quem:me.nome,titulo:(extra&&extra.titulo)||'',descricao:(extra&&extra.descricao)||''};
  let {error:e1}=await sb.from('documentos').insert(dados);
  if(e1&&/titulo|descricao/.test(e1.message||'')){
    delete dados.titulo; delete dados.descricao;
    const {error:e2}=await sb.from('documentos').insert(dados);
    if(e2){toast('⚠️ '+e2.message);throw e2;}
    if(extra&&(extra.titulo||extra.descricao))toast('⚠️ Anexado sem título — rode o SQL v18 no Supabase');
  } else if(e1){toast('⚠️ '+e1.message);throw e1;}
}

/* ================= PDF ================= */
function lat1(s){ let o=''; for(const ch of String(s)){ const c=ch.codePointAt(0);
  if(c<=255)o+=ch; else o+=({'—':'-','–':'-','’':"'",'‘':"'",'“':'"','”':'"','•':'-',' ':' ','…':'...'}[ch]??''); } return o; }
function pdfEsc(s){ return s.replace(/\\/g,'\\\\').replace(/\(/g,'\\(').replace(/\)/g,'\\)'); }
function genPDF(nomeArq,titulo,linhas){
  const wrapd=[];
  linhas.forEach(l=>{ l=lat1(l);
    if(l.length<=100){wrapd.push(l);return;}
    let cur=''; l.split(' ').forEach(t=>{ if((cur+' '+t).trim().length>100){wrapd.push(cur);cur=t;} else cur=(cur?cur+' ':'')+t; }); if(cur)wrapd.push(cur); });
  const porPag=50, pags=[];
  for(let i=0;i<Math.max(wrapd.length,1);i+=porPag)pags.push(wrapd.slice(i,i+porPag));
  const objs=[];
  const kids=pags.map((_,i)=>`${5+i*2} 0 R`).join(' ');
  objs.push(`1 0 obj<</Type/Catalog/Pages 2 0 R>>endobj`);
  objs.push(`2 0 obj<</Type/Pages/Kids[${kids}]/Count ${pags.length}>>endobj`);
  objs.push(`3 0 obj<</Type/Font/Subtype/Type1/BaseFont/Helvetica/Encoding/WinAnsiEncoding>>endobj`);
  objs.push(`4 0 obj<</Type/Font/Subtype/Type1/BaseFont/Helvetica-Bold/Encoding/WinAnsiEncoding>>endobj`);
  pags.forEach((pg,i)=>{
    let s='';
    if(i===0) s+=`BT /F2 13 Tf 50 792 Td (${pdfEsc(lat1(titulo))}) Tj ET\n`;
    s+=`BT /F1 9.5 Tf 13.5 TL 50 ${i===0?764:800} Td\n`;
    pg.forEach(l=>{ s+=`(${pdfEsc(l)}) Tj T*\n`; });
    s+='ET';
    objs.push(`${5+i*2} 0 obj<</Type/Page/Parent 2 0 R/MediaBox[0 0 595 842]/Resources<</Font<</F1 3 0 R/F2 4 0 R>>>>/Contents ${6+i*2} 0 R>>endobj`);
    objs.push(`${6+i*2} 0 obj<</Length ${s.length}>>stream\n${s}\nendstream endobj`);
  });
  let pdf='%PDF-1.4\n'; const offs=[];
  objs.forEach(o=>{ offs.push(pdf.length); pdf+=o+'\n'; });
  const xref=pdf.length;
  pdf+=`xref\n0 ${objs.length+1}\n0000000000 65535 f \n`+offs.map(o=>String(o).padStart(10,'0')+' 00000 n \n').join('');
  pdf+=`trailer<</Size ${objs.length+1}/Root 1 0 R>>\nstartxref\n${xref}\n%%EOF`;
  const bytes=new Uint8Array(pdf.length); for(let i=0;i<pdf.length;i++)bytes[i]=pdf.charCodeAt(i)&0xFF;
  baixar(nomeArq,new Blob([bytes],{type:'application/pdf'}));
  toast('PDF baixado — anexe no WhatsApp para compartilhar');
}
function htmlParaLinhas(html){
  const d=document.createElement('div'); d.innerHTML=html; const out=[];
  d.querySelectorAll('h4,p').forEach(el=>{ const t=el.textContent.replace(/\s+/g,' ').trim(); if(!t)return;
    if(el.tagName==='H4'){ out.push(''); out.push(t.toUpperCase()); } else out.push(t); });
  return out;
}

  if(!me.consent.aceito&&!me.consent.recusado){ await carregaTudo(); renderConsent(); return; }

  try{ await carregaTudo(); }catch(e){ toast('Erro ao carregar dados'); return; }

  renderShell();
}

function b64ToU8(s){ const p='='.repeat((4-s.length%4)%4); const b=atob((s+p).replace(/-/g,'+').replace(/_/g,'/')); return Uint8Array.from([...b].map(c=>c.charCodeAt(0))); }

async function ativarNotif(){
  try{
    if(!('serviceWorker' in navigator)||!('PushManager' in window)||typeof Notification==='undefined'){
      toast('Neste aparelho: adicione o app à Tela de Início primeiro (iPhone precisa disso) e tente de novo'); return; }
    const perm=await Notification.requestPermission();
    if(perm!=='granted'){toast('Permissão negada — ative nas configurações do navegador');return;}
    const reg=await navigator.serviceWorker.ready;
    const sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64ToU8(VAPID_PUB)});
    const j=sub.toJSON();
    const {data:ex}=await sb.from('push_subs').select('id,sub').eq('atleta_id',me.id);
    if(!(ex||[]).some(s=>s.sub&&s.sub.endpoint===j.endpoint)) await q(sb.from('push_subs').insert({atleta_id:me.id,sub:j}));

  log('lgpd',`Consentimento LGPD ${sim?'ACEITO':'RECUSADO'} por ${me.nome} (v${TERMO_LGPD_V})`);

function pendencias(a){
  const P=[];
  const cobAb=db.cobrancas.filter(c=>c.atletaId===a.id&&c.status!=='pago');
  const atras=cobAb.filter(c=>c.status==='atrasado');
  if(atras.length)P.push({txt:`💰 ${atras.length} pagamento(s) em atraso — ${brl(atras.reduce((s,c)=>s+Number(valorDe(c)),0))}`,tab:'financeiro'});
  else if(cobAb.length)P.push({txt:`💰 ${cobAb.length} cobrança(s) a vencer — ${brl(cobAb.reduce((s,c)=>s+Number(valorDe(c)),0))}`,tab:'financeiro'});
  const f=freqAtleta(a.id).f;
  if(db.config.limiteFaltas>0&&f>=db.config.limiteFaltas)P.push({txt:`🚫 ${f} faltas (limite: ${db.config.limiteFaltas})`,tab:'presencas'});
  if(a.role==='atleta'||a.role==='diretoria')db.config.docsObrig.filter(cat=>!db.arquivos.some(d=>d.atletaId===a.id&&d.categoria===cat)).forEach(cat=>P.push({txt:`📁 Enviar documento: ${cat}`,tab:'docs'}));
  db.metas.filter(m=>m.atletaId===a.id&&m.status==='andamento'&&m.prazo&&m.prazo<hoje()).forEach(m=>P.push({txt:`📈 Meta vencida: ${m.desc}`,tab:'avaliacao'}));
  if(!a.consent.aceito&&!a.consent.recusado&&!a.consent.revogado)P.push({txt:'⚖️ Termo LGPD pendente de aceite',tab:'lgpd'});
  if(a.consent.recusado||a.consent.revogado)P.push({txt:'⚖️ Sem consentimento LGPD (recusado/revogado)',tab:'lgpd'});
  db.uniformes.filter(u=>u.atletaId===a.id&&u.status==='pendente').forEach(u=>P.push({txt:`👕 Termo do uniforme nº ${u.numero} aguardando aceite`,tab:'uniformes'}));
  return P;
}

    else if(a.m.includes('Tarefa'))grupos['📌 Tarefas'].push(a);
  });

async function comprimeFoto(f){
  const img=await createImageBitmap(f);
  const max=500, sc=Math.min(1,max/Math.max(img.width,img.height));
  const c=document.createElement('canvas'); c.width=Math.round(img.width*sc); c.height=Math.round(img.height*sc);
  c.getContext('2d').drawImage(img,0,0,c.width,c.height);
  return await new Promise(r=>c.toBlob(r,'image/jpeg',.85));
}

function ovBase(){
  if(db._ovBase)return db._ovBase;

function overallDe(atId){

    {k:'FRE',v:b.FRE!=null?Math.round(b.FRE):null},

async function vincularConvidado(idReal,nomeConv){
  if(!nomeConv)return;
  const a=at(idReal);
  confirma(`Transferir todos os lançamentos do convidado <strong>🎟️ ${esc(nomeConv)}</strong> (cobranças, presenças e estatísticas) para <strong>${esc(a?a.nome:'')}</strong>?`,async()=>{
    let nCob=0,nPres=0,nStat=0;
    const {data:d1,error:e1}=await sb.from('cobrancas').update({atleta_id:idReal,convidado:''}).eq('convidado',nomeConv).is('atleta_id',null).select();
    if(e1){toast('⚠️ '+e1.message);return;} nCob=(d1||[]).length;
    const {data:d2}=await sb.from('stats').update({atleta_id:idReal,convidado:null}).eq('convidado',nomeConv).is('atleta_id',null).select();
    nStat=(d2||[]).length;
    const pres=db.presencas.filter(pz=>!pz.atletaId&&pz.convidado===nomeConv);
    for(const pz of pres){
      const jaTem=db.presencas.some(x=>x.eventoId===pz.eventoId&&x.atletaId===idReal);
      if(jaTem) await sb.from('presencas').delete().eq('evento_id',pz.eventoId).eq('convidado',nomeConv);
      else{ const {error:e3}=await sb.from('presencas').update({atleta_id:idReal,convidado:null}).eq('evento_id',pz.eventoId).eq('convidado',nomeConv); if(!e3)nPres++; }
    }
    log('cadastro',`Lançamentos de convidado transferidos: 🎟️ ${nomeConv} → ${a?a.nome:idReal} (${nCob} cobranças, ${nPres} presenças, ${nStat} estatísticas)`);
    fecha(); await recarrega(); toast(`🎟️→👤 Transferido: ${nCob} cobrança(s), ${nPres} presença(s), ${nStat} estatística(s)`);
  });
}

async function salvaAtleta(id){
  const nome=fval('a_nome'); if(!nome){toast('Informe o nome');return;}
  const a=at(id);
  const isento=$('a_isento')?$('a_isento').checked:false;
  const patch={nome,apelido:fval('a_apelido')||'',fone:fval('a_fone'),oab:fval('a_oab'),posicao:fval('a_pos'),cargo:fval('a_cargo'),isento_mensalidade:isento};
  const travaDir=a.role==='diretoria'&&!me.fundador;
  if(!travaDir){ patch.role=fval('a_role')||a.role; patch.ativo=$('a_ativo').checked; }
  let {error}=await sb.from('perfis').update(patch).eq('id',id);
  if(error&&/apelido/.test(error.message||'')){
    delete patch.apelido;
    const {error:e2}=await sb.from('perfis').update(patch).eq('id',id);
    if(e2){toast('⚠️ '+e2.message);return;}
    toast('⚠️ Salvo sem o apelido — rode o SQL v13 no Supabase');
  } else if(error){toast('⚠️ '+error.message);return;}
  log('cadastro',`Cadastro atualizado: ${nome}`);
  // Se acabou de ficar isento, oferece limpar as mensalidades em aberto
  const abertas=isento?db.cobrancas.filter(c=>c.atletaId===id&&ehMensal(c)&&c.status!=='pago'):[];
  if(abertas.length){
    const tot=abertas.reduce((s,c)=>s+Number(valorDe(c)),0);
    confirma(`${esc(pnome(nome))} agora é <strong>isento de mensalidade</strong>, mas ainda tem <strong>${abertas.length} mensalidade(s) em aberto</strong> somando <strong>${brl(tot)}</strong>:<br><span class="mut">${abertas.slice(0,8).map(c=>esc(c.desc)+' — '+brl(valorDe(c))).join('<br>')}${abertas.length>8?'<br>…':''}</span><br><br>Excluir essas cobranças? (as já pagas ficam no histórico)`,async()=>{
      await q(sb.from('cobrancas').delete().in('id',abertas.map(c=>c.id)));
      log('financeiro',`Mensalidades em aberto excluídas por isenção: ${nome} (${abertas.length} cobranças, ${brl(tot)})`);
      await recarrega(); toast('🧤 '+abertas.length+' mensalidade(s) removida(s) — isenção aplicada');
    });
    await recarrega(); return;
  }
  fecha(); await recarrega(); toast('Salvo!');
}

function slotsDocs(aid,podeAnexar){
  const cats=[...db.config.docsObrig,...CATS_DOC.filter(c=>!db.config.docsObrig.includes(c))];
  return cats.map(cat=>{
    const files=db.arquivos.filter(d=>d.atletaId===aid&&d.categoria===cat);
    const obrig=db.config.docsObrig.includes(cat);
    if(!obrig&&!files.length&&!podeAnexar)return '';
    return `<div class="doc" style="flex-wrap:wrap;align-items:flex-start">
    <div style="flex:1;min-width:200px"><strong>${esc(cat)}</strong>
      ${obrig?(files.length?' <span class="pill p-ok">✔ enviado</span>':' <span class="pill p-bad">obrigatório — pendente</span>'):''}
      ${files.map(d=>`<div class="row" style="margin-top:6px;gap:6px;font-size:13px">📎 <span style="flex:1;min-width:120px">${esc(d.nome)} <span class="mut">· ${kb(d.tam)} · ${esc(d.quando)}</span></span>

        ${(me.role==='diretoria'||d.quem===me.nome)?`<button class="mini sec" onclick="removeArquivo('${d.id}')">✕</button>`:''}</div>`).join('')}
    </div>
    ${podeAnexar?`<button class="mini ${files.length?'sec':''}" onclick="anexaCat('${aid}','${esc(cat)}')">📎 Anexar</button>`:''}</div>`;
  }).join('');
}
function anexaCat(aid,cat){

async function carregaJSZip(){ if(window.JSZip)return;
  await new Promise((res,rej)=>{ const s=document.createElement('script'); s.src='https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js'; s.onload=res; s.onerror=()=>rej(new Error('sem internet para carregar o compactador')); document.head.appendChild(s); });
}
async function baixarZipPessoa(aid){
  const files=db.arquivos.filter(d=>d.atletaId===aid);
  if(!files.length){toast('Esta pessoa não tem documentos');return;}
  toast('Preparando o ZIP…');
  try{
    await carregaJSZip(); const zip=new JSZip();
    for(const d of files){ const {data,error}=await sb.storage.from('arquivos').createSignedUrl(d.path,300); if(error)continue;
      const bl=await (await fetch(data.signedUrl)).blob(); zip.file((d.categoria+' - '+d.nome).replace(/[\/\\]/g,'-'),bl); }
    baixar('documentos-'+pnome(nomeAt(aid)).toLowerCase()+'-'+hoje()+'.zip',await zip.generateAsync({type:'blob'}),'application/zip');
    log('docs',`${me.nome} baixou o ZIP de documentos de ${nomeAt(aid)}`);
    toast('ZIP baixado ✔');
  }catch(e){ toast('⚠️ '+e.message); }
}
async function baixarZipTodos(){
  if(!db.arquivos.length){toast('Nenhum documento no arquivo');return;}
  toast('Preparando o ZIP de todos — aguarde…');
  try{
    await carregaJSZip(); const zip=new JSZip();
    for(const d of db.arquivos){ const {data,error}=await sb.storage.from('arquivos').createSignedUrl(d.path,300); if(error)continue;
      const bl=await (await fetch(data.signedUrl)).blob();
      zip.folder(nomeAt(d.atletaId).replace(/[\/\\]/g,'-')).file((d.categoria+' - '+d.nome).replace(/[\/\\]/g,'-'),bl); }
    baixar('documentos-oab-master-'+hoje()+'.zip',await zip.generateAsync({type:'blob'}),'application/zip');
    log('docs',`${me.nome} baixou o ZIP GERAL de documentos (${db.arquivos.length} arquivos)`);
    toast('ZIP geral baixado ✔ — pronto para a inscrição');
  }catch(e){ toast('⚠️ '+e.message); }
}

/* ===== Metas do preparador físico (parâmetros fixos) ===== */
const numV=v=>{const n=parseFloat(String(v??'').replace(',','.'));return isNaN(n)?null:n;};
const NIVEIS=['Insuficiente','Regular','Bom','Ótimo','Excelente'];
const COR_NIVEL={Insuficiente:'p-bad',Regular:'p-warn',Bom:'p-mut',Ótimo:'p-ok','Excelente':'p-gold','Na meta':'p-ok','Acima da meta':'p-warn'};
/* Yo-yo test: distância em metros → nível (4.0 = 1200 m; cada 0.1 = 15 m) → VO2 máx estimado (Yo-yo IR1: d×0,0084+36,4) */
// Nível do Yo-yo (voltas .1 a .4 por nível: 1.1 … 1.4, 2.1 …) e distância (m) são lançados separadamente, como mostra o sistema do preparador
const yoyoNivelDe=v=>{const n=numV(v.yoyo);return n!=null&&n<50?n:null;};              // <50 = nível; valores antigos ≥50 eram distância
const yoyoDistDe=v=>{const d=numV(v.yoyoDist);if(d!=null)return Math.round(d);const n=numV(v.yoyo);return n!=null&&n>=50?Math.round(n):null;};
const yoyoVo2=d=>d==null?null:+(d*0.0084+36.4).toFixed(1);
function vo2De(v){ const d=yoyoDistDe(v); return d!=null?yoyoVo2(d):numV(v.vo2); }
const fmtNivel=n=>n==null?'—':n.toFixed(1);
const METAS_PREP=[
  {k:'gordura',ico:'🔥',nome:'% de gordura',unid:'%',sent:'down',meta:14,param:'Meta: 14% (considerando idade e perfil)',val:v=>numV(v.gordura)},
  {k:'yoyo',ico:'🏃',nome:'Yo-yo test',unid:'',sent:'up',param:'abaixo do nível 4 insuficiente · nível 4 bom · 5 ótimo · 6 excelente',val:v=>yoyoNivelDe(v),fmt:(n,v)=>`nível ${fmtNivel(n)}${v&&yoyoDistDe(v)!=null?` <span class="mut" style="font-size:11px">· ${yoyoDistDe(v)} m · VO2 ${yoyoVo2(yoyoDistDe(v))}</span>`:''}`},
  {k:'salto',ico:'🦵',nome:'Salto horizontal',unid:' cm',sent:'up',param:'1,00 m insuficiente · 1,50 regular · 1,70 bom · 2,00 ótimo · +2 m excelente',val:v=>melhorSalto(v)}];
/* Nota contínua 0–10 por indicador (piso = 0, meta = 10; evolução dá bônus) */
const REGUA_FIS={gordura:{piso:26,meta:14,sent:'down'},yoyo:{piso:1,meta:21,sent:'up'},salto:{piso:100,meta:200,sent:'up'}};
const yoyoVoltas=n=>n==null?null:(Math.floor(n)-1)*4+Math.round((n-Math.floor(n))*10); // 1.1→1 … 1.4→4, 2.1→5 … 6.1→21
function notaIndicador(k,n){ if(n==null)return null; const r=REGUA_FIS[k]; const v=k==='yoyo'?yoyoVoltas(n):n;
  const t=r.sent==='down'?(r.piso-v)/(r.piso-r.meta):(v-r.piso)/(r.meta-r.piso); return Math.round(Math.max(0,Math.min(1,t))*100)/10; }
function notaFisica(atId){
  const avs=db.avaliacoes.filter(v=>v.atletaId===atId).sort((a,b)=>String(a.data).localeCompare(String(b.data)));
  if(!avs.length)return null;
  const atual=avs[avs.length-1], ant=avs.length>1?avs[avs.length-2]:null;
  const itens=METAS_PREP.map(m=>{const n=m.val(atual); const nota=notaIndicador(m.k,n); const antN=ant?m.val(ant):null;
    const melhorou=(n!=null&&antN!=null)?(m.sent==='down'?n<antN:n>antN):false;
    return {k:m.k,ico:m.ico,nome:m.nome,n,nota,antN,melhorou,nv:nivelMeta(m.k,n)};}).filter(i=>i.n!=null);
  if(!itens.length)return null;
  const base=Math.round(itens.reduce((x,i)=>x+i.nota,0)/itens.length*10)/10;
  const bonus=Math.min(1.5,itens.filter(i=>i.melhorou).length*0.5);
  return {nota:Math.min(10,Math.round((base+bonus)*10)/10),base,bonus,itens,data:atual.data,temAnterior:!!ant};
}
function nivelMeta(k,n){
  if(n==null)return null;
  if(k==='gordura')return n<=14?{nivel:'Na meta',estrelas:3,txt:'✅ meta de 14% atingida'}:{nivel:'Acima da meta',estrelas:n<=16?2:n<=18?1:0,txt:`faltam ${(n-14).toFixed(1)} p.p. para a meta`};
  if(k==='yoyo'){const nv=n>=6?'Excelente':n>=5?'Ótimo':n>=4?'Bom':'Insuficiente';const est={Insuficiente:0,Bom:1,Ótimo:2,Excelente:3}[nv];
    const prox=n<4?[4,'bom']:n<5?[5,'ótimo']:n<6?[6,'excelente']:null;return {nivel:nv,estrelas:est,txt:prox?`falta chegar ao nível ${prox[0]}.1 para ${prox[1]}`:'🏆 nível máximo'};}
  if(k==='salto'){const nv=n>200?'Excelente':n>=200?'Ótimo':n>=170?'Bom':n>=150?'Regular':'Insuficiente';const est={Insuficiente:0,Regular:0.75,Bom:1.5,Ótimo:2.25,Excelente:3}[nv];
    const prox=n<150?[150,'regular']:n<170?[170,'bom']:n<200?[200,'ótimo']:n<=200?[201,'excelente']:null;return {nivel:nv,estrelas:est,txt:prox?`faltam ${prox[0]-n} cm para ${prox[1]}`:'🏆 nível máximo'};}
  return null;
}
const pillNivel=nv=>nv?`<span class="pill ${COR_NIVEL[nv.nivel]||'p-mut'}" style="font-size:10.5px">${nv.nivel}</span>`:'';
function ultimaAval(atId){ return db.avaliacoes.filter(v=>v.atletaId===atId).sort((a,b)=>String(b.data).localeCompare(String(a.data)))[0]||null; }
function metasDe(atId){
  const av=ultimaAval(atId); if(!av)return null;
  return METAS_PREP.map(m=>{const n=m.val(av);const nv=nivelMeta(m.k,n);return {...m,n,nv,data:av.data,av};});
}
function htmlMetasPrep(atId,pdf){
  const ms=metasDe(atId);
  const a=at(atId);
  if(!ms)return pdf?'':`<div class="card sect"><h2>🎯 Metas do preparador</h2><p class="mut">Sem avaliação física lançada ainda — faça a avaliação para ver suas metas.</p>${legendaMetas()}</div>`;
  const NF=notaFisica(atId);
  const notaDe2=k=>NF?NF.itens.find(i=>i.k===k):null;
  const linhas=ms.map(m=>{const it=notaDe2(m.k);return `<tr><td><strong>${m.ico} ${m.nome}</strong><div class="mut" style="font-size:11px">${m.param}</div></td>
    <td data-l="Marca atual">${m.n!=null?`<strong>${m.fmt?m.fmt(m.n,m.av):m.n+m.unid}</strong>${it&&it.antN!=null?`<div class="mut" style="font-size:11px">${it.melhorou?'📈 melhorou':'anterior'}: ${m.k==='yoyo'?'nível '+fmtNivel(it.antN):it.antN+m.unid}</div>`:''}`:'<span class="mut">não avaliado</span>'}</td>
    <td data-l="Nota">${it?`<strong style="font-size:17px;font-family:Georgia,serif">${it.nota.toFixed(1)}</strong>${it.melhorou?' <span class="pill p-ok" style="font-size:10px">+0,5 evolução</span>':''}`:'—'}</td>
    <td data-l="Situação">${m.nv?`${pillNivel(m.nv)}<div class="mut" style="font-size:11px">${m.nv.txt}</div>`:'—'}</td></tr>`;}).join('');
  if(pdf)return `<h2>🎯 Metas do preparador físico</h2><p class="sub">Parâmetros definidos pela comissão técnica · última avaliação em ${dbr(ms[0].data)}</p>
    <table><tr><th>Indicador / parâmetro</th><th>Marca atual</th><th>Nota (0–10)</th><th>Situação</th></tr>${linhas}</table>
    ${NF?`<p><strong>Nota física: ${NF.nota.toFixed(1)}</strong> (média dos indicadores ${NF.base.toFixed(1)}${NF.bonus?' + evolução '+NF.bonus.toFixed(1):''})</p>`:''}`;
  return `<div class="card sect"><div class="spread"><h2>🎯 Metas do preparador</h2>${NF?`<span class="pill p-gold" style="font-size:15px">Nota física ${NF.nota.toFixed(1)}</span>`:''}</div>
  <p class="mut" style="margin-top:0;font-size:12.5px">Parâmetros do preparador físico · última avaliação em ${dbr(ms[0].data)}${NF&&NF.bonus?` · <span style="color:var(--ok);font-weight:700">+${NF.bonus.toFixed(1)} de evolução</span>`:''}${NF&&!NF.temAnterior?' · na próxima avaliação, cada indicador que melhorar dá +0,5 na nota e +10 Pontos do Clube':''}</p>
  <div class="tblwrap"><table class="cardz"><tr><th>Indicador</th><th>Marca atual</th><th>Nota</th><th>Situação</th></tr>${linhas}</table></div>
  ${legendaMetas()}</div>`;
}
function legendaMetas(){
  return `<details style="margin-top:8px"><summary class="mut" style="cursor:pointer;font-size:12.5px">📏 Como funciona a classificação</summary>
  <p class="mut" style="font-size:12.5px;margin:6px 0 0">🔥 <strong>% de gordura</strong> — meta única de <strong>14%</strong>.<br>
  🏃 <strong>Yo-yo test</strong> — o nível tem 4 voltas (1.1, 1.2, 1.3, 1.4 → 2.1 …). Abaixo do nível 4 insuficiente · nível 4 bom · 5 ótimo · 6 excelente. A distância percorrida (m) é lançada à parte e gera o <strong>VO2 máx estimado</strong> pela fórmula do Yo-yo IR1: distância × 0,0084 + 36,4 (ml/kg/min).<br>
  🦵 <strong>Salto horizontal</strong> — 1,00 m insuficiente · 1,50 m regular · 1,70 m bom · 2,00 m ótimo · acima de 2 m excelente.<br>
  📐 <strong>Nota de 0 a 10 por indicador</strong>: piso vale 0 e meta vale 10, em régua contínua — gordura 26% → 14% · Yo-yo nível 1.1 → 6.1 · salto 100 cm → 200 cm. Quem está melhor pontua melhor, mesmo abaixo da meta.<br>
  📈 <strong>Nota física</strong> = média dos indicadores + 0,5 por indicador que melhorou desde a avaliação anterior (máx. +1,5; teto 10). Cada indicador melhorado também rende +10 Pontos do Clube. A nota física entra no card como FIS.</p></details>`;
}
function cardEvolucao(atId,titulo){
  const avs=db.avaliacoes.filter(v=>v.atletaId===atId).sort((a,b)=>String(a.data).localeCompare(String(b.data)));
  if(!avs.length)return '';
  if(avs.length<2)return `<div class="card sect"><h2>${titulo||'📈 Minha evolução'}</h2><p class="mut">Só há 1 avaliação (${dbr(avs[0].data)}). Na próxima avaliação os gráficos de evolução aparecem aqui — é o seu desafio! 💪</p></div>`;
  const M=[
    {t:'🔥 % de gordura',f:v=>numV(v.gordura),cor:'var(--bad)',sent:'down',metas:[[14,'meta']],u:'%'},
    {t:'🫁 VO2 máx estimado',f:v=>vo2De(v),cor:'var(--blue)',sent:'up',metas:[],u:''},
    {t:'🏃 Yo-yo test — nível',f:v=>yoyoNivelDe(v),cor:'var(--p)',sent:'up',metas:[[4,'bom'],[5,'ótimo'],[6,'excelente']],u:''},
    {t:'🏃 Yo-yo test — distância (m)',f:v=>yoyoDistDe(v),cor:'var(--p)',sent:'up',metas:[],u:' m'},
    {t:'🦵 Salto horizontal (cm)',f:v=>melhorSalto(v),cor:'var(--gold)',sent:'up',metas:[[150,'regular'],[170,'bom'],[200,'ótimo']],u:' cm'},
    {t:'💪 % massa muscular',f:v=>numV(v.massaMuscular),cor:'var(--ok)',sent:'up',metas:[],u:'%'},
    {t:'⚖️ Peso (kg)',f:v=>numV(v.peso),cor:'var(--ink2)',sent:'neutro',metas:[],u:' kg'}];
  const blocos=M.map(m=>{
    const vals=avs.map(v=>({d:v.data,n:m.f(v)})).filter(x=>x.n!=null);
    if(vals.length<2)return '';
    const max=Math.max(...vals.map(x=>x.n),...m.metas.map(x=>x[0]));
    const prim=vals[0].n, ult=vals[vals.length-1].n, d=+(ult-prim).toFixed(1);
    const bom=m.sent==='neutro'?null:(m.sent==='down'?d<0:d>0);
    const cor=d===0||bom===null?'var(--ink2)':bom?'var(--ok)':'var(--bad)';
    return `<div style="margin-bottom:14px"><div class="spread" style="margin-bottom:4px"><strong style="font-size:13.5px">${m.t}</strong><span style="color:${cor};font-weight:700;font-size:13px">${d>0?'▲ +':d<0?'▼ ':'• '}${d}${m.u} desde a 1ª</span></div>
    ${vals.map((x,i)=>`<div style="display:flex;align-items:center;gap:8px;margin-bottom:3px"><div class="mut" style="width:72px;font-size:11px;text-align:right">${dbr(x.d)}</div>
      <div style="flex:1;background:var(--bg2);border-radius:4px;height:16px;position:relative;overflow:hidden"><div style="width:${Math.max(3,Math.round(x.n/max*100))}%;height:100%;background:${m.cor};border-radius:4px;opacity:${i===vals.length-1?1:.55}"></div>
      ${m.metas.map(([mv,ml])=>`<div title="${ml}" style="position:absolute;top:0;bottom:0;left:${Math.round(mv/max*100)}%;width:2px;background:var(--ink);opacity:.35"></div>`).join('')}</div>
      <div style="width:58px;font-size:12px;font-weight:700">${x.n}${m.u}</div></div>`).join('')}
    ${m.metas.length?`<div class="mut" style="font-size:10.5px;margin-left:80px">marcas: ${m.metas.map(([mv,ml])=>`${mv}${m.u} ${ml}`).join(' · ')}</div>`:''}</div>`;
  }).filter(Boolean);
  if(!blocos.length)return '';
  return `<div class="card sect"><h2>${titulo||'📈 Minha evolução'}</h2><p class="mut" style="margin-top:0;font-size:12.5px">${avs.length} avaliações · de ${dbr(avs[0].data)} a ${dbr(avs[avs.length-1].data)} · as linhas marcam as metas do preparador</p>${blocos.join('')}</div>`;

const melhorSalto=v=>{const ns=[v.salto1,v.salto2,v.salto3].map(x=>parseFloat(String(x??'').replace(',','.'))).filter(n=>!isNaN(n));return ns.length?Math.max(...ns):null;};
function compareAvs(avsDesc){
  const atual=avsDesc[0], ant=avsDesc[1]||null, prim=avsDesc[avsDesc.length-1];
  const num=v=>{const n=parseFloat(String(v??'').replace(',','.'));return isNaN(n)?null:n;};
  const imcDe=v=>{const p=num(v.peso),a=num(v.altura);return p&&a?+(p/(a*a)).toFixed(1):null;};
  const M=[['Peso (kg)',v=>num(v.peso),'neutro'],['IMC',imcDe,'neutro'],['% Gordura',v=>num(v.gordura),'down'],
    ['Peso gordura (kg)',v=>num(v.pesoGordura),'down'],['Peso magro (kg)',v=>num(v.pesoMagro),'up'],['% Massa muscular',v=>num(v.massaMuscular),'up'],['🫁 VO2 máx (ml/kg/min)',v=>vo2De(v),'up'],['🏃 Yo-yo test — nível',v=>yoyoNivelDe(v),'up'],['🏃 Yo-yo test — distância (m)',v=>yoyoDistDe(v),'up'],['🦵 Salto horizontal — melhor (cm)',v=>melhorSalto(v),'up']];
  return M.map(([lb,f,sent])=>{
    const a=f(atual), vAnt=ant?f(ant):null, vIni=prim!==atual?f(prim):null;
    return {lb,atual:a,ant:vAnt,ini:vIni,
      d1:(a!=null&&vAnt!=null)?+(a-vAnt).toFixed(1):null,
      d2:(a!=null&&vIni!=null)?+(a-vIni).toFixed(1):null,sent};
  }).filter(m=>m.atual!=null||m.ini!=null||m.ant!=null);
}
function fmtDelta(d,sent,corOk,corBad,corMut){
  if(d==null)return `<span style="color:${corMut}">—</span>`;
  const seta=d>0?'▲':d<0?'▼':'•';
  const bom=sent==='neutro'?null:(sent==='down'?d<0:d>0);
  const cor=d===0||bom===null?corMut:(bom?corOk:corBad);
  return `<span style="color:${cor};font-weight:700">${seta} ${d>0?'+':''}${d}</span>`;
}

  const op=d=>id?sb.from('avaliacoes').update(d).eq('id',id).select():sb.from('avaliacoes').insert(d).select();
  let {data:res,error}=await op(dados);
  if(error&&/yoyo/.test(error.message||'')){
    delete dados.yoyo;
    const {data:r2,error:e2}=await op(dados);
    if(e2){toast('⚠️ '+e2.message);return;}
    res=r2; error=null; toast('⚠️ Salvo sem o Yo-yo test — rode o SQL v21 no Supabase');
  }
  if(error&&/peso_gordura|peso_magro|massa_muscular|salto1|salto2|salto3|forca|resistencia/.test(error.message||'')){
    delete dados.peso_gordura; delete dados.peso_magro; delete dados.massa_muscular; delete dados.salto1; delete dados.salto2; delete dados.salto3; delete dados.forca; delete dados.resistencia;
    const {data:r2,error:e2}=await op(dados);
    if(e2){toast('⚠️ '+e2.message);return;}
    res=r2; toast('⚠️ Salvo sem os campos novos — rode o SQL v20 no Supabase');
  } else if(error){toast('⚠️ '+error.message);return;}
  if(id&&(!res||!res.length)){toast('⚠️ O banco recusou a edição — verifique sua permissão');return;}
  log('avaliacao',`Avaliação física ${id?'editada':'registrada'}: ${nomeAt(aid)}`);

}

function notaAuto(x){

       -0.15*v('duelosPerdidos')-0.2*v('bolasPerdidas')-0.1*v('passesErrados')-0.1*v('faltasCometidas')-0.05*v('chutesErrados')-0.2*v('golsSofridos')-0.5*v('penaltisPerdidos')-0.4*v('penaltisCometidos')-0.7*v('golsContra')-0.3*v('amarelos')-(x&&x.vermelho?1:0);
  return Math.max(1,Math.min(10,Math.round(n*10)/10));
}

async function bumpTime(evId,k,delta){
  const e=byId(db.eventos,evId); if(!e)return;
  const st={...(e.statsTime||{})};
  st[k]=Math.max(0,(Number(st[k])||0)+delta);
  if(!st[k])delete st[k];
  const {error}=await sb.from('eventos').update({stats_time:st}).eq('id',evId);
  if(error){toast('⚠️ '+(/stats_time/.test(error.message||'')?'Rode o SQL v14 no Supabase para ativar as estatísticas do time':error.message));return;}
  e.statsTime=st; renderTab();
}

function proximaPatente(pts){ return PATENTES.find(pt=>pt[0]>pts)||null; }
function pontosCampo(atId,mesPrefix){
  // Pontos públicos (presenças e conquistas de campo) — iguais para todos os olhares
  let pts=0; const det=[];
  const peso={presente:0,atraso:1,justificada:2,falta:3};
  const porDia={};
  db.presencas.filter(pz=>pz.atletaId===atId).forEach(pz=>{
    const e=byId(db.eventos,pz.eventoId); if(!e)return;
    if(mesPrefix&&!e.data.startsWith(mesPrefix))return;
    const d=porDia[e.data]; const j=ehJogoTipo(e.tipo), t=ehTreinoTipo(e.tipo);
    if(!d||peso[pz.status]<peso[d.status]) porDia[e.data]={status:pz.status,jogo:j||(d?d.jogo:false),treino:t||(d?d.treino:false)};
    else{ if(j)d.jogo=true; if(t)d.treino=true; }
  });
  let pj=0,ptr=0,pa=0,pjus=0,pAtr=0;
  Object.values(porDia).forEach(d=>{ const base=d.jogo?15:10;
    if(d.status==='presente'){ pts+=base; d.jogo?pj++:ptr++; }
    else if(d.status==='atraso'){ pts+=base/2; pa++; pAtr+=base/2; }
    else if(d.status==='justificada'){ pts+=3; pjus++; } });
  if(pj)det.push({txt:'✅ Presenças em jogos',calc:pj+'× 15',pts:pj*15});
  if(ptr)det.push({txt:'🏃 Presenças em treinos',calc:ptr+'× 10',pts:ptr*10});
  if(pa)det.push({txt:'⏰ Atrasos (metade)',calc:pa+'×',pts:pAtr});
  if(pjus)det.push({txt:'📝 Faltas justificadas',calc:pjus+'× 3',pts:pjus*3});
  const evsMes=e=>!mesPrefix||e.data.startsWith(mesPrefix);
  const craques=db.eventos.filter(e=>evsMes(e)&&(()=>{const c=craqueDo(e.id);return c&&c.id===atId;})()).length;
  if(craques){ pts+=craques*15; det.push({txt:'🌟 Craque do Jogo (eleito)',calc:craques+'× 15',pts:craques*15}); }
  const notasAltas=db.stats.filter(x=>x.atletaId===atId&&notaConta(x.eventoId)&&(()=>{const e=byId(db.eventos,x.eventoId);return e&&evsMes(e);})()&&notaDe(x).v>=8).length;
  if(notasAltas){ pts+=notasAltas*10; det.push({txt:'⭐ Notas 8+ em jogos',calc:notasAltas+'× 10',pts:notasAltas*10}); }
  const mur=db.eventos.filter(e=>evsMes(e)&&ehJogoTipo(e.tipo)&&e.placarNos!=null&&Number(e.placarDeles)===0)
    .filter(e=>db.presencas.some(x=>x.eventoId===e.id&&x.atletaId===atId&&['presente','atraso'].includes(x.status))||db.stats.some(x=>x.eventoId===e.id&&x.atletaId===atId)).length;
  if(mur){ pts+=mur*5; det.push({txt:'🧱 Jogos sem sofrer gol',calc:mur+'× 5',pts:mur*5}); }
  return {pts:Math.round(pts),det};
}
function pontosPerfil(atId){

      const pz=db.presencas.find(x=>x.eventoId===e.id&&x.atletaId===atId);

    Object.entries(porMes).forEach(([m,o])=>{ if(!o.reg)return; const pct=o.pres.size/o.dias.size; if(m===mesAtual)andamento={pres:o.pres.size,dias:o.dias.size,pct}; if(pct>=0.75)ok++; });
    if(ok){ pts+=ok*40; det.push({txt:'🧤 Compromisso do mês cumprido (isento: 75% de presença)',calc:ok+'× 40',pts:ok*40}); }
    if(!andamento) miss.push({txt:'🧤 Compromisso do mês: presença em 75% das atividades (vale a cada mês, no lugar da mensalidade)',pts:40});
    else if(andamento.pct<0.75) miss.push({txt:`🧤 Compromisso do mês: presença em 75% das atividades — ${andamento.pres} de ${andamento.dias} dia${andamento.dias>1?'s':''} até agora`,pts:40});
  }

  if(nAv){ pts+=nAv*25; det.push({txt:'📋 Avaliações físicas realizadas',calc:nAv+'× 25',pts:nAv*25}); }
  if(nAv>=2){ const avsA=db.avaliacoes.filter(v=>v.atletaId===atId).sort((x,y)=>String(x.data).localeCompare(String(y.data))); let melh=0;
    for(let i=1;i<avsA.length;i++) METAS_PREP.forEach(m=>{const n=m.val(avsA[i]),an=m.val(avsA[i-1]); if(n!=null&&an!=null&&(m.sent==='down'?n<an:n>an))melh++;});
    if(melh){ pts+=melh*10; det.push({txt:'📈 Indicadores físicos melhorados',calc:melh+'× 10',pts:melh*10}); } }
  else miss.push({txt:'📋 Fazer a avaliação física',pts:25});
  const saudeOk=a.consent&&a.consent.aceito&&a.saude&&(a.saude.sangue||a.saude.emergencia||a.saude.plano||a.saude.alergias);
  if(saudeOk){ pts+=30; det.push({txt:'🩺 Ficha de saúde + termo LGPD',calc:'',pts:30}); }
  else miss.push({txt:'🩺 Completar a ficha de saúde (e aceitar o termo)',pts:30});
  if(db.config.docsObrig&&db.config.docsObrig.length){
    const docsOk=db.config.docsObrig.every(cat=>db.arquivos.some(d=>d.atletaId===atId&&d.categoria===cat));
    if(docsOk){ pts+=20; det.push({txt:'📁 Documentos obrigatórios completos',calc:'',pts:20}); }
    else miss.push({txt:'📁 Anexar os documentos obrigatórios',pts:20});
  }
  if(a.fotoUrl){ pts+=15; det.push({txt:'📸 Foto no card',calc:'',pts:15}); }
  else miss.push({txt:'📸 Enviar sua foto para o card',pts:15});
  const uniAceito=db.uniformes.some(u=>u.atletaId===atId&&u.status==='com_atleta');
  const uniPend=db.uniformes.some(u=>u.atletaId===atId&&u.status==='pendente');

  else if(uniPend) miss.push({txt:'👕 Aceitar o termo do uniforme',pts:10});
  return {pts,det,miss};
}

function craqueDo(evId){
  // Contagem vem de função sigilosa do banco — ninguém vê o voto individual dos outros
  const ts=(db.craqueTotais||[]).filter(t=>t.eventoId===evId);
  if(!ts.length)return null;
  const ord=[...ts].sort((a,b)=>b.votos-a.votos||nomeAt(a.votoId).localeCompare(nomeAt(b.votoId)));
  const total=ts.reduce((x,t)=>x+t.votos,0);
  return {id:ord[0].votoId,votos:ord[0].votos,total,ranking:ord.map(t=>[t.votoId,t.votos])};
}

async function salvaStatsAoVivo(evId){
  const temp=subState.statsTemp?.[evId]||{};
  if(!Object.keys(temp).length){toast('Nenhuma estatística para salvar');return;}
  const NOVOS=['antecipacao','duelos_aereos','chutes_gol','defesas','passes_errados','duelos_perdidos','bolas_perdidas','faltas_cometidas','chutes_errados','gols_sofridos','penaltis_perdidos','penaltis_cometidos','gols_contra'];
  let semNovos=false;
  const monta=st=>{ const d={gols:st.g||0,assist:st.as||0,duelos:st.due||0,antecipacao:st.ant||0,duelos_aereos:st.da||0,chutes_gol:st.ch||0,defesas:st.df||0,passes_errados:st.pe||0,duelos_perdidos:st.dp||0,bolas_perdidas:st.bp||0,faltas_cometidas:st.fc||0,chutes_errados:st.ce||0,gols_sofridos:st.gs||0,penaltis_perdidos:st.pp||0,penaltis_cometidos:st.pc||0,gols_contra:st.gco||0};
    if(semNovos)NOVOS.forEach(k=>delete d[k]); return d; };
  const grava=async(atId,st)=>{
    const dados=monta(st);
    const op=()=>String(atId).startsWith('conv_')
      ?sb.from('stats').insert({evento_id:evId,atleta_id:null,convidado:subState.convidadosDesemp?.[Number(atId.split('_')[1])],...dados})
      :sb.from('stats').upsert({evento_id:evId,atleta_id:atId,...dados},{onConflict:'evento_id,atleta_id'});
    let {error}=await op();
    if(error&&/antecipacao|duelos_aereos|chutes_gol|defesas|passes_errados|duelos_perdidos|bolas_perdidas|faltas_cometidas|chutes_errados|gols_sofridos|penaltis_perdidos|penaltis_cometidos|gols_contra/.test(error.message||'')){
      semNovos=true;
      const {error:e2}=await grava(atId,st)||{}; if(e2)throw e2; return;
    }
    if(error)throw error;
  };
  try{ for(const [atId,st] of Object.entries(temp)) await grava(atId,st); }
  catch(e){ toast('⚠️ '+e.message); return; }
  delete subState.statsTemp[evId];
  subState.convidadosDesemp=[];
  await recarrega();
  toast(semNovos?'⚠️ Salvo sem os itens novos — rode o SQL v11 no Supabase':'✅ Estatísticas salvas ao vivo!');
}

};
function formRows(f){
  if(FORMS[f])return FORMS[f];
  const m=/^Personalizado\s+([0-9]+(?:-[0-9]+)*)$/.exec(f||'');
  if(!m)return null;
  const nomes=['DEFESA','MEIO','ATAQUE'];
  const partes=m[1].split('-');
  const rows=[['GOLEIRO']];
  partes.forEach((qt,ri)=>{
    const base=partes.length<=3?(nomes[ri]||'LINHA'):'LINHA '+(ri+1);
    rows.push(Array.from({length:Math.min(Number(qt),8)},(_,i)=>base+' '+(i+1)));
  });
  return rows;
}
function esqCoords(e){
  let rows=formRows(e.formacao);
  if(!rows){ rows=[]; for(let i=0;i<e.posicoes.length;i+=3)rows.push(e.posicoes.slice(i,i+3).map(p=>p.lbl)); }
  const n=rows.length; let k=0; const out=[];
  rows.forEach((labels,ri)=>{ const y=n>1?88-ri*(74/(n-1)):50;
    labels.forEach((lbl,j)=>{ const p=e.posicoes[k]||{lbl};
      out.push({...p,lbl:p.lbl||lbl,x:p.x??((j+1)*100/(labels.length+1)),y:p.y??y}); k++; }); });
  return out;
}

  </div>
  ${e.descricao_jogo?`<p style="margin:10px 0 0;font-size:13px;background:var(--p-soft);padding:8px;border-radius:8px">💡 ${esc(e.descricao_jogo)}</p>`:''}`;

function ecLiga(){
  const c=$('ec_campo'); let di=null;
  const pct=ev=>{ const r=c.getBoundingClientRect(); return [Math.min(96,Math.max(4,(ev.clientX-r.left)/r.width*100)),Math.min(95,Math.max(4,(ev.clientY-r.top)/r.height*100))]; };
  c.onpointerdown=ev=>{ const t=ev.target.closest('.tok'); if(t){ di=+t.dataset.i; c.setPointerCapture(ev.pointerId); ev.preventDefault(); } };
  c.onpointermove=ev=>{ if(di!=null){ const [x,y]=pct(ev); ecSt.pos[di].x=x; ecSt.pos[di].y=y;
    const el=c.querySelector(`.tok[data-i="${di}"]`); if(el){ el.style.left=x+'%'; el.style.top=y+'%'; } } };
  c.onpointerup=()=>{ di=null; };
}

/* ---- Prancheta animada ---- */
let prSt=null;
const PR_DEFS=`<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#fff"/></marker><marker id="ah2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#F2C11E"/></marker></defs>`;
const prSeta=(x1,y1,x2,y2,cor,mk)=>`<line x1="${x1}%" y1="${y1}%" x2="${x2}%" y2="${y2}%" stroke="${cor}" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#${mk})"/>`;
function prSetaEl(x1,y1,x2,y2,cor,mk,cv,W,H){
  const X=v=>(v/100*W).toFixed(1), Y=v=>(v/100*H).toFixed(1);
  if(!cv) return `<line x1="${X(x1)}" y1="${Y(y1)}" x2="${X(x2)}" y2="${Y(y2)}" stroke="${cor}" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#${mk})"/>`;
  const mx=(x1+x2)/2, my=(y1+y2)/2, dx=x2-x1, dy=y2-y1;
  return `<path d="M ${X(x1)} ${Y(y1)} Q ${X(mx-dy*cv)} ${Y(my+dx*cv)} ${X(x2)} ${Y(y2)}" fill="none" stroke="${cor}" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#${mk})"/>`;
}
function abrirPrancheta(id){

  <label>Nome da jogada</label><input id="pr_nome" value="${esc(prSt.nome)}" placeholder="Ex.: Saída de bola pela direita">

    <button class="mini sec" id="prc_l" onclick="prCurva(-0.35)">⤺ Curva p/ cima</button>
    <button class="mini sec" id="prc_r" onclick="prCurva(0.35)">⤻ Curva p/ baixo</button>
  </div>
  <div class="prancheta" id="pr_campo"><div class="plin"></div><div class="pcirc"></div><svg class="setas" id="pr_svg"></svg></div>
  <p class="mut" style="margin-top:6px">Arraste os nomes no campo. Em <strong>🎯 Destino</strong>, arraste cada um até onde deve chegar — na reprodução eles se movem até lá (seta dourada mostra o trajeto). Em <strong>↗ Setas</strong>, desenhe arrastando sobre o campo (ex.: trajetória da bola). O <strong>traço escolhido</strong> (reta/curva) vale para as setas <em>e</em> para o deslocamento dos jogadores — com curva, eles correm fazendo a curva na reprodução. 🌀</p>
  <label>Observações</label><input id="pr_obs" value="${esc(prSt.obs)}">
  <div class="row" style="margin-top:12px"><button onclick="salvaPrancheta()">Salvar jogada</button><button class="sec" onclick="fecha()">Cancelar</button></div>`);
  prLiga(); prDesenha();
}
function prModo(m){ prSt.modo=m; ['mover','destino','seta'].forEach(v=>{ const b=$('prm_'+v); if(b)b.className='mini '+(v===m?'':'sec'); }); }
function prCurva(v){ prSt.curva=v; if($('prc_0'))$('prc_0').className='mini '+(v===0?'':'sec'); if($('prc_l'))$('prc_l').className='mini '+(v<0?'':'sec'); if($('prc_r'))$('prc_r').className='mini '+(v>0?'':'sec'); prModo('seta'); toast(v===0?'Setas retas':'Setas curvas '+(v<0?'para cima':'para baixo')+' — arraste no campo'); }
function prAddTok(n,bola,tipo){ if(!n)return; prSt.tokens.push({n,b:!!bola,x0:50,y0:bola?58:tipo==='adv'?20:82,x1:null,y1:null,tipo:tipo||'time'}); if($('pr_add'))$('pr_add').value=''; prDesenha(); }
function prDesenha(){
  const c=$('pr_campo'); if(!c)return;
  c.querySelectorAll('.tok').forEach(t=>t.remove());
  prSt.tokens.forEach((t,i)=>{
    const el=document.createElement('div');
    el.className='tok'+(t.b?' bola':t.tipo==='adv'?' adv':' time');
    el.textContent=t.n; el.dataset.i=i;
    el.style.left=t.x0+'%'; el.style.top=t.y0+'%';
    c.appendChild(el);
  });
  const svg=$('pr_svg'); if(!svg)return;
  const W=c.clientWidth||300, H=c.clientHeight||300;
  let s=PR_DEFS;
  prSt.setas.forEach(a=>{ s+=prSetaEl(a[0],a[1],a[2],a[3],'#fff','ah',a[4]||0,W,H); });
  prSt.tokens.filter(t=>t.x1!=null).forEach(t=>{ s+=prSetaEl(t.x0,t.y0,t.x1,t.y1,'#F2C11E','ah2',t.curva||0,W,H); });
  svg.innerHTML=s;
}
function prLiga(){
  const c=$('pr_campo'); let dragI=null, setaIni=null;
  const pct=ev=>{ const r=c.getBoundingClientRect(); return [Math.min(97,Math.max(3,(ev.clientX-r.left)/r.width*100)),Math.min(97,Math.max(3,(ev.clientY-r.top)/r.height*100))]; };
  c.onpointerdown=ev=>{
    if(prSt.modo==='seta'){ setaIni=pct(ev); c.setPointerCapture(ev.pointerId); ev.preventDefault(); return; }
    const tok=ev.target.closest('.tok');
    if(tok){ dragI=+tok.dataset.i; c.setPointerCapture(ev.pointerId); ev.preventDefault(); }
  };
  c.onpointermove=ev=>{
    if(dragI!=null){ const [x,y]=pct(ev); const t=prSt.tokens[dragI];
      if(prSt.modo==='destino'){ t.x1=x; t.y1=y; t.curva=prSt.curva||0; } else { t.x0=x; t.y0=y; }
      prDesenha(); }
  };
  c.onpointerup=ev=>{
    if(setaIni){ const [x,y]=pct(ev); if(Math.hypot(x-setaIni[0],y-setaIni[1])>4)prSt.setas.push([setaIni[0],setaIni[1],x,y,prSt.curva||0]); setaIni=null; prDesenha(); }
    dragI=null;
  };
}
async function salvaPrancheta(){
  const nome=fval('pr_nome'); if(!nome){toast('Dê um nome à jogada');return;}
  if(!prSt.tokens.length){toast('Adicione ao menos um atleta ao campo');return;}
  const dados={nome,formacao:'🎬 Prancheta',posicoes:{tokens:prSt.tokens,setas:prSt.setas},obs:fval('pr_obs')};
  if(prSt.editId) await q(sb.from('taticas_esquemas').update(dados).eq('id',prSt.editId));
  else await q(sb.from('taticas_esquemas').insert(dados));
  log('taticas',`Jogada animada ${prSt.editId?'atualizada':'criada'}: ${nome}`);
  fecha(); await recarrega(); toast('Jogada salva');
}
function verPrancheta(id){
  const e=byId(db.taticas.esquemas,id); const d=e.posicoes||{tokens:[],setas:[]};
  modal(`<h2>🎬 ${esc(e.nome)}</h2>
  <div class="prancheta" id="vw_campo"><div class="plin"></div><div class="pcirc"></div><svg class="setas" id="vw_svg"></svg>
  ${(d.tokens||[]).map((t,i)=>`<div class="tok ${t.b?'bola':t.tipo==='adv'?'adv':'time'}" id="vw_t${i}" style="left:${t.x0}%;top:${t.y0}%">${esc(t.n)}</div>`).join('')}</div>
  ${e.obs?`<p style="font-size:14px;margin-top:8px">📝 ${esc(e.obs)}</p>`:''}
  <div class="row" style="margin-top:10px"><button onclick="prPlay('${id}')">▶ Reproduzir</button><button class="sec" onclick="prReset('${id}')">↺ Início</button><button class="sec" onclick="fecha()">Fechar</button></div>`);
  const cv=$('vw_campo'), W=cv.clientWidth||300, H=cv.clientHeight||300;
  let s=PR_DEFS;
  (d.setas||[]).forEach(a=>{ s+=prSetaEl(a[0],a[1],a[2],a[3],'#fff','ah',a[4]||0,W,H); });
  (d.tokens||[]).filter(t=>t.x1!=null).forEach(t=>{ s+=prSetaEl(t.x0,t.y0,t.x1,t.y1,'#F2C11E','ah2',t.curva||0,W,H); });
  $('vw_svg').innerHTML=s;
}
function prPlay(id){ const d=byId(db.taticas.esquemas,id).posicoes;
  (d.tokens||[]).forEach((t,i)=>{ const el=$('vw_t'+i); if(!el||t.x1==null)return;
    el.classList.remove('mov');
    const cv=t.curva||0, dx=t.x1-t.x0, dy=t.y1-t.y0;
    const mx=(t.x0+t.x1)/2-dy*cv, my=(t.y0+t.y1)/2+dx*cv;
    const t0=performance.now(), dur=1600;
    const passo=n=>{ const u=Math.min(1,(n-t0)/dur);
      const e=u<.5?2*u*u:1-Math.pow(-2*u+2,2)/2;
      const X=(1-e)*(1-e)*t.x0+2*(1-e)*e*mx+e*e*t.x1;
      const Y=(1-e)*(1-e)*t.y0+2*(1-e)*e*my+e*e*t.y1;
      el.style.left=X+'%'; el.style.top=Y+'%';
      if(u<1)requestAnimationFrame(passo); };
    requestAnimationFrame(passo); }); }
function prReset(id){ const d=byId(db.taticas.esquemas,id).posicoes;
  (d.tokens||[]).forEach((t,i)=>{ const el=$('vw_t'+i); if(el){ el.classList.remove('mov'); el.style.left=t.x0+'%'; el.style.top=t.y0+'%'; } }); }

function aplicaFormCustom(){
  const v=fval('e_form_custom').replace(/\s/g,'');
  if(!/^[1-9](-[1-9]){0,4}$/.test(v)){toast('Formato inválido — use números separados por traço, ex.: 2-3-1');return;}
  const totLinha=v.split('-').reduce((s,n)=>s+Number(n),0);
  const nome='Personalizado '+v;
  const sel=$('e_form');
  if(![...sel.options].some(o=>o.value===nome)){const o=document.createElement('option');o.value=o.textContent=nome;sel.appendChild(o);}
  sel.value=nome; trocaForm(nome);
  toast(`✏️ Formação ${v} aplicada — goleiro + ${totLinha} de linha`);
}
function esqSlotsHTML(f,pos){

    html+=`<div><label>${lbl}</label><select class="esq_sel" data-lbl="${lbl}"><option value="">—</option>${ats.map(a=>`<option value="${a.id}" ${a.id===atual?'selected':''}>${esc(a.nome)}</option>`).join('')}</select>
    <input class="esq_num" value="${esc(numAtual)}" placeholder="ou só o nº da camisa" style="margin-top:4px;font-size:13px"></div>`; }); });

async function salvaEsquema(id){
  const nome=fval('e_nome'); if(!nome){toast('Dê um nome ao esquema');return;}
  const sels=[...document.querySelectorAll('.esq_sel')], nums=[...document.querySelectorAll('.esq_num')];
  const posicoes=sels.map((s,i)=>({lbl:s.dataset.lbl,atletaId:s.value,num:(nums[i]?nums[i].value.trim():'')}));
  if(id){ const antigo=byId(db.taticas.esquemas,id);
    if(antigo&&antigo.formacao===fval('e_form')) posicoes.forEach((p,i)=>{ const o=antigo.posicoes[i]; if(o&&o.x!=null){ p.x=o.x; p.y=o.y; } }); }

  const temAdv=$('e_adv_check').checked;
  const dados={nome,formacao:fval('e_form'),posicoes,obs:fval('e_obs')};

  if(temAdv){
    const nomesAdv=[...document.querySelectorAll('.esq_adv_nome')].map(e=>e.value.trim());
    const numsAdv=[...document.querySelectorAll('.esq_adv_num')].map(e=>e.value.trim());
    const posAdv=nomesAdv.map((n,i)=>({lbl:n,num:numsAdv[i]||''})).filter(p=>p.lbl);
    dados.adversario={nome:fval('e_adv_nome'),posicoes:posAdv};
    dados.placar={time:Number(fval('e_placar_time'))||0,adversario:Number(fval('e_placar_adv'))||0};
    dados.data_jogo=fval('e_data_jogo')||null;
    dados.performance=fval('e_performance')||'';
    dados.descricao_jogo=fval('e_desc_jogo')||'';
  } else {
    dados.adversario=null;
    dados.placar=null;
    dados.data_jogo=null;
    dados.performance='';
    dados.descricao_jogo='';
  }

  if(id) await q(sb.from('taticas_esquemas').update(dados).eq('id',id));
  else await q(sb.from('taticas_esquemas').insert(dados));
  log('taticas',`Esquema ${id?'atualizado':'criado'}: ${nome}${temAdv?' × '+fval('e_adv_nome'):''}`);
  fecha(); await recarrega(); toast('Esquema salvo');
}

function tAgenda(){

  const jogosPlacar=db.eventos.filter(e=>ehJogoTipo(e.tipo)&&e.placarNos!=null&&e.placarDeles!=null).sort((a,b)=>b.data.localeCompare(a.data));

async function salvaEvento(id){
  const t=fval('e_tit'),d=fval('e_data'); if(!t||!d){toast('Informe título e data');return;}
  const hIni=fval('e_hora')||'19:00', hFim=fval('e_horafim')||'', dFim=fval('e_datafim')||'';
  if(hFim&&hFim<=hIni&&(!dFim||dFim===d)){toast('A hora de fim deve ser depois da hora de início');return;}
  if(dFim&&dFim<d){toast('A data de término deve ser igual ou depois da data de início');return;}
  let dados={tipo:fval('e_tipo'),titulo:t,data:d,data_fim:dFim||null,hora:hIni,hora_fim:hFim||null,local:fval('e_local'),obs:fval('e_obs')};
  // Se o banco ainda não tem as colunas novas, salva sem elas e avisa
  const semColuna=async op=>{
    let {error}=await op(dados);
    if(error&&/hora_fim|data_fim/.test(error.message||'')){
      delete dados.hora_fim; delete dados.data_fim;
      const {error:e2}=await op(dados);
      if(e2){toast('⚠️ '+e2.message);throw e2;}
      toast('⚠️ Salvo sem hora/data de fim — rode o SQL v9 no Supabase para ativá-las');
    } else if(error){toast('⚠️ '+error.message);throw error;}
  };
  if(id){
    await semColuna(dd=>sb.from('eventos').update(dd).eq('id',id));
    log('agenda',`Compromisso editado: ${t} (${dbr(d)})`);
    toast('Compromisso atualizado');
  }else{
    await semColuna(dd=>sb.from('eventos').insert(dd));
    log('agenda',`Compromisso criado: ${t} (${dbr(d)})`);
    enviarPush('🗓️ '+db.config.time+' — novo compromisso',`${t} — ${dbr(d)} às ${fval('e_hora')||'19:00'}`);
    toast('Compromisso criado');
  }
  fecha(); await recarrega();
}

    const idx=Number(aid.split('_')[1]);
    const nomeConv=subState.convidadosPres?.[idx];
    const i=db.presencas.findIndex(p=>p.eventoId===ev&&!p.atletaId&&p.convidado===nomeConv);
    if(i>=0&&db.presencas[i].status===st){
      // Tocar de novo no mesmo botão desmarca
      await q(sb.from('presencas').delete().eq('evento_id',ev).eq('convidado',nomeConv));
      db.presencas.splice(i,1); renderTab(); toast('Marcação removida'); return;
    }
    const {data:upd}=await sb.from('presencas').update({status:st}).eq('evento_id',ev).eq('convidado',nomeConv).select();
    if(!upd||!upd.length) await q(sb.from('presencas').insert({evento_id:ev,atleta_id:null,convidado:nomeConv,status:st}));
    if(i>=0)db.presencas[i].status=st; else db.presencas.push({eventoId:ev,atletaId:null,convidado:nomeConv,status:st});
  }else{
    const i=db.presencas.findIndex(p=>p.eventoId===ev&&p.atletaId===aid);
    if(i>=0&&db.presencas[i].status===st){
      // Tocar de novo no mesmo botão desmarca
      await q(sb.from('presencas').delete().eq('evento_id',ev).eq('atleta_id',aid));
      db.presencas.splice(i,1); renderTab(); toast('Marcação removida'); return;
    }
    await q(sb.from('presencas').upsert({evento_id:ev,atleta_id:aid,status:st},{onConflict:'evento_id,atleta_id'}));
    if(i>=0)db.presencas[i].status=st; else db.presencas.push({eventoId:ev,atletaId:aid,status:st});
  }
  renderTab();
}

function copiarFrequencia(evDestino){
  const destino=byId(db.eventos,evDestino); if(!destino)return;
  const fontes=[...new Set(db.presencas.map(p=>p.eventoId))].filter(id=>id!==evDestino)
    .map(id=>({e:byId(db.eventos,id),n:db.presencas.filter(p=>p.eventoId===id).length}))
    .filter(x=>x.e).sort((a,b)=>b.e.data.localeCompare(a.e.data));
  if(!fontes.length){toast('Nenhuma outra chamada registrada ainda');return;}
  modal(`<h2>📋 Copiar chamada</h2>
  <p class="mut">Traz todas as marcações (presenças, faltas, atrasos — atletas e convidados) de outro compromisso para <strong>${esc(destino.titulo)}</strong> (${dbr(destino.data)}). O que já estiver marcado no destino é atualizado, e depois você pode ajustar caso a caso.</p>
  <label>Copiar de</label><select id="cf_fonte">${fontes.map(x=>`<option value="${x.e.id}">${dbr(x.e.data)} — ${tipoEvIco(x.e.tipo)} ${esc(x.e.titulo)} (${x.n} marcações)</option>`).join('')}</select>
  <div class="row" style="margin-top:14px"><button id="btn_cfreq" onclick="copiarFrequenciaGo('${evDestino}')">📋 Copiar marcações</button><button class="sec" onclick="fecha()">Cancelar</button></div>`);
}
async function copiarFrequenciaGo(destino){
  const fonte=fval('cf_fonte'); if(!fonte)return;
  const b=$('btn_cfreq'); if(b)b.disabled=true;
  const marcas=db.presencas.filter(p=>p.eventoId===fonte);
  let n=0;
  for(const p of marcas){
    if(p.atletaId){
      const {error}=await sb.from('presencas').upsert({evento_id:destino,atleta_id:p.atletaId,status:p.status},{onConflict:'evento_id,atleta_id'});
      if(!error)n++;
    }else if(p.convidado){
      const {data:upd}=await sb.from('presencas').update({status:p.status}).eq('evento_id',destino).eq('convidado',p.convidado).select();
      if(!upd||!upd.length){ const {error}=await sb.from('presencas').insert({evento_id:destino,atleta_id:null,convidado:p.convidado,status:p.status}); if(!error)n++; }
      else n++;
    }
  }
  const f=byId(db.eventos,fonte), d=byId(db.eventos,destino);
  log('presenca',`Chamada copiada: ${f?f.titulo:''} → ${d?d.titulo:''} (${n} marcações)`);
  fecha(); await recarrega(); toast(`📋 ${n} marcação(ões) copiada(s) — ajuste o que precisar`);
}
function csvFaltas(){

}
function pdfFrequencia(){
  const ats=elenco();
  const rank=ats.map(a=>{const q=freqAtleta(a.id);return {a,...q};}).filter(r=>r.tot>0).sort((x,y)=>(y.pct-x.pct)||(y.jg+y.tr)-(x.jg+x.tr));
  if(!rank.length){toast('Nenhuma chamada registrada ainda');return;}
  const evsComChamada=[...new Set(db.presencas.map(p=>p.eventoId))].map(id=>byId(db.eventos,id)).filter(Boolean);
  const diasJogo=new Set(evsComChamada.filter(e=>ehJogoTipo(e.tipo)).map(e=>e.data));
  const nJogos=diasJogo.size, nTreinos=new Set(evsComChamada.filter(e=>ehTreinoTipo(e.tipo)).map(e=>e.data)).size;
  const totF=rank.reduce((s,r)=>s+r.f,0), totAt=rank.reduce((s,r)=>s+r.at,0), totJ=rank.reduce((s,r)=>s+r.j,0);
  const pctMedia=Math.round(rank.reduce((s,r)=>s+r.pct,0)/rank.length);
  const corPct=v=>v>=75?'ok':v>=50?'warn':'bad';
  abreRelatorio(`<h1>📊 Relatório de Frequência</h1>
  <p class="sub">${esc(db.config.time)} — contagem por dia: treino + jogo na mesma data valem uma presença/falta só</p>
  <div class="cards">
    <div class="card"><div class="n">${nJogos+nTreinos}</div><div class="l">Dias c/ chamada</div></div>
    <div class="card"><div class="n">${nJogos}</div><div class="l">Dias de jogo</div></div>
    <div class="card"><div class="n">${nTreinos}</div><div class="l">Dias de treino</div></div>
    <div class="card"><div class="n ${corPct(pctMedia)}">${pctMedia}%</div><div class="l">Freq. média</div></div>
    <div class="card"><div class="n bad">${totF}</div><div class="l">Faltas</div></div>
    <div class="card"><div class="n warn">${totAt}</div><div class="l">Atrasos</div></div>
    <div class="card"><div class="n">${totJ}</div><div class="l">Justificadas</div></div>
  </div>
  <h2>🏅 Ranking de participação</h2>
  <table><tr><th>#</th><th>Atleta</th><th>Jogos</th><th>Treinos</th><th>Presenças</th><th>Atrasos</th><th>Faltas</th><th>Justif.</th><th>Frequência</th></tr>
  ${rank.map((r,i)=>`<tr><td>${i+1}º</td><td><strong>${esc(r.a.nome)}</strong></td><td>${r.jg}</td><td>${r.tr}</td><td>${r.jg+r.tr}</td><td>${r.at}</td><td>${r.f}${db.config.limiteFaltas>0&&r.f>=db.config.limiteFaltas?' ⚠️':''}</td><td>${r.j}</td><td class="${corPct(r.pct)}"><strong>${r.pct}%</strong></td></tr>`).join('')}</table>
  <p style="font-size:11.5px;color:#8a8f99">${db.config.limiteFaltas>0?`⚠️ = atingiu o limite de ${db.config.limiteFaltas} faltas · `:''}Presenças e atrasos contam como comparecimento.</p>`,`Frequência — ${db.config.time}`);
}

function tFinBalancoDesp(){
  const despesas=db.despesas||[];
  const hoje_str=hoje();
  const totalPago=despesas.filter(d=>d.pago).reduce((s,d)=>s+Number(d.valor),0);
  const totalPendente=despesas.filter(d=>!d.pago).reduce((s,d)=>s+Number(d.valor),0);

  // Agrupar por categoria
  const grupos={};
  despesas.forEach(d=>{
    if(!grupos[d.categoria]) grupos[d.categoria]=[];
    grupos[d.categoria].push(d);
  });

  const categorias=Object.keys(grupos).sort();

  return `<div class="card sect">
  <div class="spread" style="margin-bottom:12px"><h2 style="margin:0">💸 Despesas</h2></div>
  <div class="row sect">
    <button class="mini" onclick="abreLancadorDespesa()">➕ Lançar despesa</button>
    <button class="gold mini" onclick="lancadorRecorrenteDespesa()">🔄 Recorrente</button>
  </div>
  <div style="margin:12px 0;font-size:13px">
    <div class="spread"><span>Total pago:</span><strong style="color:var(--ok)">${brl(totalPago)}</strong></div>
    <div class="spread"><span>Total pendente:</span><strong style="color:var(--warn)">${brl(totalPendente)}</strong></div>
  </div>
  <div id="selbar_d" class="alertline al-bad sect" style="display:${selDesp.size?'flex':'none'};align-items:center">✓ <strong><span id="selct_d">${selDesp.size}</span> selecionada(s)</strong><span style="flex:1"></span><button class="mini gold" onclick="pagaDespesasSelec()">Pagar selecionadas</button><button class="bad mini" onclick="delSelDesp()">Excluir selecionadas</button><button class="mini sec" onclick="selDesp.clear();renderTab()">Limpar</button></div>

  ${categorias.length===0?'<p class="mut">Nenhuma despesa registrada.</p>':''}

  ${categorias.map(cat=>{
    const items=grupos[cat];
    const pagos=items.filter(d=>d.pago).length;
    const valor_pago=items.filter(d=>d.pago).reduce((s,d)=>s+Number(d.valor),0);
    const vencidos=items.filter(d=>!d.pago&&d.data<hoje_str).length;
    return `<details>
      <summary style="cursor:pointer;font-weight:bold;padding:8px;background:var(--bg2);border-radius:4px">
        ${esc(cat)}
        <span class="pill p-ok">${brl(valor_pago)} pago</span>
        ${pagos<items.length?`<span class="pill p-warn">${items.length-pagos} pendente</span>`:''}
        ${vencidos?`<span class="pill p-bad">${vencidos} vencido</span>`:''}
      </summary>
      <div style="padding:8px;background:var(--bg3);border-radius:4px;margin-top:4px">
        ${items.sort((a,b)=>b.data.localeCompare(a.data)).map(d=>{
          const venc=d.data<hoje_str;
          const bg=d.pago?'var(--ok-soft)':venc?'var(--bad-soft)':'var(--warn-soft)';
          return `<div class="alertline" style="background:${bg};margin-bottom:6px;cursor:pointer" onclick="mostraDetalheDespesa('${d.id}')">
            <input type="checkbox" ${d.pago?'disabled':''}  onchange="selTog('d','${d.id}',this.checked);event.stopPropagation()" ${selDesp.has(d.id)?'checked':''} style="width:auto">
            <div style="flex:1;font-size:12px">
              <div><strong>${dbr(d.data)}</strong> ${d.pago?'🟢 Pago':venc?'🔴 Vencido':'🟡 Pendente'}</div>
              <div class="mut">${esc(d.item)} · ${esc(d.categoria)}${d.pessoa?` — ${esc(d.pessoa)}`:''}${d.detalhes?` (${esc(d.detalhes.substring(0,30))}...)`:''}</div>
            </div>
            <div style="text-align:right">
              <div>${brl(d.valor)}</div>
            </div>
            <button class="mini gold" onclick="event.stopPropagation();editaDespesa('${d.id}')">✏️</button>
            <button class="mini ${d.pago?'sec':'gold'}" onclick="event.stopPropagation();marcaDespesaPago('${d.id}',${!d.pago})">
              ${d.pago?'Desfazer':'Pago'}
            </button>
            <button class="mini sec" onclick="event.stopPropagation();delDespesa('${d.id}')">✕</button>
          </div>`;
        }).join('')}
      </div>
    </details>`;
  }).join('')}
  </div>`;
}
